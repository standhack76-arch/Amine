          chmod +x /opt/zygor/bin/social_engineer.py

      - name: '🏁 Build CTF Solver'
        shell: bash
        run: |
          cat > /opt/zygor/bin/ctf_solver.py << 'CTFEOF'
#!/usr/bin/env python3
import subprocess, sys, json
TYPES = {"web":["sqlmap","dirb","gobuster"],"crypto":["openssl","john","hashcat"],"reverse":["strings","gdb"],"pwn":["python3","pwntools"],"forensics":["binwalk","strings"],"stego":["steghide","zsteg"],"osint":["dig","whois"],"misc":["file","strings"]}
