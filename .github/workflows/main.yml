    needs: [bootstrap, recon, exploitation, reverse_engineering, web_forge, post_exploitation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 'Generate Final Report'
        run: |
          echo "Compiling final pentest report..."
          python3 /opt/zygor/bin/generate_dashboard.py "${TARGET}"
          prompt="Generate executive summary for target ${TARGET} covering recon, exploits, reverse engineering, and persistence. Watermark: @zygorlap"
          echo "$prompt" | /opt/zygor/bin/ai_complete 4096 > /opt/zygor/reports/final_report.txt
          echo "Report ready."
