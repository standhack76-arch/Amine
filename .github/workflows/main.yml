          #!/usr/bin/env python3
          import subprocess, sys, json
          CHALLENGE_TYPES = {"web":["sqlmap","dirb"],"crypto":["openssl","john"],"reverse":["strings","gdb"],"pwn":["pwntools"],"forensics":["binwalk"],"stego":["steghide"],"osint":["dig"],"misc":["python3"]}
          def identify_challenge_type(files):
