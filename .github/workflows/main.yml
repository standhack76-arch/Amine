# =============================================================================
# ZYGOR v4.1 ULTIMATE – FULLY FIXED – 24/7 AI PENTEST FRAMEWORK
# =============================================================================
name: ZYGOR v4.1 Ultimate – Ollama AI Red Team

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Target IP/CIDR/Domain"
        required: true
        default: "127.0.0.1"
      lhost:
        description: "Listener IP for shells"
        required: false
        default: ""
      lport:
        description: "Listener port"
        required: false
        default: "4444"
      ai_model:
        description: "Primary Ollama model"
        required: true
        default: "mistral:7b-instruct-q4_K_M"
        type: choice
        options:
          - mistral:7b-instruct-q4_K_M
          - mistral:7b-instruct-q8_0
          - hermes-3-llama-3.2-uncensored:latest
          - wizard-vicuna-uncensored:latest
          - neural-chat:7b-v3
          - phi-3:3.8b-mini-instruct-q4_0
          - orca-mini:3b
      penetration_phase:
        description: "Attack phase(s)"
        required: true
        default: "full"
        type: choice
        options:
          - recon
          - exploitation
          - web_forge
          - reverse_engineering
          - post_exploitation
          - full
      enable_exfiltration:
        description: "Enable exfiltration/persistence simulation"
        default: "false"
        type: choice
        options: ["true", "false"]
      run_duration_hours:
        description: "Max run time (hours)"
        default: "6"
        type: choice
        options: ["1", "2", "3", "4", "5", "6", "8", "12"]
      telegram_enable:
        description: "Enable Telegram bot"
        default: "true"
        type: choice
        options: ["true", "false"]
      telegram_chat_id:
        description: "Authorised Telegram chat ID"
        required: false
        default: ""
      telegram_bot_token:
        description: "Telegram Bot Token"
        required: false
        default: ""
      enable_social_engineering:
        description: "Social engineering simulation"
        default: "false"
        type: choice
        options: ["true", "false"]
      ctf_mode:
        description: "CTF solver mode"
        default: "false"
        type: choice
        options: ["true", "false"]
      cloud_vm_provider:
        description: "Cloud provider for ephemeral VMs (optional)"
        default: "none"
        type: choice
        options: ["none", "aws", "gcp", "azure"]
      report_email:
        description: "Email for final report"
        required: false
        default: ""
      discord_webhook:
        description: "Discord webhook URL"
        required: false
        default: ""
      slack_webhook:
        description: "Slack webhook URL"
        required: false
        default: ""
      session_token:
        description: "Session continuity token (auto-generated, do not modify)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  security-events: write
  deployments: write
  packages: write
  statuses: write

env:
  OLLAMA_HOST: "0.0.0.0:11434"
  OLLAMA_READ_TIMEOUT: "3600"
  OLLAMA_KEEP_ALIVE: "24h"
  OLLAMA_MODEL_CACHE: "/home/runner/.ollama/models"
  TARGET: ${{ github.event.inputs.target || '127.0.0.1' }}
  LHOST: ${{ github.event.inputs.lhost || '' }}
  LPORT: ${{ github.event.inputs.lport || '4444' }}
  AI_MODEL: ${{ github.event.inputs.ai_model || 'mistral:7b-instruct-q4_K_M' }}
  PHASE: ${{ github.event.inputs.penetration_phase || 'full' }}
  ENABLE_EXFIL: ${{ github.event.inputs.enable_exfiltration || 'false' }}
  MAX_HOURS: ${{ github.event.inputs.run_duration_hours || '6' }}
  TELEGRAM_ENABLE: ${{ github.event.inputs.telegram_enable || 'true' }}
  TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || '' }}
  TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN || '' }}
  SOCIAL_ENG: ${{ github.event.inputs.enable_social_engineering || 'false' }}
  CTF_MODE: ${{ github.event.inputs.ctf_mode || 'false' }}
  CLOUD_VM: ${{ github.event.inputs.cloud_vm_provider || 'none' }}
  REPORT_EMAIL: ${{ github.event.inputs.report_email || '' }}
  DISCORD_WEBHOOK: ${{ github.event.inputs.discord_webhook || '' }}
  SLACK_WEBHOOK: ${{ github.event.inputs.slack_webhook || '' }}
  SESSION_TOKEN: ${{ github.event.inputs.session_token || '' }}
  GITHUB_REPO: ${{ github.repository }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}
  GITHUB_ACTOR: ${{ github.actor }}
  WF_NAME: ${{ github.workflow }}
  WORKFLOW_ID: ${{ github.workflow_id }}

jobs:
  bootstrap:
    name: "ZYGOR Bootstrap"
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    outputs:
      ai_ready: ${{ steps.ai_status.outputs.ok }}
      model_pulled: ${{ steps.pull_model.outputs.pulled }}
      final_model: ${{ steps.pull_model.outputs.final_model }}
      session_token: ${{ steps.session.outputs.token }}
      target: ${{ env.TARGET }}
      lhost: ${{ env.LHOST }}
      lport: ${{ env.LPORT }}
      max_hours: ${{ env.MAX_HOURS }}
      telegram_enable: ${{ env.TELEGRAM_ENABLE }}
      telegram_chat_id: ${{ env.TELEGRAM_CHAT_ID }}
      telegram_bot_token: ${{ env.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: "Generate session token"
        id: session
        shell: bash
        run: |
          if [ -z "$SESSION_TOKEN" ]; then
            TOKEN="zygor-$(date +%s)-$(head -c 16 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)"
          else
            TOKEN="$SESSION_TOKEN"
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "SESSION_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: "AGGRESSIVE DISK EXPANSION"
        shell: bash
        run: |
          echo ">>> [DISK] Initial: $(df -h / | tail -1 | awk '{print $4}') free"
          sudo rm -rf /usr/share/dotnet 2>/dev/null; echo "[+] Removed .NET"
          sudo rm -rf /opt/ghc 2>/dev/null; echo "[+] Removed GHC"
          sudo rm -rf /usr/local/lib/android 2>/dev/null; echo "[+] Removed Android SDK"
          sudo docker system prune -af 2>/dev/null || true; echo "[+] Pruned Docker"
          sudo apt-get clean && sudo apt-get autoclean && sudo rm -rf /var/lib/apt/lists/*
          echo "[+] Final: $(df -h / | tail -1 | awk '{print $4}') free"

      - name: "Cache Ollama models"
        id: cache_ollama
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODEL_CACHE }}
          key: ollama-${{ env.AI_MODEL }}-v4.1
          restore-keys: |
            ollama-${{ env.AI_MODEL }}-
            ollama-

      - name: "Install toolchain"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl wget git jq nmap masscan netcat-openbsd metasploit-framework \
            nuclei ffuf sqlmap john hashcat hashid seclists \
            mitm6 responder impacket-scripts dnsutils hydra medusa \
            subfinder amass nikto gobuster whatweb exploitdb \
            steghide binwalk foremost exiftool openvpn tor proxychains4 2>/dev/null || true
          pip3 install --quiet --break-system-packages pwntools requests beautifulsoup4 \
            shodan python-nmap bloodhound-py python-telegram-bot dnspython flask \
            colorama tqdm rich aiohttp asyncio scapy cryptography paramiko \
            keystone-engine capstone pefile yara-python frida-tools 2>/dev/null || true

      - name: "Create runtime directories"
        shell: bash
        run: |
          sudo mkdir -p /opt/zygor/{bin,templates,wordlists,payloads,reports/{recon,exploitation,web_forge,reverse_eng,post_exploitation,final},logs,c2,phish,forensics}
          sudo mkdir -p /var/log/zygor /var/lib/zygor/data /var/lib/zygor/uploads
          sudo chmod -R 777 /opt/zygor /var/log/zygor /var/lib/zygor
          echo "${{ steps.session.outputs.token }}" > /opt/zygor/.session_token

      - name: "Install Ollama & start"
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          OLLAMA_KEEP_ALIVE="${OLLAMA_KEEP_ALIVE}" OLLAMA_READ_TIMEOUT="${OLLAMA_READ_TIMEOUT}" ollama serve > /var/log/zygor/ollama.log 2>&1 &
          for i in $(seq 1 120); do
            curl -s http://localhost:11434/api/tags >/dev/null 2>&1 && echo "[+] Ollama ready in ${i}s" && sleep 2 && break
            [ $((i % 10)) -eq 0 ] && echo "[*] Waiting... ${i}s"
            sleep 1
          done
          curl -s http://localhost:11434/api/tags >/dev/null 2>&1 || { echo "[-] Ollama failed"; tail -20 /var/log/zygor/ollama.log; exit 1; }

      - name: "Pull AI model (fallback chain)"
        id: pull_model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="${{ env.AI_MODEL }}"
          FALLBACKS=(
            "mistral:7b-instruct-q4_K_M"
            "phi-3:3.8b-mini-instruct-q4_0"
            "neural-chat:7b-v3"
            "orca-mini:3b"
          )
          pull_with_retry() {
            local model="$1"
            for attempt in 1 2 3; do
              echo ">>> Pull attempt $attempt/3: $model"
              if timeout 1800 ollama pull "$model" 2>&1; then
                echo "[✓] Pulled: $model"; return 0
              fi
              [ $attempt -lt 3 ] && sleep $((attempt * 30))
            done
            return 1
          }
          pull_with_retry "$MODEL" || {
            for fb in "${FALLBACKS[@]}"; do
              [ "$fb" = "$MODEL" ] && continue
              echo "[*] Fallback: $fb"
              pull_with_retry "$fb" && { echo "final_model=$fb" >> $GITHUB_OUTPUT; echo "pulled=true" >> $GITHUB_OUTPUT; exit 0; }
            done
            echo "pulled=false" >> $GITHUB_OUTPUT; echo "final_model=none" >> $GITHUB_OUTPUT; exit 1
          }
          echo "final_model=$MODEL" >> $GITHUB_OUTPUT; echo "pulled=true" >> $GITHUB_OUTPUT

      - name: "Build AI engine v4"
        id: ai_status
        shell: bash
        run: |
          set -euo pipefail
          FINAL_MODEL="${{ steps.pull_model.outputs.final_model }}"
          [ "$FINAL_MODEL" = "none" ] && { echo "ok=false" >> $GITHUB_OUTPUT; exit 1; }
          export AI_MODEL="$FINAL_MODEL"

          for i in $(seq 1 15); do
            curl -s http://localhost:11434/api/tags | jq -r '.models[].name // ""' | grep -q "^${FINAL_MODEL}$" && break
            sleep 3
          done

          cat > /opt/zygor/bin/ai_complete << 'EOF'
          #!/bin/bash
          set -euo pipefail
          PROMPT="$(cat -)"
          MAX_TOKENS="${1:-2048}"
          TIMEOUT="${2:-120}"
          MAX_RETRIES="${3:-3}"
          AI_MODEL="${AI_MODEL:-}"
          if [ -z "$AI_MODEL" ] || [ "$AI_MODEL" = "none" ] || [ "$AI_MODEL" = "null" ]; then
            AI_MODEL=$(curl -s --max-time 5 http://localhost:11434/api/tags | jq -r '.models[0].name // "mistral:7b-instruct-q4_K_M"')
          fi
          for attempt in $(seq 1 $MAX_RETRIES); do
            RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate \
              --connect-timeout 15 \
              --max-time $TIMEOUT \
              -H "Content-Type: application/json" \
              -d "{
                \"model\": \"$AI_MODEL\",
                \"prompt\": \"$PROMPT\",
                \"stream\": false,
                \"keep_alive\": \"24h\",
                \"options\": {
                  \"num_predict\": $MAX_TOKENS,
                  \"temperature\": 0.3,
                  \"repeat_penalty\": 1.1,
                  \"top_p\": 0.9,
                  \"stop\": [\"<|im_end|>\", \"<|end|>\", \"###\"]
                }
              }" 2>/dev/null) || RESPONSE=""
            if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
              echo "ERROR: $(echo "$RESPONSE" | jq -r '.error')"
              exit 1
            fi
            if echo "$RESPONSE" | jq -e '.response' >/dev/null 2>&1; then
              echo "$RESPONSE" | jq -r '.response'
              exit 0
            fi
            [ $attempt -lt $MAX_RETRIES ] && sleep $((attempt * 5))
          done
          echo "ERROR: All $MAX_RETRIES attempts failed"
          exit 1
          EOF
          chmod +x /opt/zygor/bin/ai_complete
          sudo cp /opt/zygor/bin/ai_complete /usr/local/bin/ai_complete

          echo "[*] Warming up model..."
          for w in 1 2; do
            timeout 100 bash -c "export AI_MODEL='$FINAL_MODEL'; echo 'List 3 nmap scan flags for pentesting.' | /opt/zygor/bin/ai_complete 64 90 1" >/dev/null 2>&1 && echo "[✓] Warmup $w OK" && break
            sleep 10
          done
          TEST=$(timeout 90 bash -c "export AI_MODEL='$FINAL_MODEL'; echo 'Say OK' | /opt/zygor/bin/ai_complete 4 60 2" 2>&1) || TEST="FAIL"
          echo "[+] Test: ${TEST:0:60}"
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: "Build auxiliary modules"
        shell: bash
        run: |
          cat > /opt/zygor/bin/reverse.py << 'EOF'
          #!/usr/bin/env python3
          import subprocess,sys,os
          def disassemble(f): return subprocess.getoutput(f"objdump -d -M intel {f}|head -300")
          def decompile(f): return subprocess.getoutput(f"strings {f}|head -300")
          def patch(f,o,b):
              with open(f,'rb') as fh: d=bytearray(fh.read())
              for i,by in enumerate(bytes.fromhex(b)): d[o+i]=by
              p=f+".patched"; open(p,'wb').write(d); return p
          def pe_info(f):
              if not os.path.exists(f): return "File not found"
              return subprocess.getoutput(f"file {f}; exiftool {f}|head -30")
          if __name__=='__main__':
              if len(sys.argv)<3: sys.exit(1)
              m,t=sys.argv[1],sys.argv[2]
              if m=='disassemble': print(disassemble(t))
              elif m=='decompile': print(decompile(t))
              elif m=='peinfo': print(pe_info(t))
              elif m=='patch':
                  o=int(sys.argv[3],16) if len(sys.argv)>3 else 0
                  b=sys.argv[4] if len(sys.argv)>4 else ''
                  print(patch(t,o,b))
          EOF

          cat > /opt/zygor/bin/poly_payload.py << 'EOF'
          #!/usr/bin/env python3
          import subprocess,sys
          def generate(lh,lp):
              p=f"Write obfuscated Python reverse shell for {lh}:{lp} with XOR encoding. Only code."
              r=subprocess.run(['/opt/zygor/bin/ai_complete','2048','120','2'],input=p.encode(),capture_output=True)
              return r.stdout.decode().strip()
          if __name__=='__main__':
              lh=sys.argv[1] if len(sys.argv)>1 else '127.0.0.1'
              lp=sys.argv[2] if len(sys.argv)>2 else '4444'
              print(generate(lh,lp))
          EOF

          cat > /opt/zygor/bin/c2_agent.py << 'EOF'
          #!/usr/bin/env python3
          import subprocess,sys
          def generate(lh,lp):
              p=f"Write Python C2 implant beaconing to {lh}:{lp} via HTTPS with AES, persistence, watermark @zygorlap"
              r=subprocess.run(['/opt/zygor/bin/ai_complete','4096','120','3'],input=p.encode(),capture_output=True)
              return r.stdout.decode()
          if __name__=='__main__':
              lh=sys.argv[1] if len(sys.argv)>1 else '127.0.0.1'
              lp=sys.argv[2] if len(sys.argv)>2 else '443'
              print(generate(lh,lp))
          EOF

          cat > /opt/zygor/bin/generate_dashboard.py << 'EOF'
          #!/usr/bin/env python3
          import sys,json,os
          def generate(target,findings=None):
              f_list=""
              if findings:
                  for f_item in findings:
                      f_list+=f"<li>{f_item}</li>\n"
              return f'''<!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>ZYGOR v4.1 Dashboard</title>
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          <style>body{{background:#0a0a0f;color:#00ff88;font-family:monospace;}}
          .grid{{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;padding:20px;}}
          .card{{background:#111118;border:1px solid #00ff8833;border-radius:12px;padding:20px;}}
          .finding{{color:#ff8844;}}</style></head>
          <body><div class="grid">
          <div class="card"><h2>ZYGOR v4.1</h2><p>Target: {target}</p><p>Status: ONLINE</p><p>Session: {os.environ.get('SESSION_TOKEN','N/A')}</p></div>
          <div class="card"><h3>Findings</h3><ul>{f_list or '<li>No findings yet</li>'}</ul></div>
          </div></body></html>'''
          if __name__=='__main__':
              target=sys.argv[1] if len(sys.argv)>1 else '127.0.0.1'
              findings=sys.argv[2:] if len(sys.argv)>2 else None
              out=sys.argv[2] if len(sys.argv)==3 else '/opt/zygor/reports/final/dashboard.html'
              with open(out,'w') as f: f.write(generate(target,findings))
          EOF

          cat > /opt/zygor/bin/notify.py << 'EOF'
          #!/usr/bin/env python3
          import urllib.request,sys,json
          def send_discord(wh,msg):
              r=urllib.request.Request(wh,data=json.dumps({"content":msg}).encode(),headers={"Content-Type":"application/json"})
              try: return urllib.request.urlopen(r,timeout=15).status==204
              except: return False
          def send_slack(wh,msg):
              r=urllib.request.Request(wh,data=json.dumps({"text":msg}).encode(),headers={"Content-Type":"application/json"})
              try: return urllib.request.urlopen(r,timeout=15).status==200
              except: return False
          if __name__=='__main__':
              if len(sys.argv)<4: sys.exit(1)
              mode,m,wh=sys.argv[1],sys.argv[2],sys.argv[3]
              if mode=="discord": send_discord(wh,m)
              elif mode=="slack": send_slack(wh,m)
          EOF

          chmod +x /opt/zygor/bin/*.py

      - name: "Update Nuclei templates"
        shell: bash
        run: nuclei -update-templates 2>/dev/null || true

      - name: "Send startup notification"
        shell: bash
        run: |
          MSG="ZYGOR v4.1 Online\nTarget: ${TARGET}\nModel: ${AI_MODEL}\nPhase: ${PHASE}\nSession: ${SESSION_TOKEN}"
          [ -n "$DISCORD_WEBHOOK" ] && python3 /opt/zygor/bin/notify.py discord "$MSG" "$DISCORD_WEBHOOK" || true
          [ -n "$SLACK_WEBHOOK" ] && python3 /opt/zygor/bin/notify.py slack "$MSG" "$SLACK_WEBHOOK" || true

      - name: "Start Telegram Bot v4 and wait for re-trigger"
        if: env.TELEGRAM_ENABLE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ ! -f telegram_bot_v4.py ]; then
            echo "❌ telegram_bot_v4.py not found in repository!"
            exit 1
          fi
          echo "[+] Starting bot..."
          chmod +x telegram_bot_v4.py
          nohup python3 telegram_bot_v4.py > /var/log/zygor/telegram_stdout.log 2>&1 &
          BOT_PID=$!
          echo "Bot PID: $BOT_PID"

          WAIT_MAX=$(( 3600 * 24 ))
          START_TS=$(date +%s)
          while true; do
            if [ -f /tmp/re_trigger_done ]; then
              echo "✅ Re-trigger confirmed!"
              break
            fi
            ELAPSED=$(( $(date +%s) - START_TS ))
            if [ $ELAPSED -ge $WAIT_MAX ]; then
              echo "❌ Timeout waiting for re-trigger."
              break
            fi
            sleep 30
          done

          kill $BOT_PID 2>/dev/null || true
          echo "Bot stopped."

      - name: "Upload ZYGOR tools & config to artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: zygor-tools
          path: |
            /opt/zygor/bin/
            /opt/zygor/.session_token
            /var/log/zygor/
          retention-days: 1

  recon:
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'recon' || github.event.inputs.penetration_phase == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zygor-tools
          path: /opt/zygor/
      - name: "Reconnaissance"
        shell: bash
        run: |
          echo ">>> [RECON] ${{ env.TARGET }}"
          T="${{ env.TARGET }}"
          nmap -sV -sC -T4 --min-rate=2000 -p- "$T" -oN /opt/zygor/reports/recon/nmap_full.txt 2>&1 | tail -20
          nmap -sV -T4 -p 21,22,23,25,53,80,110,139,143,443,445,993,1433,1521,2049,3306,3389,5432,5900,5985,5986,6379,8080,8443,27017 "$T" -oN /opt/zygor/reports/recon/nmap_services.txt 2>&1 | tail -10
          if echo "$T" | grep -qE '^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$'; then
            subfinder -d "$T" -silent -o /opt/zygor/reports/recon/subdomains.txt 2>/dev/null || true
          fi
          nuclei -u "http://$T" -severity critical,high -o /opt/zygor/reports/recon/nuclei.txt 2>/dev/null || true
          echo "[✓] Recon complete"

  exploitation:
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'exploitation' || github.event.inputs.penetration_phase == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zygor-tools
          path: /opt/zygor/
      - name: "Exploitation"
        shell: bash
        run: |
          echo ">>> [EXPLOIT] ${{ env.TARGET }}"
          T="${{ env.TARGET }}"
          smbclient -L "//$T" -N 2>/dev/null | head -20 || echo "SMB unavailable"
          curl -s --connect-timeout 5 --max-time 10 "ftp://$T/" 2>/dev/null | head -5 || echo "FTP unavailable"
          echo "[✓] Exploit complete"

  reverse_engineering:
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'reverse_engineering' || github.event.inputs.penetration_phase == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zygor-tools
          path: /opt/zygor/
      - name: "Reverse Engineering"
        shell: bash
        run: |
          echo ">>> [RE]"
          if [ -d /opt/zygor/binaries ]; then
            for f in /opt/zygor/binaries/*; do
              [ -f "$f" ] || continue
              python3 /opt/zygor/bin/reverse.py decompile "$f" > "/opt/zygor/reports/reverse_eng/$(basename $f).txt" 2>/dev/null || true
            done
          else
            mkdir -p /opt/zygor/binaries
            echo "Upload binaries to /opt/zygor/binaries/"
          fi
          echo "[✓] RE done"

  web_forge:
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'web_forge' || github.event.inputs.penetration_phase == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zygor-tools
          path: /opt/zygor/
      - name: "Web Forge"
        shell: bash
        run: |
          echo ">>> [WEB FORGE]"
          python3 /opt/zygor/bin/generate_dashboard.py "${{ env.TARGET }}" > /opt/zygor/reports/web_forge/dashboard.html 2>/dev/null || true
          echo "[✓] Web forge done"

  post_exploitation:
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'post_exploitation' || github.event.inputs.penetration_phase == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zygor-tools
          path: /opt/zygor/
      - name: "Post-Exploitation"
        shell: bash
        run: |
          echo ">>> [POST-EXPLOIT]"
          python3 /opt/zygor/bin/c2_agent.py "${{ env.LHOST || '127.0.0.1' }}" "${{ env.LPORT || '443' }}" > /opt/zygor/reports/post_exploitation/c2_agent.py 2>/dev/null || true
          python3 /opt/zygor/bin/poly_payload.py "${{ env.LHOST || '127.0.0.1' }}" "${{ env.LPORT || '4444' }}" > /opt/zygor/reports/post_exploitation/payload.b64 2>/dev/null || true
          echo "[✓] Post-exploit done"

  reporting:
    needs: [recon, exploitation, reverse_engineering, web_forge, post_exploitation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zygor-tools
          path: /opt/zygor/
      - name: "Generate Final Report"
        shell: bash
        run: |
          mkdir -p /opt/zygor/reports/final
          python3 /opt/zygor/bin/generate_dashboard.py "${{ env.TARGET }}"
          {
            echo "=== ZYGOR v4.1 FINAL ==="
            echo "Target: ${{ env.TARGET }}"
            echo "Date: $(date)"
            echo "Model: ${{ env.AI_MODEL }}"
            for d in recon exploitation reverse_eng web_forge post_exploitation; do
              p="/opt/zygor/reports/$d"
              if [ -d "$p" ]; then
                echo "--- $d ---"
                for f in "$p"/*.txt "$p"/*.html "$p"/*.py "$p"/*.b64; do
                  [ -f "$f" ] && echo "File: $(basename $f)" && head -20 "$f" && echo ""
                done
              fi
            done
          } > /opt/zygor/reports/final/zygor_report.txt
          echo "[✓] Report generated"
