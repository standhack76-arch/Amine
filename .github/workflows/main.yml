          Supports: web, crypto, reverse, pwn, forensics, stego, osint, misc.
          """
          import subprocess, sys, os, json, re

          CHALLENGE_TYPES = {
              "web": ["sqlmap", "dirb", "gobuster", "nikto", "wpscan"],
              "crypto": ["openssl", "steghide", "john", "hashcat"],
              "reverse": ["strings", "objdump", "gdb", "radare2", "ghidra"],
              "pwn": ["python3", "pwntools", "gdb", "checksec"],
              "forensics": ["binwalk", "foremost", "photorec", "strings", "xxd"],
              "stego": ["steghide", "zsteg", "stegsolve", "binwalk"],
              "osint": ["dig", "nslookup", "whois", "theharvester"],
              "misc": ["python3", "base64", "xxd", "file"]
          }

          def identify_challenge_type(files: list) -> str:
              """Use AI to identify the challenge type from files"""
              file_list = "\n".join(files)
              prompt = f"""Given these CTF challenge files:
          {file_list}
          Identify the challenge type (web/crypto/reverse/pwn/forensics/stego/osint/misc) and why.
          Output as JSON: {{"type": "...", "confidence": 0.0-1.0, "reasoning": "..."}}"""
              result = subprocess.run(
                  ["/opt/zygor/bin/ai_complete", "1024"],
                  input=prompt.encode(), capture_output=True, timeout=120
              )
              try:
                  return json.loads(result.stdout.decode())
              except:
                  return {"type": "misc", "confidence": 0.5, "reasoning": "AI parsing failed"}

          def suggest_tools(challenge_type: str) -> list:
              return CHALLENGE_TYPES.get(challenge_type, ["file", "strings", "hexdump"])

          def generate_solution(challenge_type: str, files: list, context: str = "") -> str:
              file_info = []
              for f in files[:5]:
                  try:
                      result = subprocess.run(["file", f], capture_output=True, text=True, timeout=10)
                      file_info.append(result.stdout.strip())
                  except:
                      pass
              prompt = f"""CTF Challenge Type: {challenge_type}
          Files: {', '.join(files)}
          File info: {', '.join(file_info)}
          Context: {context}
          Write a step-by-step solution. Include exact commands, code, and the expected flag format."""
              result = subprocess.run(
                  ["/opt/zygor/bin/ai_complete", "4096"],
                  input=prompt.encode(), capture_output=True, timeout=300
              )
              return result.stdout.decode()

          if __name__ == '__main__':
              files = sys.argv[1:] if len(sys.argv) > 1 else ["."]
              print("[*] Analyzing CTF challenge...")
              analysis = identify_challenge_type(files)
              print(f"[+] Type: {analysis.get('type', 'unknown')} (confidence: {analysis.get('confidence', 0)})")
              tools = suggest_tools(analysis.get('type', 'misc'))
              print(f"[+] Suggested tools: {', '.join(tools)}")
              solution = generate_solution(analysis.get('type', 'misc'), files)
              print(f"\n[+] Solution:\n{solution}")
          CTFEOF
          chmod +x /opt/zygor/bin/ctf_solver.py
          echo "✓ CTF solver module built"

