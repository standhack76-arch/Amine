          def patch(file, offset, bytes_hex):
              with open(file, 'rb') as f: data = bytearray(f.read())
              for i, b in enumerate(bytes.fromhex(bytes_hex)): data[offset+i] = b
              patched = file + ".patched"
              with open(patched, 'wb') as f: f.write(data)
              return patched
          if __name__ == '__main__':
              if len(sys.argv) < 3: sys.exit(1)
              mode = sys.argv[1]; target = sys.argv[2]
              if mode == 'disassemble': print(disassemble(target))
              elif mode == 'decompile': print(decompile(target))
              elif mode == 'patch':
                  off = int(sys.argv[3], 16) if len(sys.argv)>3 else 0
                  bytez = sys.argv[4] if len(sys.argv)>4 else ''
