# =============================================================================
# ZYGOR v4.1 ULTIMATE – ALL-IN-ONE – 24/7 AI PENTEST FRAMEWORK
# =============================================================================
name: ZYGOR v4.1 Ultimate – Ollama AI Red Team

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Target IP/CIDR/Domain"
        required: true
        default: "127.0.0.1"
      lhost:
        description: "Listener IP for shells"
        required: false
        default: ""
      lport:
        description: "Listener port"
        required: false
        default: "4444"
      ai_model:
        description: "Primary Ollama model"
        required: true
        default: "mistral:7b-instruct-q4_K_M"
        type: choice
        options:
          - mistral:7b-instruct-q4_K_M
          - mistral:7b-instruct-q8_0
          - hermes-3-llama-3.2-uncensored:latest
          - wizard-vicuna-uncensored:latest
          - neural-chat:7b-v3
          - phi-3:3.8b-mini-instruct-q4_0
          - orca-mini:3b
      penetration_phase:
        description: "Attack phase(s)"
        required: true
        default: "full"
        type: choice
        options:
          - recon
          - exploitation
          - web_forge
          - reverse_engineering
          - post_exploitation
          - full
      enable_exfiltration:
        description: "Enable exfiltration/persistence simulation"
        default: "false"
        type: choice
        options: ["true", "false"]
      run_duration_hours:
        description: "Max run time (hours)"
        default: "6"
        type: choice
        options: ["1", "2", "3", "4", "5", "6", "8", "12"]
      telegram_enable:
        description: "Enable Telegram bot"
        default: "true"
        type: choice
        options: ["true", "false"]
      telegram_chat_id:
        description: "Authorised Telegram chat ID"
        required: false
        default: ""
      telegram_bot_token:
        description: "Telegram Bot Token"
        required: false
        default: ""
      enable_social_engineering:
        description: "Social engineering simulation"
        default: "false"
        type: choice
        options: ["true", "false"]
      ctf_mode:
        description: "CTF solver mode"
        default: "false"
        type: choice
        options: ["true", "false"]
      cloud_vm_provider:
        description: "Cloud provider for ephemeral VMs (optional)"
        default: "none"
        type: choice
        options: ["none", "aws", "gcp", "azure"]
      report_email:
        description: "Email for final report"
        required: false
        default: ""
      discord_webhook:
        description: "Discord webhook URL"
        required: false
        default: ""
      slack_webhook:
        description: "Slack webhook URL"
        required: false
        default: ""
      session_token:
        description: "Session continuity token (auto-generated, do not modify)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  security-events: write
  deployments: write
  packages: write
  statuses: write

env:
  OLLAMA_HOST: "0.0.0.0:11434"
  OLLAMA_READ_TIMEOUT: "3600"
  OLLAMA_KEEP_ALIVE: "24h"
  OLLAMA_MODEL_CACHE: "/home/runner/.ollama/models"
  TARGET: ${{ github.event.inputs.target || '127.0.0.1' }}
  LHOST: ${{ github.event.inputs.lhost || '' }}
  LPORT: ${{ github.event.inputs.lport || '4444' }}
  AI_MODEL: ${{ github.event.inputs.ai_model || 'mistral:7b-instruct-q4_K_M' }}
  PHASE: ${{ github.event.inputs.penetration_phase || 'full' }}
  ENABLE_EXFIL: ${{ github.event.inputs.enable_exfiltration || 'false' }}
  MAX_HOURS: ${{ github.event.inputs.run_duration_hours || '6' }}
  TELEGRAM_ENABLE: ${{ github.event.inputs.telegram_enable || 'true' }}
  TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || '' }}
  TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN || '' }}
  SOCIAL_ENG: ${{ github.event.inputs.enable_social_engineering || 'false' }}
  CTF_MODE: ${{ github.event.inputs.ctf_mode || 'false' }}
  CLOUD_VM: ${{ github.event.inputs.cloud_vm_provider || 'none' }}
  REPORT_EMAIL: ${{ github.event.inputs.report_email || '' }}
  DISCORD_WEBHOOK: ${{ github.event.inputs.discord_webhook || '' }}
  SLACK_WEBHOOK: ${{ github.event.inputs.slack_webhook || '' }}
  SESSION_TOKEN: ${{ github.event.inputs.session_token || '' }}
  GITHUB_REPO: ${{ github.repository }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}
  GITHUB_ACTOR: ${{ github.actor }}
  WORKFLOW_ID: ${{ github.workflow_id }}

jobs:
  bootstrap:
    name: "ZYGOR Bootstrap"
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    outputs:
      ai_ready: ${{ steps.ai_status.outputs.ok }}
      final_model: ${{ steps.pull_model.outputs.final_model }}
      session_token: ${{ steps.session.outputs.token }}
    steps:
      - name: "Generate session token"
        id: session
        shell: bash
        run: |
          if [ -z "$SESSION_TOKEN" ]; then
            TOKEN="zygor-$(date +%s)-$(head -c 16 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)"
          else
            TOKEN="$SESSION_TOKEN"
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "SESSION_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: "Disk cleanup"
        shell: bash
        run: |
          echo ">>> Free: $(df -h / | tail -1 | awk '{print $4}')"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android 2>/dev/null
          sudo docker system prune -af 2>/dev/null || true
          sudo apt-get clean
          echo ">>> After: $(df -h / | tail -1 | awk '{print $4}')"

      - name: "Cache Ollama"
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-${{ env.AI_MODEL }}-v4.1

      - name: "Install tools"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl wget git jq nmap nuclei python3 python3-pip 2>/dev/null
          pip3 install --quiet --break-system-packages python-telegram-bot aiohttp 2>/dev/null

      - name: "Create directories"
        shell: bash
        run: |
          sudo mkdir -p /opt/zygor/{bin,reports/{recon,exploitation,web_forge,reverse_eng,post_exploitation,final},logs,c2}
          sudo mkdir -p /var/log/zygor
          sudo chmod -R 777 /opt/zygor /var/log/zygor

      - name: "Install and start Ollama"
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /var/log/zygor/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s http://localhost:11434/api/tags >/dev/null 2>&1 && echo "[+] Ollama ready" && break
            sleep 2
          done

      - name: "Pull AI model"
        id: pull_model
        shell: bash
        run: |
          MODEL="${{ env.AI_MODEL }}"
          for attempt in 1 2 3; do
            echo ">>> Pull attempt $attempt: $MODEL"
            if timeout 1800 ollama pull "$MODEL" 2>&1; then
              echo "final_model=$MODEL" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 30
          done
          # Fallback
          for fb in "mistral:7b-instruct-q4_K_M" "phi-3:3.8b-mini-instruct-q4_0" "orca-mini:3b"; do
            [ "$fb" = "$MODEL" ] && continue
            echo ">>> Fallback: $fb"
            if timeout 1800 ollama pull "$fb" 2>&1; then
              echo "final_model=$fb" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "final_model=none" >> $GITHUB_OUTPUT

      - name: "Verify AI"
        id: ai_status
        shell: bash
        run: |
          FINAL_MODEL="${{ steps.pull_model.outputs.final_model }}"
          [ "$FINAL_MODEL" = "none" ] && { echo "ok=false" >> $GITHUB_OUTPUT; exit 1; }
          # Quick test
          TEST=$(curl -s -X POST http://localhost:11434/api/generate -H "Content-Type: application/json" -d "{\"model\":\"$FINAL_MODEL\",\"prompt\":\"Say OK\",\"stream\":false,\"options\":{\"num_predict\":5}}" | jq -r '.response // "FAIL"')
          echo "[+] AI test: $TEST"
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: "Build bot script"
        shell: bash
        run: |
          cat > /tmp/bot.py << 'BOTPY'
#!/usr/bin/env python3
import os, logging, asyncio, json, time, hashlib
from telegram import Update, InlineQueryResultArticle, InputTextMessageContent
from telegram.ext import Application, CommandHandler, ContextTypes, InlineQueryHandler, MessageHandler, filters

TOKEN = os.environ['TELEGRAM_BOT_TOKEN']
CHAT_ID = os.environ.get('TELEGRAM_CHAT_ID', '')
ALLOWED = [CHAT_ID] if CHAT_ID else []
AI_MODEL = os.environ.get('AI_MODEL', 'mistral:7b-instruct-q4_K_M')
SESSION_TOKEN = os.environ.get('SESSION_TOKEN', '')
TARGET = os.environ.get('TARGET', '127.0.0.1')
PHASE = os.environ.get('PHASE', 'full')
REPO = os.environ.get('GITHUB_REPO', '')
RUN_ID = os.environ.get('GITHUB_RUN_ID', '')
WORKFLOW_ID = os.environ.get('WORKFLOW_ID', '')
MAX_HOURS = int(os.environ.get('MAX_HOURS', '6'))
START_TIME = time.time()
GITHUB_TOKEN = os.environ.get('GITHUB_TOKEN', '')
LHOST = os.environ.get('LHOST', '')
LPORT = os.environ.get('LPORT', '4444')

logging.basicConfig(filename='/var/log/zygor/bot.log', level=logging.INFO, format='%(asctime)s - %(message)s')

def auth(u):
    return not ALLOWED or str(u.effective_chat.id) in ALLOWED

async def ai(prompt):
    model = AI_MODEL
    try:
        proc = await asyncio.create_subprocess_exec('curl','-s','http://localhost:11434/api/tags', stdout=asyncio.subprocess.PIPE)
        out, _ = await asyncio.wait_for(proc.communicate(), timeout=5)
        tags = json.loads(out.decode())
        if tags.get('models'): model = tags['models'][0]['name']
    except: pass

    for attempt in range(3):
        try:
            proc = await asyncio.create_subprocess_exec(
                'curl','-s','-X','POST','http://localhost:11434/api/generate',
                '--connect-timeout','15','--max-time','120',
                '-H','Content-Type: application/json',
                '-d', json.dumps({"model":model,"prompt":prompt,"stream":False,"options":{"num_predict":2048,"temperature":0.3}}),
                stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
            stdout, _ = await asyncio.wait_for(proc.communicate(), timeout=150)
            resp = json.loads(stdout.decode())
            if resp.get('response'): return resp['response'].strip()
            if resp.get('error'): return f"ERROR: {resp['error']}"
        except: 
            if attempt < 2: await asyncio.sleep(5)
    return "ERROR: AI failed"

async def re_trigger():
    delay = max(60, (MAX_HOURS * 3600) - 1800)
    logging.info(f"Re-trigger in {delay}s")
    await asyncio.sleep(delay)
    if not GITHUB_TOKEN: return
    payload = json.dumps({"ref":"main","inputs":{"target":TARGET,"lhost":LHOST,"lport":LPORT,"ai_model":AI_MODEL,"penetration_phase":PHASE,"run_duration_hours":str(MAX_HOURS),"telegram_enable":"true","telegram_chat_id":CHAT_ID,"telegram_bot_token":TOKEN,"session_token":SESSION_TOKEN}})
    url = f'https://api.github.com/repos/{REPO}/actions/workflows/{WORKFLOW_ID}/dispatches'
    for i in range(5):
        try:
            proc = await asyncio.create_subprocess_exec('curl','-s','-X','POST',url,'-H',f'Authorization: token {GITHUB_TOKEN}','-H','Accept: application/vnd.github.v3+json','-d',payload,stdout=asyncio.subprocess.PIPE)
            await asyncio.wait_for(proc.communicate(), timeout=30)
            if proc.returncode == 0:
                with open('/tmp/re_trigger_done','w') as f: f.write('ok')
                return
        except: await asyncio.sleep(30)

async def start(u,c):
    if not auth(u): return
    e = int((time.time()-START_TIME)/60)
    await u.message.reply_text(f"🔥 ZYGOR v4.1\n🎯 {TARGET}\n🧠 {AI_MODEL}\n⏱ {e}m\n⚡ {SESSION_TOKEN[:16]}...")

async def help_cmd(u,c):
    if not auth(u): return
    await u.message.reply_text("/ai /exec /scan /exploit /cve /phish /ctf /poly /c2 /persist /lateral /pivot /reverse /stego /wireless /report /log /abort /session /regen")

async def ai_cmd(u,c):
    if not auth(u): return
    q = ' '.join(c.args)
    if not q: return
    await u.message.reply_text("🧠 Thinking...")
    r = await ai(q)
    await u.message.reply_text(r[:4000])

async def exec_cmd(u,c):
    if not auth(u): return
    cmd = ' '.join(c.args)
    if not cmd: return
    try:
        proc = await asyncio.create_subprocess_shell(cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
        out, _ = await asyncio.wait_for(proc.communicate(), timeout=60)
        await u.message.reply_text((out.decode()[:3500]) or "No output")
    except: await u.message.reply_text("Timeout/Error")

async def scan_cmd(u,c):
    if not auth(u): return
    t = c.args[0] if c.args else TARGET
    await u.message.reply_text(f"🔍 Scanning {t}...")
    proc = await asyncio.create_subprocess_shell(f"nmap -sV -sC -T4 -F {t} 2>&1 | tail -30", stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
    o, _ = await asyncio.wait_for(proc.communicate(), timeout=300)
    res = o.decode()[:2000]
    aians = await ai(f"Analyze these nmap results: {res[:1500]}")
    await u.message.reply_text(res + "\n---\n🤖 " + aians[:2000])

async def exploit_cmd(u,c):
    if not auth(u): return
    v = ' '.join(c.args)
    if not v: return
    code = await ai(f"Write exploit for: {v}")
    await u.message.reply_text(code[:4000])

async def cve_cmd(u,c):
    if not auth(u): return
    cid = c.args[0] if c.args else 'CVE-2024-3094'
    r = await ai(f"Provide exploit details for {cid}")
    await u.message.reply_text(r[:4000])

async def phish_cmd(u,c):
    if not auth(u): return
    t = ' '.join(c.args) or 'target@company.com'
    r = await ai(f"Write phishing email for {t}")
    await u.message.reply_text(r[:4000])

async def ctf_cmd(u,c):
    if not auth(u): return
    ch = ' '.join(c.args)
    if not ch: return
    r = await ai(f"Solve CTF: {ch}")
    await u.message.reply_text(r[:4000])

async def poly_cmd(u,c):
    if not auth(u): return
    lh = c.args[0] if len(c.args)>0 else LHOST or '127.0.0.1'
    lp = c.args[1] if len(c.args)>1 else LPORT
    r = await ai(f"Write obfuscated Python reverse shell for {lh}:{lp}")
    await u.message.reply_text(r[:4000])

async def c2_cmd(u,c):
    if not auth(u): return
    lh = c.args[0] if len(c.args)>0 else LHOST or '127.0.0.1'
    lp = c.args[1] if len(c.args)>1 else '443'
    r = await ai(f"Write C2 implant for {lh}:{lp} with AES encryption")
    await u.message.reply_text(r[:4000])

async def persist_cmd(u,c):
    if not auth(u): return
    m = ' '.join(c.args) or 'systemd'
    r = await ai(f"Persistence mechanism via {m}")
    await u.message.reply_text(r[:4000])

async def lateral_cmd(u,c):
    if not auth(u): return
    t = c.args[0] if c.args else '192.168.1.100'
    r = await ai(f"Lateral movement to {t}")
    await u.message.reply_text(r[:4000])

async def pivot_cmd(u,c):
    if not auth(u): return
    t = c.args[0] if c.args else '10.10.10.0/24'
    r = await ai(f"Pivot into {t}")
    await u.message.reply_text(r[:4000])

async def reverse_cmd(u,c):
    if not auth(u): return
    fp = c.args[0] if c.args else '/tmp/uploaded'
    proc = await asyncio.create_subprocess_shell(f"strings {fp} 2>/dev/null | head -100", stdout=asyncio.subprocess.PIPE)
    o, _ = await asyncio.wait_for(proc.communicate(), timeout=15)
    await u.message.reply_text((o.decode()[:3500]) or "No data")

async def stego_cmd(u,c):
    if not auth(u): return
    fp = c.args[0] if c.args else '/tmp/uploaded'
    proc = await asyncio.create_subprocess_shell(f"steghide info {fp} 2>&1; exiftool {fp} 2>/dev/null | head -20", stdout=asyncio.subprocess.PIPE)
    o, _ = await asyncio.wait_for(proc.communicate(), timeout=15)
    await u.message.reply_text((o.decode()[:3000]) or "No data")

async def wireless_cmd(u,c):
    if not auth(u): return
    r = await ai("WiFi attack guide: airodump, aircrack, evil twin")
    await u.message.reply_text(r[:4000])

async def report_cmd(u,c):
    if not auth(u): return
    r = await ai(f"Pentest report for {TARGET}")
    await u.message.reply_text(r[:4000])

async def log_cmd(u,c):
    if not auth(u): return
    proc = await asyncio.create_subprocess_shell("tail -20 /var/log/zygor/bot.log", stdout=asyncio.subprocess.PIPE)
    o, _ = await asyncio.wait_for(proc.communicate(), timeout=5)
    await u.message.reply_text((o.decode()[:3000]) or "No logs")

async def abort_cmd(u,c):
    if not auth(u): return
    proc = await asyncio.create_subprocess_shell(f"curl -s -X POST -H 'Authorization: token {GITHUB_TOKEN}' 'https://api.github.com/repos/{REPO}/actions/runs/{RUN_ID}/cancel'", stdout=asyncio.subprocess.PIPE)
    await asyncio.wait_for(proc.communicate(), timeout=10)
    await u.message.reply_text("🛑 Abort sent")

async def session_cmd(u,c):
    if not auth(u): return
    await u.message.reply_text(f"Session: {SESSION_TOKEN}\nRun: {RUN_ID}\nUptime: {int((time.time()-START_TIME)/60)}m")

async def regen_cmd(u,c):
    if not auth(u): return
    await u.message.reply_text("✅ Modules ready")

async def doc_handler(u,c):
    if not auth(u): return
    doc = u.message.document
    f = await c.bot.get_file(doc.file_id)
    await f.download_to_drive(f"/tmp/{doc.file_name}")
    await u.message.reply_text(f"📁 Saved: /tmp/{doc.file_name}")

async def inline_q(u,c):
    q = u.inline_query.query
    if not q: return
    r = await ai(q)
    results = [InlineQueryResultArticle(id=hashlib.md5(q.encode()).hexdigest(), title="ZYGOR AI", input_message_content=InputTextMessageContent(r[:4000]))]
    await u.inline_query.answer(results)

def main():
    app = Application.builder().token(TOKEN).build()
    for n,f in [("start",start),("help",help_cmd),("ai",ai_cmd),("exec",exec_cmd),("scan",scan_cmd),("exploit",exploit_cmd),("cve",cve_cmd),("phish",phish_cmd),("ctf",ctf_cmd),("poly",poly_cmd),("c2",c2_cmd),("persist",persist_cmd),("lateral",lateral_cmd),("pivot",pivot_cmd),("reverse",reverse_cmd),("stego",stego_cmd),("wireless",wireless_cmd),("report",report_cmd),("log",log_cmd),("abort",abort_cmd),("session",session_cmd),("regen",regen_cmd)]:
        app.add_handler(CommandHandler(n,f))
    app.add_handler(MessageHandler(filters.Document.ALL, doc_handler))
    app.add_handler(InlineQueryHandler(inline_q))
    loop = asyncio.new_event_loop()
    asyncio.set_event_loop(loop)
    loop.create_task(re_trigger())
    app.run_polling()

if __name__ == '__main__':
    main()
BOTPY
