  recon:
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'recon' || github.event.inputs.penetration_phase == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: "Reconnaissance"
        shell: bash
        run: |
          T="${{ env.TARGET }}"
          mkdir -p /opt/zygor/reports/recon
          nmap -sV -sC -T4 -F "$T" -oN /opt/zygor/reports/recon/nmap.txt 2>&1 | tail -20
          echo "[✓] Recon done"

  exploitation:
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'exploitation' || github.event.inputs.penetration_phase == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: "Exploitation"
        shell: bash
        run: |
          T="${{ env.TARGET }}"
          mkdir -p /opt/zygor/reports/exploitation
          curl -s --connect-timeout 5 "http://$T/" 2>/dev/null | head -10 || echo "No HTTP"
          echo "[✓] Exploit done"

  web_forge:
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'web_forge' || github.event.inputs.penetration_phase == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: "Web Forge"
        shell: bash
        run: |
          mkdir -p /opt/zygor/reports/web_forge
          echo "<html><body><h1>ZYGOR v4.1 - ${{ env.TARGET }}</h1></body></html>" > /opt/zygor/reports/web_forge/dashboard.html
          echo "[✓] Web forge done"

  reverse_engineering:
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'reverse_engineering' || github.event.inputs.penetration_phase == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: "Reverse Engineering"
        shell: bash
        run: |
          mkdir -p /opt/zygor/reports/reverse_eng
          echo "RE phase ready" > /opt/zygor/reports/reverse_eng/status.txt
          echo "[✓] RE done"

  post_exploitation:
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'post_exploitation' || github.event.inputs.penetration_phase == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: "Post-Exploitation"
        shell: bash
        run: |
          mkdir -p /opt/zygor/reports/post_exploitation
          echo "Post-exploit ready" > /opt/zygor/reports/post_exploitation/status.txt
          echo "[✓] Post-exploit done"

  reporting:
    needs: [recon, exploitation, reverse_engineering, web_forge, post_exploitation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Final Report"
        shell: bash
        run: |
          mkdir -p /opt/zygor/reports/final
          echo "=== ZYGOR v4.1 REPORT ===" > /opt/zygor/reports/final/report.txt
          echo "Target: ${{ env.TARGET }}" >> /opt/zygor/reports/final/report.txt
          echo "Date: $(date)" >> /opt/zygor/reports/final/report.txt
          echo "Model: ${{ env.AI_MODEL }}" >> /opt/zygor/reports/final/report.txt
          echo "[✓] Report done"
