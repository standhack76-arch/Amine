# ═══════════════════════════════════════════════════════════════════════════════════════════════════
# ZYGOR v4.0 – THE UNCHAINED AUTONOMOUS AI PENTEST & WEB FORGE FRAMEWORK
# ═══════════════════════════════════════════════════════════════════════════════════════════════════
#
#                                   ███████╗██╗   ██╗ ██████╗  ██████╗ ██████╗ 
#                                   ╚══███╔╝╚██╗ ██╔╝██╔════╝ ██╔═══██╗██╔══██╗
#                                     ███╔╝  ╚████╔╝ ██║  ███╗██║   ██║██████╔╝
#                                    ███╔╝    ╚██╔╝  ██║   ██║██║   ██║██╔══██╗
#                                   ███████╗   ██║   ╚██████╔╝╚██████╔╝██║  ██║
