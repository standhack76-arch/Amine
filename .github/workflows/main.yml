          #!/usr/bin/env python3
          """
          ZYGOR CVE Database Sync
          Fetches latest CVEs from NVD and correlates with installed exploit tools.
          """
          import json, os, subprocess, sys, urllib.request
          from datetime import datetime, timedelta

          CVE_CACHE = "/opt/zygor/cve_cache.json"
          NVD_API = "https://services.nvd.nist.gov/rest/json/cves/2.0"

          def fetch_recent_cves(days_back: int = 7):
              """Fetch recent CVEs from NVD"""
              pub_start = (datetime.now() - timedelta(days=days_back)).strftime("%Y-%m-%dT00:00:00.000")
              url = f"{NVD_API}?pubStartDate={pub_start}&resultsPerPage=50"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "ZYGOR/4.0"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.loads(resp.read())
                  return data.get("vulnerabilities", [])
              except Exception as e:
                  print(f"[-] NVD fetch failed: {e}")
                  return []

          def correlate_with_exploitdb(cves: list) -> list:
              """Cross-reference CVEs with local searchsploit/exploitdb"""
              enriched = []
              for cve_item in cves:
                  cve_id = cve_item.get("cve", {}).get("id", "")
                  if not cve_id:
                      continue
                  # Check searchsploit
                  try:
                      result = subprocess.run(
                          ["searchsploit", "--cve", cve_id, "--json"],
                          capture_output=True, text=True, timeout=30
                      )
                      if result.returncode == 0:
                          edb_data = json.loads(result.stdout)
                          cve_item["exploitdb"] = edb_data
                  except:
                      pass
                  enriched.append(cve_item)
              return enriched

          def sync():
              print("[*] Syncing CVE database...")
              cves = fetch_recent_cves(7)
              print(f"[+] Fetched {len(cves)} recent CVEs")
              enriched = correlate_with_exploitdb(cves)
              with open(CVE_CACHE, 'w') as f:
                  json.dump(enriched, f, indent=2)
              print(f"[+] CVE cache saved: {CVE_CACHE}")
              return enriched

          if __name__ == '__main__':
              sync()
          CVEEOF
