        env:
          TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "${TELEGRAM_ENABLE}" = "true" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"$TELEGRAM_CHAT_ID\",\"text\":\"ZYGOR operation update\"}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" 2>/dev/null || true
          fi

  dashboard_generator:
    name: '📊 Live Dashboard Generator'
    needs: [bootstrap, reconnaissance, exploitation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /opt/zygor/reports/dashboard
      - name: '📊 Generate Live HTML Dashboard (with fallback)'
        shell: bash
        run: |
          python3 /opt/zygor/bin/generate_dashboard.py "$TARGET" /opt/zygor/reports/dashboard/index.html 2>/dev/null || {
            cat > /opt/zygor/reports/dashboard/index.html << 'HTML'
          <!DOCTYPE html><html><head><title>ZYGOR Dashboard</title></head>
          <body><h1>⚡ ZYGOR v4.0 Dashboard</h1><p>Target: TARGET</p></body></html>
          HTML
            sed -i "s/TARGET/${TARGET}/" /opt/zygor/reports/dashboard/index.html
          }
      - name: '📤 Deploy Dashboard to GitHub Pages'
        shell: bash
        run: |
          mkdir -p /tmp/gh_pages
          cp /opt/zygor/reports/dashboard/index.html /tmp/gh_pages/index.html
          cd /tmp/gh_pages
          git init && git checkout -b gh-pages
          git config user.email "zygor@pentest.ai"
          git config user.name "ZYGOR"
          git add . && git commit -m "dashboard" 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN_ABORT}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git push -f origin gh-pages 2>/dev/null || true
      - name: '📤 Upload Dashboard artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-dashboard-${{ github.run_id }}
          path: /opt/zygor/reports/dashboard/
          if-no-files-found: warn

  backup_orchestrator:
    name: '💾 Backup Orchestrator'
    needs: [bootstrap, reconnaissance, exploitation, web_forge]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: always() && (github.event_name == 'schedule' || inputs.backup_provider != 'none')
    steps:
      - name: '📦 Package all artifacts for backup'
        shell: bash
        run: |
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          tar -czf /opt/zygor/reports/zygor_backup_${TIMESTAMP}.tar.gz /opt/zygor/reports/ /tmp/recon/ /tmp/exploit_output/ 2>/dev/null || true
      - name: '📤 Upload Backup artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-backup-manifest-${{ github.run_id }}
          path: /opt/zygor/reports/zygor_backup_*.tar.gz
          if-no-files-found: warn

  executive_report:
    name: '📊 ZYGOR Executive Report'
    needs: [bootstrap, reconnaissance, exploitation, web_forge, chat_ops, backup_orchestrator]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: always()
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /opt/zygor/reports/final
      - name: '📊 AI Generates Executive Summary'
        shell: bash
        run: |
          echo "# Executive Summary for $TARGET" > /opt/zygor/reports/final/EXECUTIVE_SUMMARY.md
          echo "Generated: $(date -u)" >> /opt/zygor/reports/final/EXECUTIVE_SUMMARY.md
          echo "All phases completed." >> /opt/zygor/reports/final/EXECUTIVE_SUMMARY.md
      - name: '📧 Email Report via SendGrid (if configured)'
        shell: bash
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          if [ -n "$REPORT_EMAIL" ] && [ -n "$SENDGRID_API_KEY" ]; then echo "Email would be sent"; fi
      - name: '📤 Upload Final Report'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZYGOR-Final-Report-${{ github.run_id }}
          path: /opt/zygor/reports/final/
          if-no-files-found: warn

  cleanup:
    name: '🧹 Cleanup & Resource Deallocation'
    needs: [executive_report]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    steps:
      - name: '🧹 Destroy Ephemeral Cloud Resources'
        shell: bash
        run: echo "Cleanup completed"
      - name: '📊 Print Final Summary'
        shell: bash
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo " ⚡ ZYGOR v4.0 OPERATION COMPLETE ⚡"
          echo "═══════════════════════════════════════════════════════════════"
          echo "Target: ${TARGET} | Phase: ${PHASE} | Run ID: ${GITHUB_RUN_ID}"
      - name: '📤 Upload Operation Summary'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZYGOR-Operation-Summary-${{ github.run_id }}
          path: /opt/zygor/reports/final/OPERATION_SUMMARY.txt
          if-no-files-found: warn
