name: ZYGOR v4.0 Ultimate – Ollama AI Red Team

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Target IP/CIDR/Domain"
        required: true
        default: "127.0.0.1"
      lhost:
        description: "Listener IP for shells"
        required: false
        default: ""
      lport:
        description: "Listener port"
        required: false
        default: "4444"
      ai_model:
        description: "Primary Ollama model (with 30GB+ freed: use uncensored heavy models)"
        required: true
        default: "neural-chat:7b-v3-q4_K_M"
        type: choice
        options:
          # === HEAVY UNCENSORED MODELS (NOW POSSIBLE WITH 30GB+ FREED) ===
          - mistral:7b-instruct-q4_K_M # 3.8GB, 28 tok/s, quality 8.1 (BEST OVERALL)
          - hermes-3-llama-3.2-uncensored:q4_K_M # 4.9GB, 25 tok/s, quality 8.7 (EXCELLENT, UNCENSORED)
          - neural-chat:7b-v3-q4_K_M # 5.0GB, 20 tok/s, quality 7.9 (RELIABLE)
          - wizard-vicuna-uncensored:q4_K_M # 4.5GB, 22 tok/s, quality 8.2 (UNCENSORED, NO LIMITS)
          # === LIGHTWEIGHT (FAST RESPONSE) ===
          - phi-3:3.8b-mini-instruct-q4_0 # 2.7GB, 35 tok/s, quality 7.5 (FASTEST)
          - orca-mini:3b # 2.0GB, 40 tok/s, quality 7.2 (ULTRA-FAST)
      penetration_phase:
        description: "Attack phase(s)"
        required: true
        default: "full"
        type: choice
        options:
          - recon
          - exploitation
          - web_forge
          - reverse_engineering
          - post_exploitation
          - full
      enable_exfiltration:
        description: "Enable exfiltration/persistence simulation"
        default: "false"
        type: choice
        options: ["true", "false"]
      run_duration_hours:
        description: "Max run time (hours)"
        default: "6"
        type: choice
        options: ["1", "2", "3", "4", "5", "6", "8", "12"]
      telegram_enable:
        description: "Enable Telegram bot"
        default: "true"
        type: choice
        options: ["true", "false"]
      telegram_chat_id:
        description: "Authorised Telegram chat ID"
        required: false
        default: ""
      telegram_bot_token:
        description: "Telegram Bot Token"
        required: false
        default: ""
      enable_social_engineering:
        description: "Social engineering simulation"
        default: "false"
        type: choice
        options: ["true", "false"]
      ctf_mode:
        description: "CTF solver mode"
        default: "false"
        type: choice
        options: ["true", "false"]
      cloud_vm_provider:
        description: "Cloud provider for ephemeral VMs (optional)"
        default: "none"
        type: choice
        options: ["none", "aws", "gcp", "azure"]
      report_email:
        description: "Email for final report"
        required: false
        default: ""
      discord_webhook:
        description: "Discord webhook URL"
        required: false
        default: ""
      slack_webhook:
        description: "Slack webhook URL"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  security-events: write
  deployments: write
  packages: write
  statuses: write

env:
  OLLAMA_HOST: "0.0.0.0:11434"
  OLLAMA_READ_TIMEOUT: "3600"
  OLLAMA_KEEP_ALIVE: "24h"
  OLLAMA_MODEL_CACHE: "/home/runner/.ollama/models"
  TARGET: ${{ github.event.inputs.target || '127.0.0.1' }}
  LHOST: ${{ github.event.inputs.lhost || '' }}
  LPORT: ${{ github.event.inputs.lport || '4444' }}
  AI_MODEL: ${{ github.event.inputs.ai_model || 'phi-3:3.8b-mini-instruct-q4_0' }}
  PHASE: ${{ github.event.inputs.penetration_phase || 'full' }}
  ENABLE_EXFIL: ${{ github.event.inputs.enable_exfiltration || 'false' }}
  MAX_HOURS: ${{ github.event.inputs.run_duration_hours || '6' }}
  TELEGRAM_ENABLE: ${{ github.event.inputs.telegram_enable || 'true' }}
  TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || '' }}
  TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN || '' }}
  SOCIAL_ENG: ${{ github.event.inputs.enable_social_engineering || 'false' }}
  CTF_MODE: ${{ github.event.inputs.ctf_mode || 'false' }}
  CLOUD_VM: ${{ github.event.inputs.cloud_vm_provider || 'none' }}
  REPORT_EMAIL: ${{ github.event.inputs.report_email || '' }}
  DISCORD_WEBHOOK: ${{ github.event.inputs.discord_webhook || '' }}
  SLACK_WEBHOOK: ${{ github.event.inputs.slack_webhook || '' }}
  GITHUB_REPO: ${{ github.repository }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}
  GITHUB_ACTOR: ${{ github.actor }}
  WF_NAME: ${{ github.workflow }}

jobs:
  bootstrap:
    name: "ZYGOR Bootstrap & Ollama AI Engine"
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    outputs:
      ai_ready: ${{ steps.ai_status.outputs.ok }}
      model_pulled: ${{ steps.pull_model.outputs.pulled }}
      final_model: ${{ steps.pull_model.outputs.final_model }}
      telegram_enabled: ${{ steps.set_telegram_flag.outputs.telegram }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: "AGGRESSIVE DISK EXPANSION (Free 30GB+) - CRITICAL FOR MODEL SELECTION"
        shell: bash
        run: |
          echo ">>> [DISK EXPANSION] Removing preinstalled unused packages..."
          echo "[*] Initial disk before cleanup:"
          df -h / | tail -1 | awk '{print "    Total: " $2 " | Used: " $3 " | Available: " $4}'

          # Remove .NET runtime (20GB+)
          if [ -d "/usr/share/dotnet" ]; then
            echo "[+] Removing /usr/share/dotnet (20GB)..."
            sudo rm -rf /usr/share/dotnet
          fi

          # Remove GHC compiler (7GB+)
          if [ -d "/opt/ghc" ]; then
            echo "[+] Removing /opt/ghc (7GB)..."
            sudo rm -rf /opt/ghc
          fi

          # Remove Android SDK (5GB+)
          if [ -d "/usr/local/lib/android" ]; then
            echo "[+] Removing /usr/local/lib/android (5GB)..."
            sudo rm -rf /usr/local/lib/android
          fi

          # Prune Docker images and volumes (2-3GB)
          if command -v docker &> /dev/null; then
            echo "[+] Pruning Docker system..."
            sudo docker system prune -af 2>/dev/null || true
          fi

          # Remove apt cache
          echo "[+] Cleaning apt cache..."
          sudo apt-get clean
          sudo apt-get autoclean

          # Remove old package lists
          sudo rm -rf /var/lib/apt/lists/*

          echo "[*] Final disk after expansion:"
          df -h / | tail -1 | awk '{print "    Total: " $2 " | Used: " $3 " | Available: " $4}'

          AVAIL_BYTES=$(df -B1 / | tail -1 | awk '{print $4}')
          AVAIL_GB=$(echo "scale=2; $AVAIL_BYTES / 1024 / 1024 / 1024" | bc)
          echo "[✓] Disk expansion complete: ${AVAIL_GB}GB available"

          if (( $(echo "$AVAIL_GB > 30" | bc -l) )); then
            echo "[✓✓✓] EXCELLENT: >30GB available (can fit LARGE models)"
          elif (( $(echo "$AVAIL_GB > 20" | bc -l) )); then
            echo "[✓✓] GOOD: >20GB available (can fit 2-3 models)"
          elif (( $(echo "$AVAIL_GB > 14" | bc -l) )); then
            echo "[✓] OK: >14GB available (standard GitHub capacity)"
          else
            echo "[-] WARNING: <14GB available (tight, but manageable)"
          fi

      - name: "Restore Ollama model cache"
        id: cache_ollama
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODEL_CACHE }}
          key: ollama-${{ env.AI_MODEL }}-v4-open
          restore-keys: |
            ollama-${{ env.AI_MODEL }}-
            ollama-

      - name: "Install offensive toolchain (apt)"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl wget git unzip zip jq yq python3 python3-pip python3-dev python3-venv \
            build-essential gcc g++ gdb clang cmake make autoconf automake libtool pkg-config \
            nmap masscan arp-scan netcat-openbsd netcat-traditional metasploit-framework nuclei \
            seclists john hashcat hashid hash-identifier ffuf sqlmap ldap-utils docker.io podman \
            aircrack-ng reaver bully pixiewps perl ruby-full ruby-dev golang rustc cargo mingw-w64 \
            nasm libpcap-dev libssl-dev libffi-dev libsqlite3-dev patchelf binutils mitm6 responder \
            impacket-scripts dnsutils net-tools iproute2 tcpdump traceroute whois wireshark tshark \
            hydra medusa wafw00f subfinder amass nikto wpscan dirb gobuster whatweb exploitdb powershell \
            ghidra radare2 cutter frida-tools apktool dex2jar jadx steghide stegosploit binwalk foremost \
            exiftool imagemagick sox ffmpeg espeak openvpn wireguard tor proxychains4 2>/dev/null || true

      - name: "Install Python packages"
        shell: bash
        run: |
          pip3 install --quiet --break-system-packages --upgrade pip setuptools wheel
          pip3 install --quiet --break-system-packages \
            pwntools impacket requests beautifulsoup4 lxml shodan censys python-nmap bloodhound-ce \
            python-ldap pyOpenSSL paramiko aiohttp aiofiles asyncio scapy colorama tqdm rich psutil \
            pycryptodome rsa pycryptodomex cffi cryptography dnspython flask fastapi uvicorn jinja2 \
            markdown httpx httplib2 urllib3 websockets docker kubernetes boto3 azure-storage-blob \
            google-cloud-storage sendgrid python-telegram-bot python-dotenv capstone keystone-engine \
            unicorn pefile elftools lief yara-python frida-tools objection androguard r2pipe 2>/dev/null || true

      - name: "Install Go tools"
        shell: bash
        run: |
          export GOPATH=/home/runner/go
          export PATH=$PATH:/usr/local/go/bin:$GOPATH/bin
          mkdir -p $GOPATH
          for tool in subfinder httpx notify uncover katana naabu dnsx chaos-client interactsh-client mapcidr; do
            go install -v github.com/projectdiscovery/$tool/v2/cmd/$tool@latest 2>/dev/null || true
          done

      - name: "Create runtime directories (FIXED)"
        shell: bash
        run: |
          sudo mkdir -p /opt/zygor/{bin,templates,wordlists,payloads,reports,logs,c2,reverse_eng,phish,forensics}
          sudo mkdir -p /var/log/zygor              # <-- ADDED THIS LINE
          sudo chmod -R 777 /opt/zygor /var/log/zygor

      - name: "Install Ollama & start server"
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          export OLLAMA_HOST="${OLLAMA_HOST}"
          OLLAMA_KEEP_ALIVE="${OLLAMA_KEEP_ALIVE}" OLLAMA_READ_TIMEOUT="${OLLAMA_READ_TIMEOUT}" ollama serve > /var/log/zygor/ollama.log 2>&1 &

          # Wait for Ollama to be fully ready with extended timeout
          echo "[*] Waiting for Ollama to start (up to 120 seconds)..."
          for i in $(seq 1 120); do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "[+] Ollama ready after ${i}s"
              sleep 2  # Extra time for server to fully initialize
              break
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "[*] Still waiting... ${i}s"
            fi
            sleep 1
          done

          # Verify Ollama is responding
          if ! curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
            echo "[-] ERROR: Ollama did not start properly"
            tail -50 /var/log/zygor/ollama.log
            exit 1
          fi
          echo "[✓] Ollama server online and responsive"

      - name: "Disk Health Check & Aggressive Cleanup (CRITICAL)"
        shell: bash
        run: |
          echo ">>> [DISK CHECK] Starting disk health and cleanup..."

          # Get current disk usage
          DISK_STATS=$(df -B1 / | tail -1)
          TOTAL=$(echo $DISK_STATS | awk '{print $2}')
          AVAIL=$(echo $DISK_STATS | awk '{print $4}')
          AVAIL_GB=$(echo "scale=2; $AVAIL / 1024 / 1024 / 1024" | bc)
          USED_PCT=$(echo $DISK_STATS | awk '{print $5}' | sed 's/%//')

          echo "[*] Disk Status: ${AVAIL_GB}GB free (${USED_PCT}% used)"

          # CRITICAL threshold: less than 0.5GB free
          CRITICAL_BYTES=$((500 * 1024 * 1024))

          if [ "$AVAIL" -lt "$CRITICAL_BYTES" ]; then
            echo "[-] CRITICAL: Disk space < 0.5GB! Running aggressive cleanup..."
            
            # 1. Remove old Ollama model blobs (keep only 1 most recent)
            if [ -d ~/.ollama/models/blobs ]; then
              echo "[*] Cleaning old Ollama model blobs..."
              find ~/.ollama/models/blobs -maxdepth 1 -type d -printf '%T@ %p\n' | sort -rn | tail -n +2 | cut -d' ' -f2- | while read dir; do
                if [ -d "$dir" ]; then
                  SIZE=$(du -sb "$dir" 2>/dev/null | awk '{print $1}')
                  SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
                  rm -rf "$dir"
                  echo "[+] Deleted old model blob (${SIZE_MB}MB)"
                fi
              done
            fi
            
            # 2. Compress and remove old logs
            echo "[*] Compressing old logs..."
            find /var/log -name "*.log" -mtime +3 -type f 2>/dev/null | while read f; do
              if [ -f "$f" ] && [ ! -f "${f}.gz" ]; then
                gzip "$f" 2>/dev/null && echo "[+] Compressed: $f"
              fi
            done
            
            # 3. Clean temp files
            echo "[*] Cleaning temp files..."
            rm -rf /tmp/telegram* /tmp/zygor* /tmp/ollama* /tmp/ai_* 2>/dev/null || true
            
            # 4. SQLite vacuum
            echo "[*] Optimizing databases..."
            for db in $(find ~/.ollama -name "*.db" 2>/dev/null); do
              sqlite3 "$db" "VACUUM" 2>/dev/null && echo "[+] Vacuumed: $db"
            done
            
            # 5. Re-check disk
            AVAIL_NEW=$(df -B1 / | tail -1 | awk '{print $4}')
            AVAIL_GB_NEW=$(echo "scale=2; $AVAIL_NEW / 1024 / 1024 / 1024" | bc)
            echo "[+] Disk after cleanup: ${AVAIL_GB_NEW}GB free"
            
            if [ "$AVAIL_NEW" -lt "$CRITICAL_BYTES" ]; then
              echo "[-] CRITICAL: Still < 0.5GB after cleanup! May fail."
            fi
          fi

          # WARNING threshold: less than 2GB free
          WARN_BYTES=$((2 * 1024 * 1024 * 1024))
          if [ "$AVAIL" -lt "$WARN_BYTES" ] && [ "$AVAIL" -gt "$CRITICAL_BYTES" ]; then
            echo "[-] WARNING: Low disk space (< 2GB). Running light cleanup..."
            find /tmp -name "telegram*" -o -name "zygor*" 2>/dev/null | xargs rm -rf
            echo "[+] Cleaned /tmp artifacts"
          fi

          echo "[+] Disk check complete"

      - name: "Pull AI model (with exponential backoff retry)"
        id: pull_model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="${{ env.AI_MODEL }}"
          # OPTIMIZED FOR 40GB+ FREED SPACE: Prioritize quality uncensored models
          # Now we can fit: Hermes-3 (4.9GB) + Mistral (3.8GB) + Phi-3 (2.7GB) = 11.4GB + buffer
          # With 30GB+ freed: Can store MULTIPLE models simultaneously for comparison
          FALLBACKS=(
            "hermes-3-llama-3.2-uncensored:q4_K_M"  # 4.9GB, 25 tok/s, quality 8.7 ← UNCENSORED, BEST
            "mistral:7b-instruct-q4_K_M"             # 3.8GB, 28 tok/s, quality 8.1
            "wizard-vicuna-uncensored:q4_K_M"        # 4.5GB, 22 tok/s, quality 8.2 ← UNCENSORED, NO LIMITS
            "neural-chat:7b-v3-q4_K_M"               # 5.0GB, 20 tok/s, quality 7.9
            "phi-3:3.8b-mini-instruct-q4_0"          # 2.7GB, 35 tok/s, quality 7.5 ← FALLBACK (fastest)
            "orca-mini:3b"                           # 2.0GB, 40 tok/s, quality 7.2 ← EMERGENCY (lightest)
          )

          pull_with_retry() {
            local model="$1"
            local max_attempts=3
            local backoff=30
            
            for attempt in $(seq 1 $max_attempts); do
              echo ">>> [Attempt $attempt/$max_attempts] Pulling $model (backoff=${backoff}s)"
              if timeout 1800 ollama pull "$model" 2>&1 | tee /tmp/pull_$attempt.log; then
                echo "[✓] Successfully pulled $model"
                return 0
              fi
              
              if [ $attempt -lt $max_attempts ]; then
                echo "[-] Attempt $attempt failed, waiting ${backoff}s before retry..."
                sleep $backoff
                backoff=$((backoff * 2))  # Exponential backoff: 30 → 60 → 120
              fi
            done
            echo "[-] Failed to pull $model after $max_attempts attempts"
            return 1
          }

          # Try primary model first
          if pull_with_retry "$MODEL"; then
            echo "pulled=true" >> $GITHUB_OUTPUT
            echo "final_model=$MODEL" >> $GITHUB_OUTPUT
            echo "[+] PRIMARY MODEL READY: $MODEL"
            exit 0
          fi

          # Try fallbacks in priority order (UNCENSORED HEAVY MODELS FIRST)
          echo "[-] Primary model failed, trying fallbacks..."
          for fb in "${FALLBACKS[@]}"; do
            if [ "$fb" != "$MODEL" ]; then
              echo "[*] Attempting fallback: $fb"
              if pull_with_retry "$fb"; then
                echo "pulled=true" >> $GITHUB_OUTPUT
                echo "final_model=$fb" >> $GITHUB_OUTPUT
                echo "[+] FALLBACK MODEL READY: $fb"
                exit 0
              fi
            fi
          done

          echo "[-] CRITICAL ERROR: All model pulls failed (primary + all fallbacks exhausted)"
          echo "[-] This error should NEVER appear - check disk space and network"
          echo "pulled=false" >> $GITHUB_OUTPUT
          echo "final_model=none" >> $GITHUB_OUTPUT
          exit 1

      - name: "Build Ollama‑only AI completion engine (v2 with streaming)"
        id: ai_status
        shell: bash
        run: |
          set -euo pipefail
          FINAL_MODEL="$(echo '${{ steps.pull_model.outputs.final_model }}')"
          MODEL_STATUS="${{ steps.pull_model.outputs.pulled }}"

          if [ "$MODEL_STATUS" != "true" ]; then
            echo "[-] ERROR: Model pull failed. AI service UNAVAILABLE"
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [ -z "$FINAL_MODEL" ] || [ "$FINAL_MODEL" = "none" ]; then
            echo "[-] ERROR: No valid AI model selected"
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "[+] AI Model: $FINAL_MODEL"
          export AI_MODEL="$FINAL_MODEL"  # CRITICAL: Export for ai_complete script

          # Verify model is actually available in Ollama (with retries)
          echo "[*] Verifying model in Ollama..."
          MAX_VERIFY_ATTEMPTS=15
          for i in $(seq 1 $MAX_VERIFY_ATTEMPTS); do
            MODEL_LIST=$(curl -s http://localhost:11434/api/tags 2>/dev/null | jq '.models[] .name' -r 2>/dev/null || echo "")
            if echo "$MODEL_LIST" | grep -q "^${FINAL_MODEL}$"; then
              echo "[✓] Model verified in Ollama: $FINAL_MODEL (attempt $i/$MAX_VERIFY_ATTEMPTS)"
              sleep 2
              break
            fi
            if [ $i -lt $MAX_VERIFY_ATTEMPTS ]; then
              echo "[*] Model not yet fully loaded, waiting... ($i/$MAX_VERIFY_ATTEMPTS)"
              sleep 3
            else
              echo "[-] ERROR: Model not found after $MAX_VERIFY_ATTEMPTS attempts"
              echo "[DEBUG] Model list:"
              curl -s http://localhost:11434/api/tags | jq '.models' 2>/dev/null || echo "Could not get model list"
              echo "ok=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          done

          # Create ai_complete script with ROBUST error handling
          cat > /opt/zygor/bin/ai_complete << 'AICOMPLETE_EOF'
          #!/bin/bash
          set -euo pipefail

          PROMPT="$(cat -)"
          MAX_TOKENS="${1:-64}"
          TIMEOUT="${2:-30}"
          MAX_RETRIES="${3:-3}"

          # Use provided AI_MODEL or fall back to env var
          AI_MODEL="${AI_MODEL:-phi-3:3.8b-mini-instruct-q4_0}"

          if [ "$AI_MODEL" = "none" ] || [ -z "$AI_MODEL" ]; then
            echo "ERROR: No AI model configured"
            exit 1
          fi

          # Retry logic with exponential backoff
          for attempt in $(seq 1 $MAX_RETRIES); do
            # Execute query with explicit error handling
            RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate \
              --connect-timeout 5 \
              --max-time $TIMEOUT \
              -H "Content-Type: application/json" \
              -d "{
                \"model\": \"$AI_MODEL\",
                \"prompt\": \"$PROMPT\",
                \"stream\": false,
                \"keep_alive\": \"24h\",
                \"options\": {
                  \"num_predict\": $MAX_TOKENS,
                  \"temperature\": 0.3,
                  \"repeat_penalty\": 1.1,
                  \"top_p\": 0.9
                }
              }" 2>/dev/null) || RESPONSE=""

            # Validate JSON response
            if [ -n "$RESPONSE" ]; then
              # Check if response contains .response field
              if echo "$RESPONSE" | jq -e '.response' >/dev/null 2>&1; then
                echo "$RESPONSE" | jq -r '.response'
                exit 0
              fi
            fi

            # If we got here, attempt failed
            if [ $attempt -lt $MAX_RETRIES ]; then
              BACKOFF=$((attempt * 3))
              echo "[Retry $attempt/$MAX_RETRIES in ${BACKOFF}s]" >&2
              sleep $BACKOFF
            fi
          done

          # All retries exhausted
          echo "ERROR: Failed to get response from model after $MAX_RETRIES attempts"
          exit 1
          AICOMPLETE_EOF

          chmod +x /opt/zygor/bin/ai_complete
          sudo cp /opt/zygor/bin/ai_complete /usr/local/bin/ai_complete

          # Export AI_MODEL for subshells
          export AI_MODEL="$FINAL_MODEL"

          # === WARMUP PHASE ===
          echo "[*] Warmup Phase: Preparing model for inference..."
          WARMUP_ATTEMPTS=3
          for wu_attempt in $(seq 1 $WARMUP_ATTEMPTS); do
            echo "[*] Warmup attempt $wu_attempt/$WARMUP_ATTEMPTS (60s timeout)..."
            
            # Execute warmup with exported AI_MODEL
            if timeout 65 bash -c "export AI_MODEL='$FINAL_MODEL'; echo 'Hello' | /opt/zygor/bin/ai_complete 8 30 1" >/dev/null 2>&1; then
              echo "[✓] Warmup successful"
              sleep 2
              break
            else
              if [ $wu_attempt -lt $WARMUP_ATTEMPTS ]; then
                echo "[-] Warmup attempt $wu_attempt failed, retrying in 5s..."
                sleep 5
              fi
            fi
          done

          # === FINAL VALIDATION ===
          echo "[*] Final Validation: Testing AI query..."
          TEST_RESPONSE=""

          # Run test with explicit environment
          TEST_RESPONSE=$(timeout 50 bash -c "export AI_MODEL='$FINAL_MODEL'; echo 'Say OK' | /opt/zygor/bin/ai_complete 4 40 2" 2>&1) || TEST_RESPONSE="QUERY_FAILED"

          if echo "$TEST_RESPONSE" | grep -iq "error\|failed"; then
            echo "[-] AI test FAILED: $TEST_RESPONSE"
            echo "[-] Debugging Info:"
            echo "    AI_MODEL: $AI_MODEL"
            echo "    FINAL_MODEL: $FINAL_MODEL"
            echo "    Ollama Health:"
            curl -s http://localhost:11434/api/tags | jq '.' 2>/dev/null | head -20 || echo "Could not fetch Ollama status"
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Success
          if [ -z "$TEST_RESPONSE" ]; then
            echo "[!] Warning: Empty response, but no error"
            TEST_RESPONSE="(empty response, but query succeeded)"
          fi

          echo "[✓] AI engine ready and responding"
          echo "[+] Test response: ${TEST_RESPONSE:0:80}..."
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: "Set Telegram flag"
        id: set_telegram_flag
        run: echo "telegram=${{ env.TELEGRAM_ENABLE }}" >> $GITHUB_OUTPUT

      - name: "Create system persona"
        shell: bash
