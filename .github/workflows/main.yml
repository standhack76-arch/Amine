              """After MAX_HOURS-0.5h, trigger a new workflow with same params"""
              env = os.environ.copy()
              token = env.get('GITHUB_TOKEN', env.get('GH_TOKEN', ''))
              if not token:
                  try:
                      with open('/opt/zygor/.session_token','r') as f: pass
                  except: pass
              # Wait until nearly done
              delay = max(60, (MAX_HOURS * 3600) - 1800)
              await asyncio.sleep(delay)
              
              payload = json.dumps({
                  "ref":"main",
                  "inputs":{
                      "target":TARGET,"lhost":os.environ.get('LHOST',''),
                      "lport":os.environ.get('LPORT','4444'),
                      "ai_model":AI_MODEL,"penetration_phase":PHASE,
                      "enable_exfiltration":os.environ.get('ENABLE_EXFIL','false'),
                      "run_duration_hours":str(MAX_HOURS),
                      "telegram_enable":"true",
                      "telegram_chat_id":CHAT_ID,
                      "telegram_bot_token":TOKEN,
                      "session_token":SESSION_TOKEN
                  }
              })
              
              for _ in range(5):  # Retry 5 times
                  try:
                      proc = await asyncio.create_subprocess_exec(
                          'curl','-s','-X','POST',
                          'https://api.github.com/repos/'+REPO+'/actions/workflows/'+os.environ.get('WF_NAME','')+'/dispatches',
                          '-H','Authorization: token '+token,
                          '-H','Accept: application/vnd.github.v3+json',
                          '-d',payload,
                          stdout=asyncio.subprocess.PIPE,stderr=asyncio.subprocess.PIPE)
                      out,err = await asyncio.wait_for(proc.communicate(),timeout=30)
                      logging.info(f"Re-trigger response: {out.decode()[:200]}")
                      return
                  except Exception as e:
                      logging.error(f"Re-trigger failed: {e}")
                      await asyncio.sleep(30)

