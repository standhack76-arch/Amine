              try: return json.loads(result.stdout.decode())
              except: return {"type":"misc","confidence":0.5}
          def generate_solution(ctype, files):
              prompt = f"Write step-by-step CTF solution for type {ctype} with files {files}. Include commands and flag format."
              return subprocess.run(["/opt/zygor/bin/ai_complete","4096"], input=prompt.encode(), capture_output=True, timeout=300).stdout.decode()
          if __name__ == '__main__':
              files = sys.argv[1:] if len(sys.argv)>1 else ["."]
              analysis = identify_challenge_type(files)
              print(f"Type: {analysis.get('type')}, Confidence: {analysis.get('confidence')}")
              print(generate_solution(analysis.get('type','misc'), files))
