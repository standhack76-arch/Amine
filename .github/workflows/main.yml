          path: /opt/zygor/reports/ctf/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 8: ☁️ CLOUD VM SPAWNER (Ephemeral Testing Environments)
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  cloud_vm_spawner:
    name: '☁️ Cloud VM Spawner'
    needs: [bootstrap]
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 300
    if: |
      github.event_name == 'schedule' || inputs.cloud_vm_provider != 'none'
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /opt/zygor/reports/cloud_vm

      - name: '☁️ Spawn Ephemeral VM'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          echo "::group::Cloud VM Spawner"
          PROVIDER="${CLOUD_VM:-none}"

          case "$PROVIDER" in
            aws)
              echo "Spawning AWS EC2 instance..."
              python3 /opt/zygor/bin/spawn_vm.py aws \
                > /opt/zygor/reports/cloud_vm/vm_result.json 2>/dev/null || true
              ;;
            gcp)
              echo "Spawning GCP Compute instance..."
              python3 /opt/zygor/bin/spawn_vm.py gcp \
                > /opt/zygor/reports/cloud_vm/vm_result.json 2>/dev/null || true
              ;;
            azure)
              echo "Spawning Azure VM..."
              python3 /opt/zygor/bin/spawn_vm.py azure \
                > /opt/zygor/reports/cloud_vm/vm_result.json 2>/dev/null || true
              ;;
            none)
              echo "No cloud provider configured. Skipping VM spawn."
              echo '{"provider": "none", "status": "skipped"}' > /opt/zygor/reports/cloud_vm/vm_result.json
              ;;
          esac

          cat /opt/zygor/reports/cloud_vm/vm_result.json 2>/dev/null || echo "No VM result"
          echo "::endgroup::"

      - name: '📤 Upload Cloud VM artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-vm-results-${{ github.run_id }}
          path: /opt/zygor/reports/cloud_vm/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 9: 💬 CHATOPS – Interactive AI Chat via GitHub Issues + Telegram Log Forwarding
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  chat_ops:
    name: '💬 AI ChatOps & Log Forwarding'
    needs: [bootstrap]
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360
    if: |
      always() &&
      (github.event_name == 'schedule' || inputs.enable_chat_ops == 'true')
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV

      - name: '💬 AI Chat Monitor (GitHub Issues)'
        shell: bash
        run: |
          echo "::group::ChatOps Monitor"
          echo "Monitoring GitHub Issue #${CHAT_ISSUE} for commands..."

          # Process any pending /chat commands
          LAST_COMMENT=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${CHAT_ISSUE}/comments?per_page=1&sort=updated" \
            2>/dev/null)

          BODY=$(echo "$LAST_COMMENT" | jq -r '.[0].body // ""' 2>/dev/null)

          if echo "$BODY" | grep -qi '^/chat'; then
            QUERY=$(echo "$BODY" | sed 's/^\/chat[[:space:]]*//')
            echo "Processing /chat command: $QUERY"

            ANSWER=$(echo "$QUERY" | ai_complete 4096 2>/dev/null || echo "AI engine not available")

            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg body "$ANSWER" '{"body": $body}')" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${CHAT_ISSUE}/comments" \
              2>/dev/null || true

            echo "✓ Responded to /chat command"
          else
            echo "No pending /chat commands found"
            echo "Last comment: $(echo "$BODY" | head -c 200)"
          fi

          echo "::endgroup::"

      - name: '📤 Forward Logs to Telegram (if enabled)'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "${TELEGRAM_ENABLE}" = "true" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "::group::Telegram Log Forwarding"

            # Collect recent log summaries
            RECON_LOG=$(ls -la /tmp/recon/ 2>/dev/null | wc -l)
            EXPLOIT_LOG=$(ls -la /tmp/exploit_output/ 2>/dev/null | wc -l)
            WEBFORGE_LOG=$(ls -la /tmp/web_forge_output/ 2>/dev/null | wc -l)

            SUMMARY="📊 *ZYGOR v4.0 Operation Update*\n"
            SUMMARY+="🎯 *Target*: \`${TARGET}\`\n"
            SUMMARY+="🧠 *Model*: \`${AI_MODEL}\`\n"
            SUMMARY+="⚡ *Phase*: \`${PHASE}\`\n"
            SUMMARY+="🔒 *Exfil*: \`${ENABLE_EXFIL}\`\n"
            SUMMARY+="📁 Recon files: ${RECON_LOG}\n"
            SUMMARY+="💥 Exploit files: ${EXPLOIT_LOG}\n"
            SUMMARY+="🌐 Web Forge files: ${WEBFORGE_LOG}\n"
            SUMMARY+="🆔 Run ID: ${GITHUB_RUN_ID}\n"

            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$(echo -e "$SUMMARY")" '{
                "chat_id": $ENV.TELEGRAM_CHAT_ID,
                "text": $text,
                "parse_mode": "Markdown"
              }')" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              2>/dev/null || true

            echo "✓ Logs forwarded to Telegram"
            echo "::endgroup::"
          fi

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 10: 📊 LIVE DASHBOARD GENERATOR (GitHub Pages)
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  dashboard_generator:
    name: '📊 Live Dashboard Generator'
    needs: [bootstrap, reconnaissance, exploitation]
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 60
    if: always()
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /opt/zygor/reports/dashboard

      - name: '📊 Generate Live HTML Dashboard'
        shell: bash
        run: |
          echo "::group::Dashboard Generation"

          # Collect all findings and status data
          FINDINGS=""
          for f in /tmp/recon/ai_analysis.txt /tmp/recon/nuclei_web.txt /tmp/recon/*.nmap /tmp/exploit_output/msf_output.txt; do
            if [ -f "$f" ]; then
              FINDINGS+="$(cat $f 2>/dev/null | head -1000)\n"
            fi
          done

          # Generate the dashboard HTML using AI
          PROMPT="Generate a complete, self-contained HTML dashboard for a penetration testing operation.
          Operation name: ZYGOR v4.0
          Target: $TARGET
          AI Model: $AI_MODEL
          Exfil Mode: $ENABLE_EXFIL
          Phase: $PHASE

          Include:
          1. Dark theme UI with neon green/cyan accents
          2. Real-time status indicators
          3. Scanning statistics (hosts up, ports found, vulnerabilities, exploits run)
          4. Latest findings table with severity color coding (Critical=red, High=orange, Medium=yellow, Low=green)
          5. Activity log section
          6. AI engine status
          7. JavaScript with Chart.js for data visualization (doughnut chart for phase progress, line chart for findings over time)
          8. Responsive grid layout
          9. Auto-refresh meta tag every 30 seconds

          Output ONLY the complete HTML file content."

          ai_complete 8192 <<< "$PROMPT" > /opt/zygor/reports/dashboard/index.html 2>/dev/null || true

          # If AI generation failed, use the Python generator
          if [ ! -s /opt/zygor/reports/dashboard/index.html ]; then
            echo "AI dashboard generation failed, using fallback..."
            python3 /opt/zygor/bin/generate_dashboard.py \
              "$TARGET" \
              /opt/zygor/reports/dashboard/index.html 2>/dev/null || true
          fi

          echo "Dashboard saved to /opt/zygor/reports/dashboard/index.html"
          wc -c /opt/zygor/reports/dashboard/index.html 2>/dev/null || echo "Dashboard file missing"

          echo "::endgroup::"

      - name: '📤 Deploy Dashboard to GitHub Pages'
        shell: bash
        run: |
          echo "::group::GitHub Pages Deploy"

          # Create gh-pages branch content
          mkdir -p /tmp/gh_pages
          cp /opt/zygor/reports/dashboard/index.html /tmp/gh_pages/index.html

          # Create a simple README
          cat > /tmp/gh_pages/README.md << 'README'
          # ZYGOR v4.0 Live Dashboard

          This is a live penetration testing dashboard generated by ZYGOR v4.0.

          **Target:** ${TARGET}
          **Generated:** $(date -u)
          **Run ID:** ${GITHUB_RUN_ID}

          > ⚠️ This dashboard contains sensitive security assessment data.
          > Ensure the repository is private or restrict access accordingly.
          README

          # Deploy to gh-pages branch using the GITHUB_TOKEN
          cd /tmp/gh_pages
          git init
          git checkout -b gh-pages
          git config user.email "zygor@pentest.ai"
          git config user.name "ZYGOR v4.0 AI"

          git add .
          git commit -m "📊 ZYGOR Live Dashboard - $(date -u)" 2>/dev/null || true

          git remote add origin "https://x-access-token:${GITHUB_TOKEN_ABORT}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git push -f origin gh-pages 2>/dev/null && echo "✅ Dashboard deployed to GitHub Pages" || echo "⚠️ GitHub Pages deploy failed (may already be on gh-pages or token issue)"

          echo "::endgroup::"

      - name: '📤 Upload Dashboard artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-dashboard-${{ github.run_id }}
          path: /opt/zygor/reports/dashboard/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 11: 💾 BACKUP ORCHESTRATOR – Cloud artifact backup
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  backup_orchestrator:
    name: '💾 Backup Orchestrator'
    needs: [bootstrap, reconnaissance, exploitation, web_forge]
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 120
    if: |
      always() &&
      (github.event_name == 'schedule' || inputs.backup_provider != 'none')
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          mkdir -p /tmp/backup_archive
          echo "Backup provider: ${BACKUP_PROVIDER}"

      - name: '📦 Package all artifacts for backup'
        shell: bash
        run: |
          echo "::group::Artifact Packaging"
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          BACKUP_DIR="/tmp/backup_archive/zygor_backup_${TIMESTAMP}"
          mkdir -p "$BACKUP_DIR"

          # Collect all artifacts
          cp -r /opt/zygor/reports/* "$BACKUP_DIR/" 2>/dev/null || true
          cp -r /tmp/recon/* "$BACKUP_DIR/recon/" 2>/dev/null && mkdir -p "$BACKUP_DIR/recon" || true
          cp -r /tmp/exploit_output/* "$BACKUP_DIR/exploits/" 2>/dev/null && mkdir -p "$BACKUP_DIR/exploits" || true
          cp -r /tmp/web_forge_output/* "$BACKUP_DIR/webforge/" 2>/dev/null && mkdir -p "$BACKUP_DIR/webforge" || true
          cp -r /opt/zygor/payloads/* "$BACKUP_DIR/payloads/" 2>/dev/null && mkdir -p "$BACKUP_DIR/payloads" || true
          cp /opt/zygor/env_snapshot.txt "$BACKUP_DIR/" 2>/dev/null || true

          # Compress
          cd /tmp/backup_archive
          tar -czf "zygor_backup_${TIMESTAMP}.tar.gz" "zygor_backup_${TIMESTAMP}/"
          echo "Backup size: $(du -sh zygor_backup_${TIMESTAMP}.tar.gz | cut -f1)"
          mv "zygor_backup_${TIMESTAMP}.tar.gz" /opt/zygor/reports/
          echo "::endgroup::"

      - name: '☁️ Upload to Cloud Provider'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          echo "::group::Cloud Upload"
          case "${BACKUP_PROVIDER}" in
            s3)
              echo "Uploading to AWS S3..."
              aws s3 cp /opt/zygor/reports/ s3://zygor-backups/${GITHUB_RUN_ID}/ \
                --recursive --quiet 2>/dev/null || echo "⚠️ AWS S3 upload failed. Check credentials."
              ;;
            gcs)
              echo "Uploading to Google Cloud Storage..."
              if [ -n "$GCP_SERVICE_ACCOUNT_KEY" ]; then
                echo "$GCP_SERVICE_ACCOUNT_KEY" > /tmp/gcp-key.json
                gcloud auth activate-service-account --key-file=/tmp/gcp-key.json 2>/dev/null || true
                gsutil cp -r /opt/zygor/reports/* gs://zygor-backups/${GITHUB_RUN_ID}/ 2>/dev/null || echo "⚠️ GCS upload failed"
              fi
              ;;
            azure)
              echo "Uploading to Azure Blob Storage..."
              if [ -n "$AZURE_STORAGE_CONNECTION_STRING" ]; then
                azcopy copy /opt/zygor/reports/ \
                  "https://zygorbackups.blob.core.windows.net/backups/${GITHUB_RUN_ID}/" \
                  --recursive 2>/dev/null || echo "⚠️ Azure upload failed"
              fi
              ;;
            none)
              echo "No backup provider configured. Artifacts saved in workflow artifacts only."
              ;;
          esac
          echo "::endgroup::"

      - name: '📤 Upload Backup artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-backup-manifest-${{ github.run_id }}
          path: |
            /opt/zygor/reports/zygor_backup_*.tar.gz
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 12: 📊 FINAL EXECUTIVE REPORT
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  executive_report:
    name: '📊 ZYGOR Executive Report'
    needs: [bootstrap, reconnaissance, exploitation, web_forge, chat_ops, backup_orchestrator]
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 120
    if: always()
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /opt/zygor/reports/final

      - name: '📊 AI Generates Executive Summary & Remediation Report'
        shell: bash
        run: |
          echo "::group::AI Executive Report Generation"

          # Collect all findings across all modules
          COLLECTED_DATA=""

          # Recon findings
          for f in /tmp/recon/*.txt /tmp/recon/*.nmap /tmp/recon/*.xml; do
            [ -f "$f" ] && COLLECTED_DATA+="$(cat $f 2>/dev/null | head -2000)\n"
          done

          # Exploit findings
          for f in /tmp/exploit_output/*.txt /tmp/exploit_output/msf_output.txt; do
            [ -f "$f" ] && COLLECTED_DATA+="$(cat $f 2>/dev/null | head -2000)\n"
          done

          # AI analysis results
          for f in /tmp/recon/ai_analysis.txt /tmp/recon/ai_osint_analysis.txt /tmp/exploit_output/ai_privesc_commands.sh; do
            [ -f "$f" ] && COLLECTED_DATA+="$(cat $f 2>/dev/null | head -2000)\n"
          done

          # Web Forge results
          for f in /tmp/web_forge_output/*.txt; do
            [ -f "$f" ] && COLLECTED_DATA+="$(cat $f 2>/dev/null | head -1000)\n"
          done

          exec > /opt/zygor/reports/final/EXECUTIVE_SUMMARY.md

          cat << 'HEADER'
          # ══════════════════════════════════════════════════════════════════
          # ZYGOR v4.0 – AUTONOMOUS PENETRATION TEST EXECUTIVE SUMMARY
          # ══════════════════════════════════════════════════════════════════

          HEADER

          echo "**Generated:** $(date -u)"
          echo "**Target:** ${TARGET}"
          echo "**AI Model:** ${AI_MODEL}"
          echo "**Phase Executed:** ${PHASE}"
          echo "**Exfiltration Mode:** ${ENABLE_EXFIL}"
          echo "**Run ID:** ${GITHUB_RUN_ID}"
          echo ""
          echo "---"
          echo ""

          # AI generates comprehensive report
          PROMPT="Generate a comprehensive penetration testing executive summary report based on the following assessment data. Include:

          1. EXECUTIVE SUMMARY (2-3 paragraphs for C-level management)
          2. RISK RATINGS TABLE (Vulnerability | Severity | CVSS | Status)
          3. DETAILED FINDINGS (Technical description, proof of exploitation, affected systems)
          4. CRITICAL FINDINGS (Immediate action required)
          5. REMEDIATION ROADMAP (Priority | Finding | Fix | Effort)
          6. COMPLIANCE MAPPING (PCI DSS, HIPAA, GDPR, ISO 27001)
          7. APPENDIX (Methodology, tools used, scan parameters)

          Assessment data:\n${COLLECTED_DATA:0:30000}"

          ai_complete 16384 <<< "$PROMPT" 2>/dev/null || echo "AI engine unavailable for report generation."

          echo ""
          echo "---"
          echo "*This report was automatically generated by ZYGOR v4.0 AI Engine.*"
          echo "*Review all findings before taking action.*"

          echo "::endgroup::"

      - name: '📧 Email Report via SendGrid (if configured)'
        shell: bash
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          if [ -n "$REPORT_EMAIL" ] && [ -n "$SENDGRID_API_KEY" ]; then
            echo "::group::Email Report Delivery"

            REPORT_CONTENT=$(cat /opt/zygor/reports/final/EXECUTIVE_SUMMARY.md 2>/dev/null | head -c 15000)

            python3 -c "
            import json, urllib.request
            report = '''$REPORT_CONTENT'''
            email = '$REPORT_EMAIL'
            api_key = '$SENDGRID_API_KEY'

            payload = json.dumps({
                'personalizations': [{'to': [{'email': email}]}],
                'from': {'email': 'zygor@pentest.local', 'name': 'ZYGOR v4.0 AI'},
                'subject': 'ZYGOR v4.0 - Penetration Test Executive Report',
                'content': [{'type': 'text/plain', 'value': report}]
            }).encode()

            req = urllib.request.Request(
                'https://api.sendgrid.com/v3/mail/send',
                data=payload,
                headers={
                    'Authorization': f'Bearer {api_key}',
                    'Content-Type': 'application/json'
                },
                method='POST'
            )
            try:
                with urllib.request.urlopen(req, timeout=30) as resp:
                    print(f'Email sent: {resp.status}')
            except Exception as e:
                print(f'Email failed: {e}')
            "

            echo "::endgroup::"
          fi

      - name: '🔔 Send Completion Notification'
        shell: bash
        run: |
          echo "::group::Completion Notifications"

          COMPLETION_MSG="✅ *ZYGOR v4.0 Operation Complete*\n🎯 Target: \`${TARGET}\`\n⚡ Phase: \`${PHASE}\`\n📊 Report: EXECUTIVE_SUMMARY.md\n🆔 Run: \`${GITHUB_RUN_ID}\`"

          # Discord
          if [ -n "$DISCORD_WEBHOOK" ]; then
            python3 /opt/zygor/bin/notify.py discord "$COMPLETION_MSG" "$DISCORD_WEBHOOK" 2>/dev/null || true
          fi

          # Slack
          if [ -n "$SLACK_WEBHOOK" ]; then
            python3 /opt/zygor/bin/notify.py slack "$COMPLETION_MSG" "$SLACK_WEBHOOK" 2>/dev/null || true
          fi

          echo "Notifications sent"
          echo "::endgroup::"

      - name: '📤 Upload Final Report'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZYGOR-Final-Report-${{ github.run_id }}
          path: |
            /opt/zygor/reports/final/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 13: 🧹 CLEANUP – Destroy ephemeral resources, notify completion
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  cleanup:
    name: '🧹 Cleanup & Resource Deallocation'
    needs: [executive_report]
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 60
    if: always()
    steps:
      - name: '🧹 Destroy Ephemeral Cloud Resources'
        shell: bash
        run: |
          echo "::group::Cleanup"
          echo "🧹 ZYGOR v4.0 cleanup phase initiated"

          # Check if we spawned VMs and need to destroy them
          if [ -f /opt/zygor/reports/cloud_vm/vm_result.json ]; then
            PROVIDER=$(jq -r '.provider // "none"' /opt/zygor/reports/cloud_vm/vm_result.json 2>/dev/null)
            INSTANCE_ID=$(jq -r '.instance_id // ""' /opt/zygor/reports/cloud_vm/vm_result.json 2>/dev/null)
            NAME=$(jq -r '.name // ""' /opt/zygor/reports/cloud_vm/vm_result.json 2>/dev/null)

            if [ "$PROVIDER" != "none" ] && [ -n "$INSTANCE_ID" ]; then
              echo "Destroying $PROVIDER instance: $INSTANCE_ID"
              python3 /opt/zygor/bin/spawn_vm.py $PROVIDER destroy $INSTANCE_ID 2>/dev/null || true
              echo "✅ Cloud resources destroyed"
            fi
          fi

          echo "🧹 Cleanup complete"
          echo "::endgroup::"

      - name: '📊 Print Final Summary'
        shell: bash
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  ⚡ ZYGOR v4.0 OPERATION COMPLETE ⚡"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  Target:         ${TARGET}"
          echo "  Phase:          ${PHASE}"
          echo "  AI Model:       ${AI_MODEL}"
          echo "  Exfil Mode:     ${ENABLE_EXFIL}"
          echo "  Run Duration:   ${MAX_HOURS}h"
          echo "  Run ID:         ${GITHUB_RUN_ID}"
          echo ""
          echo "  ✅ Bootstrap complete"
          echo "  ✅ Reconnaissance phase complete"
          echo "  ✅ Exploitation phase complete"
          echo "  ✅ Web Forge phase complete"
          echo "  ✅ ChatOps monitor active"
          echo "  ✅ Dashboard generated"
          echo "  ✅ Backup complete"
          echo "  ✅ Executive report generated"
          echo ""
          echo "  📁 All artifacts saved as workflow run artifacts"
          echo "  📊 Final report: EXECUTIVE_SUMMARY.md"
          echo "  🌐 Dashboard deployed to GitHub Pages (gh-pages branch)"
          echo "  🔄 Next run scheduled in ~6 hours via cron + self-trigger"
          echo ""
          echo "═══════════════════════════════════════════════════════════════"

          # Write summary to file
          {
            echo "ZYGOR v4.0 Operation Summary"
            echo "=============================="
            echo "Target: ${TARGET}"
            echo "Phase: ${PHASE}"
            echo "AI Model: ${AI_MODEL}"
            echo "Exfil: ${ENABLE_EXFIL}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Completed: $(date -u)"
          } > /opt/zygor/reports/final/OPERATION_SUMMARY.txt

      - name: '📤 Upload Operation Summary'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZYGOR-Operation-Summary-${{ github.run_id }}
