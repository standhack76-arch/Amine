          #!/usr/bin/env python3
          """
          ZYGOR Dynamic DNS Tracker
          Keeps track of LHOST changes and updates DNS records for consistent callbacks.
          Supports: DuckDNS, No-IP, Cloudflare API
          """
          import subprocess, sys, json, os, urllib.request, socket

          def get_public_ip() -> str:
              try:
                  with urllib.request.urlopen("https://api.ipify.org?format=json", timeout=10) as resp:
                      return json.loads(resp.read())["ip"]
              except:
                  try:
                      return socket.gethostbyname(socket.gethostname())
                  except:
                      return "0.0.0.0"

          def update_duckdns(domain: str, token: str, ip: str = None) -> bool:
              if not ip:
                  ip = get_public_ip()
              url = f"https://www.duckdns.org/update?domains={domain}&token={token}&ip={ip}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      result = resp.read().decode()
                      return result == "OK"
              except:
                  return False

          def update_noip(hostname: str, username: str, password: str, ip: str = None) -> bool:
              if not ip:
                  ip = get_public_ip()
              import base64
              auth = base64.b64encode(f"{username}:{password}".encode()).decode()
              url = f"https://dynupdate.no-ip.com/nic/update?hostname={hostname}&myip={ip}"
              req = urllib.request.Request(url)
              req.add_header("Authorization", f"Basic {auth}")
              req.add_header("User-Agent", "ZYGOR/4.0")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return "good" in resp.read().decode() or "nochg" in resp.read().decode()
              except:
                  return False

          if __name__ == '__main__':
              provider = sys.argv[1] if len(sys.argv) > 1 else "duckdns"
              domain = sys.argv[2] if len(sys.argv) > 2 else "zygor"
              token = sys.argv[3] if len(sys.argv) > 3 else os.environ.get("DUCKDNS_TOKEN", "")
              ip = get_public_ip()
              print(f"[+] Current public IP: {ip}")
              if provider == "duckdns":
                  success = update_duckdns(domain, token, ip)
              elif provider == "noip":
                  success = update_noip(domain, token, ip)
              else:
                  print(f"Unknown provider: {provider}")
                  sys.exit(1)
              print(f"{'✓' if success else '✗'} DNS update {'succeeded' if success else 'failed'}")
          DDNSEOF
          chmod +x /opt/zygor/bin/dynamic_dns.py
          echo "✓ Dynamic DNS tracker built"

