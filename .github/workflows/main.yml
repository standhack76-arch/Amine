          cat > README.generated.md <<'PYFILE'
          # Telegram Ollama Mega One-File Workflow
          
          This repository can run a temporary Telegram AI assistant using GitHub Actions and Ollama with no paid API.
          
          ## Truth
          - It is not truly unlimited or 24/7.
          - GitHub-hosted jobs are temporary and normally limited to 6 hours.
          - Small Ollama models work best on free runners.
          - Telegram chat works only while the workflow is running.
          
          ## Setup
          1. Create a Telegram bot with BotFather.
          2. Send any message to your bot.
          3. Get your chat id from Telegram getUpdates.
          4. Add repository secrets:
             - TELEGRAM_BOT_TOKEN
             - TELEGRAM_CHAT_ID
          5. Put this file at `.github/workflows/telegram-ollama-mega-session.yml`.
          6. Enable Actions and run the workflow manually.
          
          ## Commands
          /help, /status, /files, /read, /project, /idea, /reel, /thumbnail, /hashtags, /analyze, /fix, /write, /append, /zip, /clear, /stop.
          
          ## Safe edits
          Edits are disabled by default. Enable allow_edits in workflow inputs. The workflow blocks secrets, .git, node_modules, binary files, env files, and path traversal.
          PYFILE

          cat > requirements.txt <<'PYFILE'
          requests==2.31.0
          httpx==0.25.2
          psutil==5.9.6
          rich==13.7.0
          PYFILE

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Telegram setup
        shell: bash
        run: |
          python scripts/verify_setup.py

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version || true

      - name: Start Ollama and pull model
        shell: bash
        run: |
          set -euo pipefail
          ollama serve > logs/ollama.log 2>&1 &
          echo $! > logs/ollama.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama pull "${OLLAMA_MODEL}"
          ollama list

      - name: Run Telegram AI session
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bot_controller.py

      - name: Commit changes if enabled
        if: ${{ always() && inputs.commit_changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs memory logs README.generated.md || true
          if ! git diff --cached --quiet; then
            git commit -m "AI assistant session outputs"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Upload memory outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-ollama-session-${{ github.run_number }}
          path: |
            memory/
            outputs/
            logs/
            README.generated.md
          retention-days: 14
