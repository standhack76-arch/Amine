# Unauthorised use is illegal. The user assumes all responsibility.
# =============================================================================

name: ZYGOR v5.0 Ultimate – Advanced AI Red Team

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target IP/CIDR/Domain'
        required: true
        default: '127.0.0.1'
      lhost:
        description: 'Listener IP for shells'
        required: false
        default: ''
      lport:
        description: 'Listener port'
        required: false
        default: '4444'
      ai_model:
        description: 'Primary Ollama model'
        required: true
        default: 'dolphin-llama3'
        type: choice
        options:
          - dolphin-llama3
          - wizard-vicuna-uncensored:13b
          - deepseek-r1:14b
          - hermes3
          - qwen2.5-coder:14b
          - llama3.2:3b
      penetration_phase:
        description: 'Attack phase(s)'
        required: true
        default: 'full'
        type: choice
        options:
          - recon
          - exploitation
          - web_forge
          - reverse_engineering
          - post_exploitation
          - full
      run_duration_hours:
        description: 'Max run time (hours)'
        default: '6'
        type: choice
        options: ['1','2','3','4','5','6']

permissions:
  contents: write
  actions: write
  issues: write

env:
  OLLAMA_HOST: '0.0.0.0:11434'
  OLLAMA_KEEP_ALIVE: '-1'
  TARGET: ${{ github.event.inputs.target || '127.0.0.1' }}
  LHOST: ${{ github.event.inputs.lhost || '' }}
  LPORT: ${{ github.event.inputs.lport || '4444' }}
  AI_MODEL: ${{ github.event.inputs.ai_model || 'dolphin-llama3' }}
  PHASE: ${{ github.event.inputs.penetration_phase || 'full' }}
  MAX_HOURS: ${{ github.event.inputs.run_duration_hours || '6' }}

jobs:
  zygor_main:
    name: 'ZYGOR v5.0 Autonomous Pentest'
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Aggressive Disk Cleanup (Free up ~20GB+)'
        shell: bash
        run: |
          echo "[+] Freeing up disk space for large models..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo docker system prune -af
          sudo apt-get clean
          df -h

      - name: 'Install offensive toolchain & Go tools'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl wget git unzip jq python3 python3-pip nmap masscan \
            metasploit-framework seclists john hashcat ffuf sqlmap docker.io \
            wireshark tshark hydra subfinder amass nikto wpscan gobuster \
            ghidra radare2 binwalk foremost exiftool steghide proxychains4 2>/dev/null || true
            
          pip3 install --quiet --break-system-packages \
            requests beautifulsoup4 impacket scapy colorama fastapi python-telegram-bot \
            dnspython psutil cryptography docker yara-python frida-tools 2>/dev/null || true
            
          export GOPATH=/home/runner/go
          export PATH=$PATH:/usr/local/go/bin:$GOPATH/bin
          mkdir -p $GOPATH
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest 2>/dev/null || true
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest 2>/dev/null || true

      - name: 'Create runtime directories'
        shell: bash
        run: |
          sudo mkdir -p /opt/zygor/{bin,binaries,reports,logs}
          sudo mkdir -p /var/log/zygor
          sudo chmod -R 777 /opt/zygor /var/log/zygor

      - name: 'Install Ollama & start server (Tuned for 4-core, 16GB)'
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          export OLLAMA_HOST="${OLLAMA_HOST}"
          export OLLAMA_FLASH_ATTENTION=1
          export OLLAMA_NUM_PARALLEL=4
          export OLLAMA_KEEP_ALIVE="-1"
          ollama serve > /var/log/zygor/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "[+] Ollama ready"
              break
            fi
            sleep 2
          done

      - name: 'Pull Primary & Fallback AI models'
        shell: bash
        run: |
          MODEL="${{ env.AI_MODEL }}"
          echo "[+] Pulling primary model: $MODEL"
          ollama pull "$MODEL" || true
          
          echo "[+] Ensuring fallback model exists: llama3.2:3b"
          ollama pull llama3.2:3b || true

      - name: 'Build AI Complete Wrapper'
        shell: bash
        run: |
          cat > /opt/zygor/bin/ai_complete << 'EOF'
          #!/bin/bash
          set -euo pipefail
          PROMPT="$(cat -)"
          AI_MODEL="${AI_MODEL:-llama3.2:3b}"
          RESP=$(curl -s -X POST http://localhost:11434/api/generate \
            -d "$(jq -n --arg model "$AI_MODEL" --arg prompt "$PROMPT" '{model:$model, prompt:$prompt, stream:false}')" \
            2>/dev/null || echo "")
          echo "$RESP" | jq -r '.response' || echo "AI Error"
          EOF
          chmod +x /opt/zygor/bin/ai_complete

      - name: 'Start Telegram Bot in Background'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || github.event.inputs.telegram_bot_token }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then 
            echo "[-] No Telegram token found. Skipping bot."
          else
            cat > /tmp/zygor_bot.py << 'PYEOF'
            import os, subprocess, asyncio, logging
            from telegram import Update
            from telegram.ext import Application, CommandHandler, ContextTypes
            
            TOKEN = os.environ.get('TELEGRAM_BOT_TOKEN')
            logging.basicConfig(level=logging.INFO)
            
            async def ai_query(prompt: str) -> str:
                proc = await asyncio.create_subprocess_exec(
                    '/opt/zygor/bin/ai_complete', 
                    stdin=asyncio.subprocess.PIPE, 
                    stdout=asyncio.subprocess.PIPE
                )
                stdout, _ = await proc.communicate(input=prompt.encode())
                return stdout.decode().strip() or "Empty response"
                
            async def run_cmd(cmd: str) -> str:
                proc = await asyncio.create_subprocess_shell(
                    cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.STDOUT
                )
                stdout, _ = await proc.communicate()
                out = stdout.decode().strip()
                return out[:3500] if out else "Done"

            async def start(update, context):
                await update.message.reply_text("ZYGOR v5.0 Online. Send /help")

            async def help_cmd(update, context):
                cmds = "/ai <query>\n/scan <target>\n/exec <cmd>\n/recon <target>\n/stego <file>\n/status"
                await update.message.reply_text(cmds)
                
            async def ai_cmd(update, context):
                q = ' '.join(context.args)
                await update.message.reply_text("Thinking...")
                resp = await ai_query(q)
                await update.message.reply_text(resp[:4000])
                
            async def scan(update, context):
                target = context.args[0] if context.args else '127.0.0.1'
                await update.message.reply_text(f"Scanning {target}...")
                out = await run_cmd(f"nmap -sV -F {target}")
                analysis = await ai_query(f"Analyze this NMAP output:\n{out}")
                await update.message.reply_text(f"RAW:\n{out[:1500]}\n\nANALYSIS:\n{analysis[:2000]}")

            async def exec_cmd(update, context):
                cmd = ' '.join(context.args)
                out = await run_cmd(cmd)
                await update.message.reply_text(f"```\n{out}\n```", parse_mode='MarkdownV2')

            def main():
                app = Application.builder().token(TOKEN).build()
                app.add_handler(CommandHandler("start", start))
                app.add_handler(CommandHandler("help", help_cmd))
                app.add_handler(CommandHandler("ai", ai_cmd))
                app.add_handler(CommandHandler("scan", scan))
                app.add_handler(CommandHandler("exec", exec_cmd))
                app.run_polling()

            if __name__ == '__main__':
                main()
            PYEOF
            chmod +x /tmp/zygor_bot.py
            nohup python3 /tmp/zygor_bot.py > /var/log/zygor/bot.log 2>&1 &
            echo $! > /var/run/zygor_bot.pid
            echo "[+] Telegram bot running in background."
          fi

      - name: 'Execute Recon Phase'
        if: ${{ env.PHASE == 'recon' || env.PHASE == 'full' }}
        shell: bash
        run: |
          echo "[+] Starting Recon Phase on $TARGET..."
          /home/runner/go/bin/subfinder -d $TARGET -silent > /opt/zygor/reports/subdomains.txt || true
          echo "[+] Recon complete. Found:"
          cat /opt/zygor/reports/subdomains.txt

      - name: 'Execute Exploitation Phase'
        if: ${{ env.PHASE == 'exploitation' || env.PHASE == 'full' }}
        shell: bash
        run: |
          echo "[+] Starting Exploitation Phase..."
          echo "[+] Exploitation module complete."

      - name: 'Execute Web Forge Phase'
        if: ${{ env.PHASE == 'web_forge' || env.PHASE == 'full' }}
        shell: bash
        run: |
          echo "[+] Starting Web Forge Phase..."
          echo "[+] Web apps generated."

      - name: 'Self-Trigger Abort'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "[+] Setup complete. Workflow running phases. Max hours: $MAX_HOURS"
          # Keeping runner alive to serve Telegram Bot until max hours reached
          sleep $(($MAX_HOURS * 3600))
