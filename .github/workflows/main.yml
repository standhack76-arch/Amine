# ===================================================================================================
# WORKFLOW NAME & TRIGGERS
# ===================================================================================================
# The workflow name shown in the GitHub Actions UI. Keep it descriptive.
name: ZYGOR v4.0 – The Unchained Autonomous AI Pentest & Web Forge Framework

# ===================================================================================================
# EVENT TRIGGERS
# ===================================================================================================
# ┌─────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ SCHEDULED TRIGGER: Runs every 6 hours via cron for 24/7 operation.                              │
# │ The self-re-trigger mechanism (in the bootstrap job) dispatches a new run ~30 min before the     │
# │ 6-hour timeout, ensuring continuous coverage.                                                    │
# └─────────────────────────────────────────────────────────────────────────────────────────────────┘
# ┌─────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ MANUAL TRIGGER (workflow_dispatch): Full interactive control panel. All inputs are defined here  │
# │ with sensible defaults. The `inputs` context is used throughout for phase control.               │
# │ IMPORTANT: For `if` conditionals in jobs, we use `inputs.penetration_phase` directly (the        │
# │ `inputs` context is always available when triggered via workflow_dispatch). For the `schedule`   │
# │ event, the `inputs` context is empty, so we use `github.event_name == 'schedule'` as a fallback. │
# │ This avoids the fatal `${{ env.PHASE }}` parsing error in `if` conditionals.                     │
# └─────────────────────────────────────────────────────────────────────────────────────────────────┘

on:
  # ── Cron schedule: Every 6 hours on the hour ─────────────────────────────────────────────────────
  schedule:
    - cron: '0 */6 * * *'

  # ── Manual dispatch: Rich input configuration ────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      # ▸ Primary target specification
      target:
        description: '🎯 Target IP range, subnet, domain, or single host (e.g., 10.0.0.0/24, example.com)'
        required: true
        default: '127.0.0.1'

      # ▸ Listener IP for reverse shells
      lhost:
        description: '🎭 Your listener IP (LHOST) for reverse shells and callbacks'
        required: false
        default: ''

      # ▸ Listener port for reverse shells
      lport:
        description: '🎭 Listener port (LPORT) for reverse shells and callbacks'
        required: false
        default: '4444'

      # ▸ AI model selection – uncensored models recommended for unrestricted operation
      ai_model:
        description: '🧠 Ollama uncensored model (will be auto-pulled if not cached)'
        required: true
        default: 'dolphin-mixtral'
        type: choice
        options:
          - dolphin-mixtral
          - wizard-vicuna-uncensored
          - hermes-3-llama-3.2-uncensored
          - llama3.1:8b-uncensored
          - mistral
          - mixtral
          - nous-hermes-2-mixtral-8x7b-dpo
          - codellama
          - deepseek-coder-v2
          - yi-coder

      # ▸ Penetration testing phase selector
      penetration_phase:
        description: '⚡ Attack phase(s) to execute'
        required: true
        default: 'full'
        type: choice
        options:
          - recon
          - exploitation
          - web_forge
          - full

      # ▸ Exfiltration safety gate – must be explicitly set to "true" for destructive actions
      enable_exfiltration:
        description: '⚠️ Enable exfiltration/persistence simulation (requires explicit approval)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

      # ▸ Maximum runtime duration in hours
      run_duration_hours:
        description: '⏳ Max run time (hours) – self-hosted runners support full 6h'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

      # ▸ GitHub token/PAT for the /abort command via API
      github_token_for_abort:
        description: '🔑 (Optional) PAT or GitHub token to override default for /abort via API'
        required: false
        default: ''

      # ▸ Enable interactive ChatOps via GitHub Issues
      enable_chat_ops:
        description: '🤖 Enable interactive AI chat via GitHub Issues comments'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      # ▸ Issue number used for ChatOps
      chat_issue_number:
        description: '📌 GitHub Issue number to use for chat commands and AI responses'
        required: false
        default: '1'

      # ▸ Cloud backup provider for artifact persistence
      backup_provider:
        description: '💾 Cloud backup provider for artifacts (requires configured CLI secrets)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - s3
          - gcs
          - azure

      # ▸ Telegram bot integration toggle
      telegram_enable:
        description: '📱 Enable Telegram bot control interface'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

      # ▸ Telegram chat ID for bot communication
      telegram_chat_id:
        description: '🆔 Telegram chat ID for bot to listen/send messages'
        required: false
        default: ''

      # ▸ Enable social engineering simulation module
      enable_social_engineering:
        description: '👤 Enable AI-driven social engineering simulation (phishing templates, pretexts)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

      # ▸ Enable CTF solver mode
      ctf_mode:
        description: '🏁 Enable CTF solver mode – auto-identify challenge types and generate solutions'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

      # ▸ Cloud VM provider for ephemeral testing environments
      cloud_vm_provider:
        description: '☁️ Cloud provider for spawning ephemeral VMs (requires CLI secrets)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - aws
          - gcp
          - azure

      # ▸ Email report delivery
      report_email:
        description: '📧 Email to send final executive report (requires SENDGRID_API_KEY secret)'
        required: false
        default: ''

      # ▸ Discord webhook URL for notifications
      discord_webhook:
        description: '🔔 Discord webhook URL for real-time notifications'
        required: false
        default: ''

      # ▸ Slack webhook URL for notifications
      slack_webhook:
        description: '🔔 Slack webhook URL for real-time notifications'
        required: false
        default: ''

# ===================================================================================================
# PERMISSIONS
# ===================================================================================================
# Grant the GITHUB_TOKEN broad scope. This is needed for artifact uploads, API calls,
# creating commits/PRs for the web forge module, and cancelling runs via the abort mechanism.

permissions:
  contents: write        # Push commits, manage releases
  actions: write         # Cancel/manage workflow runs
  issues: write          # Post comments for ChatOps
  pull-requests: write   # Open PRs for web forge
  security-events: write # Upload SARIF results
  deployments: write     # Manage deployments
  packages: write        # Publish packages
  statuses: write        # Update commit statuses

# ===================================================================================================
# GLOBAL ENVIRONMENT VARIABLES
# ===================================================================================================
# FIX: We use `github.event.inputs.<name>` with proper fallbacks. When the workflow is triggered by
# `schedule`, there are no inputs, so defaults kick in. When triggered by `workflow_dispatch`, the
# inputs context is populated.
#
# CRITICAL: For the `GITHUB_TOKEN_ABORT` variable, we use:
#   ${{ github.event.inputs.github_token_for_abort || secrets.GITHUB_TOKEN }}
# This means: if the user provided an explicit token via the input field, use that; otherwise fall
# back to the automatic `secrets.GITHUB_TOKEN`. This avoids using `secrets.GITHUB_TOKEN` directly
# in `if` conditionals (which would cause an "unrecognized named-value" error).
#
# For the TELEGRAM_BOT_TOKEN, we use `secrets.TELEGRAM_BOT_TOKEN` at the env level. Note that
# secrets in the top-level `env` block may not resolve correctly in all contexts; we re-map
# critical secrets at the step level where needed.

env:
  # ── Ollama configuration ────────────────────────────────────────────────────────────────────────
  OLLAMA_HOST: '0.0.0.0:11434'
  OLLAMA_READ_TIMEOUT: '3600'
  OLLAMA_KEEP_ALIVE: '24h'
  OLLAMA_MODEL_CACHE: '/home/runner/.ollama/models'

  # ── Target and listener configuration (from inputs, with defaults) ──────────────────────────────
  TARGET: ${{ github.event.inputs.target || '127.0.0.1' }}
  LHOST: ${{ github.event.inputs.lhost || '' }}
  LPORT: ${{ github.event.inputs.lport || '4444' }}

  # ── AI model selection ─────────────────────────────────────────────────────────────────────────
  AI_MODEL: ${{ github.event.inputs.ai_model || 'dolphin-mixtral' }}

  # ── Phase control – used within job-level steps (but NOT in `if:` conditionals at job level) ────
  # FIX: At the `jobs.<job_id>.if` level, we use `inputs.penetration_phase` or
  # `github.event_name == 'schedule'` directly in the expression. The env-based phase var is used
  # only inside step-level shell scripts where it's safe.
  PHASE: ${{ github.event.inputs.penetration_phase || 'full' }}

  # ── Safety gates ────────────────────────────────────────────────────────────────────────────────
  ENABLE_EXFIL: ${{ github.event.inputs.enable_exfiltration || 'false' }}

  # ── Runtime limits ──────────────────────────────────────────────────────────────────────────────
  MAX_HOURS: ${{ github.event.inputs.run_duration_hours || '6' }}

  # ── GitHub API token (used for abort, dispatch, ChatOps) ────────────────────────────────────────
  # FIX: This uses the input if provided, otherwise falls back to secrets.GITHUB_TOKEN.
  # This avoids the `secrets.GITHUB_TOKEN in ${{ }}` error condition.
  GITHUB_TOKEN_ABORT: ${{ github.event.inputs.github_token_for_abort || secrets.GITHUB_TOKEN }}

  # ── ChatOps configuration ───────────────────────────────────────────────────────────────────────
  CHAT_OPS: ${{ github.event.inputs.enable_chat_ops || 'false' }}
  CHAT_ISSUE: ${{ github.event.inputs.chat_issue_number || '1' }}

  # ── Backup provider ─────────────────────────────────────────────────────────────────────────────
  BACKUP_PROVIDER: ${{ github.event.inputs.backup_provider || 'none' }}

  # ── Telegram configuration (token separately mapped at step level for security) ─────────────────
  TELEGRAM_ENABLE: ${{ github.event.inputs.telegram_enable || 'false' }}
  TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || '' }}

  # ── Social engineering ──────────────────────────────────────────────────────────────────────────
  SOCIAL_ENG: ${{ github.event.inputs.enable_social_engineering || 'false' }}

  # ── CTF mode ────────────────────────────────────────────────────────────────────────────────────
  CTF_MODE: ${{ github.event.inputs.ctf_mode || 'false' }}

  # ── Cloud VM provider ───────────────────────────────────────────────────────────────────────────
  CLOUD_VM: ${{ github.event.inputs.cloud_vm_provider || 'none' }}

  # ── Email report ────────────────────────────────────────────────────────────────────────────────
  REPORT_EMAIL: ${{ github.event.inputs.report_email || '' }}

  # ── Webhook URLs ────────────────────────────────────────────────────────────────────────────────
  DISCORD_WEBHOOK: ${{ github.event.inputs.discord_webhook || '' }}
  SLACK_WEBHOOK: ${{ github.event.inputs.slack_webhook || '' }}

  # ── GitHub context ──────────────────────────────────────────────────────────────────────────────
  GITHUB_REPO: ${{ github.repository }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}
  GITHUB_ACTOR: ${{ github.actor }}

# ===================================================================================================
#  _    _      _
# | |  | |    | |
# | |__| | ___| |_ __   ___ _ __ ___
# |  __  |/ _ \ | '_ \ / _ \ '__/ __|
# | |  | |  __/ | |_) |  __/ |  \__ \
# |_|  |_|\___|_| .__/ \___|_|  |___/
#                | |
#                |_|
#
# JOBS DEFINITION
# ===================================================================================================
# The workflow is organized into the following phases:
#
#   1. BOOTSTRAP     – Install tools, start Ollama, AI engine, Telegram bot, infinite re-trigger
#   2. ABORT_WATCH   – Background listener for /abort commands via GitHub Issues and Telegram
#   3. RECON         – Network scanning, web discovery, AD/LDAP, wireless, OSINT (parallel matrix)
#   4. EXPLOITATION  – AI exploit gen, Metasploit, SQLi/XSS, password cracking, container breakout,
#                     privesc, lateral movement, backdoor creation (parallel matrix)
#   5. WEB_FORGE     – AI full-stack app generation with deployment
#   6. SOCIAL_ENG    – AI-driven social engineering simulations
#   7. CTF_SOLVER    – Automated CTF challenge identification and solving
#   8. CLOUD_VM      – Ephemeral cloud VM spawning for isolated testing
#   9. CHAT_OPS      – GitHub Issues and Telegram interactive AI chat
#  10. DASHBOARD     – Live static HTML dashboard generation for GitHub Pages
#  11. BACKUP        – Cloud artifact backup (S3/GCS/Azure)
#  12. REPORT        – AI-generated executive summary and final report
#
# ===================================================================================================

jobs:

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # JOB 1: ∞ BOOTSTRAP – Foundation for Everything
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # This job:
  #   - Installs the full offensive toolchain (apt + pip)
  #   - Caches Ollama models for fast cold starts
  #   - Starts the Ollama server and pulls the selected uncensored model
  #   - Builds the AI completion engine (/opt/zygor/bin/ai_complete) with Ollama→Groq→Gemini fallback
  #   - Launches the continuous Telegram bot listener (if enabled)
  #   - Spawns the infinite self-re-trigger mechanism (dispatches a new run 30 min before timeout)
  #   - Sets up the payload obfuscation module
  #   - Initializes the CVE database sync
  # ═════════════════════════════════════════════════════════════════════════════════════════════════

  bootstrap:
    name: '⚡ ZYGOR Infinite Bootstrap & AI Engine'
    runs-on: ${{ secrets.RUNNER_LABELS || 'ubuntu-latest' }}
    timeout-minutes: 360  # 6 hour max per GitHub Actions hosted runners
    outputs:
      ai_ready: ${{ steps.ai_status.outputs.ok }}
      model_pulled: ${{ steps.pull_model.outputs.pulled }}

    steps:
      # ── Step 1.1: Checkout repository ──────────────────────────────────────────────────────────
      - name: '📦 Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ── Step 1.2: Restore Ollama model cache ───────────────────────────────────────────────────
      # Cache key includes the model name so different models don't conflict.
      # The cache path is the default Ollama models directory.
      - name: '🧠 Restore Ollama model cache'
        id: cache_ollama
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODEL_CACHE }}
          key: ollama-${{ env.AI_MODEL }}-v4
          restore-keys: |
            ollama-${{ env.AI_MODEL }}-
            ollama-

      # ── Step 1.3: Install OS-level offensive toolchain ─────────────────────────────────────────
      # Installs everything needed for pentesting from Ubuntu/Debian native repos.
      # This avoids requiring Kali-specific tools. Everything is available on ubuntu-latest.
      - name: '📦 Install offensive toolchain (apt)'
        shell: bash
        run: |
          echo "::group::Updating package lists"
          sudo apt-get update -qq
          echo "::endgroup::"

          echo "::group::Installing core tools"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl wget git unzip zip \
            jq yq \
            python3 python3-pip python3-dev python3-venv \
            build-essential gcc g++ gdb clang cmake make autoconf automake libtool \
            pkg-config \
            nmap masscan arp-scan netcat-openbsd netcat-traditional \
            metasploit-framework \
            nuclei \
            seclists \
            john hashcat hashid hash-identifier \
            ffuf \
            sqlmap \
            ldap-utils \
            docker.io podman \
            aircrack-ng reaver bully pixiewps \
            perl ruby-full ruby-dev \
            golang rustc cargo \
            mingw-w64 nasm \
            libpcap-dev libssl-dev libffi-dev libsqlite3-dev \
            patchelf binutils \
            mitm6 responder \
            impacket-scripts \
            dnsutils net-tools iproute2 \
            tcpdump traceroute whois \
            wireshark tshark \
            hydra medusa \
            wafw00f \
            subfinder \
            amass \
            nikto \
            wpscan \
            dirb gobuster \
            whatweb \
            exploitdb \
            powershell \
            2>/dev/null || true
          echo "::endgroup::"

          echo "::group::Verifying critical tools"
          for tool in nmap massan curl python3 git jq; do
            which "$tool" >/dev/null 2>&1 && echo "✓ $tool found" || echo "✗ $tool MISSING"
          done
          echo "::endgroup::"

      # ── Step 1.4: Install Python packages ──────────────────────────────────────────────────────
      - name: '📦 Install Python pentest packages'
        shell: bash
        run: |
          pip3 install --quiet --break-system-packages --upgrade \
            pip setuptools wheel 2>/dev/null || true

          pip3 install --quiet --break-system-packages \
            pwntools \
            impacket \
            requests \
            beautifulsoup4 \
            lxml \
            shodan \
            censys \
            python-nmap \
            bloodhound-ce \
            python-ldap \
            pyOpenSSL \
            paramiko \
            aiohttp \
            aiofiles \
            asyncio \
            scapy \
            colorama \
            tqdm \
            rich \
            psutil \
            pycryptodome \
            rsa \
            pycryptodomex \
            cffi \
            cryptography \
            dnspython \
            flask \
            fastapi \
            uvicorn \
            jinja2 \
            markdown \
            httpx \
            httplib2 \
            urllib3 \
            websockets \
            docker \
            kubernetes \
            boto3 \
            azure-storage-blob \
            google-cloud-storage \
            sendgrid \
            python-telegram-bot \
            python-dotenv \
            2>/dev/null || true

          echo "✓ Python packages installed"

      # ── Step 1.5: Install Go tools (subfinder, nuclei templates, etc.) ─────────────────────────
      - name: '🐹 Install Go-based pentest tools'
        shell: bash
        run: |
          export GOPATH=/home/runner/go
          export PATH=$PATH:/usr/local/go/bin:$GOPATH/bin
          mkdir -p $GOPATH

          # Install or update subfinder
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest 2>/dev/null || true
          # Install httpx
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest 2>/dev/null || true
          # Install notify
          go install -v github.com/projectdiscovery/notify/cmd/notify@latest 2>/dev/null || true
          # Install uncover (Shodan/Censys)
          go install -v github.com/projectdiscovery/uncover/cmd/uncover@latest 2>/dev/null || true
          # Install katana
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest 2>/dev/null || true
          # Install naabu
          go install -v github.com/projectdiscovery/naabu/v2/cmd/naabu@latest 2>/dev/null || true
          # Install dnsx
          go install -v github.com/projectdiscovery/dnsx/cmd/dnsx@latest 2>/dev/null || true
          # Install chaos-client
          go install -v github.com/projectdiscovery/chaos-client/cmd/chaos@latest 2>/dev/null || true
          # Install interactsh
          go install -v github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest 2>/dev/null || true
          # Install mapcidr
          go install -v github.com/projectdiscovery/mapcidr/cmd/mapcidr@latest 2>/dev/null || true

          # Add to global PATH
          echo "$GOPATH/bin" | sudo tee -a /etc/environment || true

      # ── Step 1.6: Create ZYGOR runtime directories ─────────────────────────────────────────────
      - name: '📁 Create ZYGOR runtime directories'
        shell: bash
        run: |
          sudo mkdir -p /opt/zygor/bin
          sudo mkdir -p /opt/zygor/templates
          sudo mkdir -p /opt/zygor/wordlists
          sudo mkdir -p /opt/zygor/payloads
          sudo mkdir -p /opt/zygor/reports
          sudo mkdir -p /opt/zygor/logs
          sudo mkdir -p /opt/zygor/c2
          sudo mkdir -p /var/log/zygor
          sudo chmod -R 777 /opt/zygor
          sudo chmod -R 777 /var/log/zygor

      # ── Step 1.7: Start Ollama server ──────────────────────────────────────────────────────────
      - name: '🚀 Start Ollama server'
        shell: bash
        run: |
          # Remove any stale PID file
          sudo pkill -9 ollama 2>/dev/null || true
          sleep 2

          # Start Ollama in background with extended keep-alive
          export OLLAMA_HOST="${OLLAMA_HOST}"
          export OLLAMA_KEEP_ALIVE="${OLLAMA_KEEP_ALIVE}"
          export OLLAMA_READ_TIMEOUT="${OLLAMA_READ_TIMEOUT}"

          ollama serve > /var/log/zygor/ollama.log 2>&1 &
          OLLAMA_PID=$!
          echo "Ollama PID: $OLLAMA_PID"

          # Wait for Ollama to be ready (up to 80 seconds)
          echo "Waiting for Ollama API to become available..."
          for i in $(seq 1 40); do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "✓ Ollama API ready after ${i}s"
              break
            fi
            echo "  Attempt $i/40..."
            sleep 2
          done

          # Verify it's actually running
          if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
            echo "✓ Ollama is running and accepting requests"
          else
            echo "⚠️ Ollama may not have started correctly. Check logs."
            tail -20 /var/log/zygor/ollama.log
          fi

      # ── Step 1.8: Pull the selected AI model ───────────────────────────────────────────────────
      - name: '🧠 Pull AI model: ${{ env.AI_MODEL }}'
        id: pull_model
        shell: bash
        run: |
          MODEL="${{ env.AI_MODEL }}"
          echo "Pulling model: $MODEL"

          # Check if model is already cached
          CACHED_MODELS=$(curl -s http://localhost:11434/api/tags)
          if echo "$CACHED_MODELS" | jq -e '.models[] | select(.name == "'"$MODEL"'")' >/dev/null 2>&1; then
            echo "✓ Model $MODEL already cached"
            echo "pulled=true" >> $GITHUB_OUTPUT
          else
            echo "Downloading model $MODEL (this may take several minutes)..."
            ollama pull "$MODEL" 2>&1 | tail -5
            echo "pulled=true" >> $GITHUB_OUTPUT
          fi

          # Keep model alive in memory with a background pinger
          (while true; do
            curl -s -X POST http://localhost:11434/api/generate \
              -d "{\"model\": \"$MODEL\", \"prompt\": \"ping\", \"keep_alive\": -1}" \
              --max-time 30 >/dev/null 2>&1
            sleep 300  # ping every 5 minutes
          done) & disown

          echo "✓ Model $MODEL ready and keep-alive engaged"

      # ── Step 1.9: Build the AI completion engine (ai_complete) ──────────────────────────────────
      # This is the core AI wrapper. It:
      #   1. Attempts Ollama (local) with up to 10 retries (self-healing)
      #   2. Falls back to Groq (Mixtral 8x7b) if GROQ_API_KEY is set
      #   3. Falls back to Gemini 1.5 Pro if GEMINI_API_KEY is set
      #   4. Returns an error if no backend is available
      #
      # The wrapper is invoked via stdin pipe: `echo "prompt" | ai_complete [max_tokens]`
      - name: '🧬 Build AI completion engine (ai_complete)'
        id: ai_status
        shell: bash
        run: |
          cat > /opt/zygor/bin/ai_complete << 'AICOMPLETE_EOF'
          #!/bin/bash
          # ═══════════════════════════════════════════════════════════════════════════
          # ZYGOR AI COMPLETION ENGINE
          # Usage: echo "your prompt" | ai_complete [max_tokens]
          # ═══════════════════════════════════════════════════════════════════════════
          set -euo pipefail

          # Read prompt from stdin
          PROMPT="$(cat -)"
          MAX_TOKENS="${1:-2048}"
          AI_MODEL="${AI_MODEL:-dolphin-mixtral}"

          # ── Stage 1: Attempt Ollama (local) with self-healing ──────────────────
          for i in $(seq 1 10); do
            echo "AI: Attempt $i/10 (Ollama)..." >&2
            RESP=$(curl -s -X POST http://localhost:11434/api/generate \
              -d "$(jq -n --arg model "$AI_MODEL" --arg prompt "$PROMPT" \
                '{
                  model: $model,
                  prompt: $prompt,
                  stream: false,
                  keep_alive: -1,
                  options: {
                    num_predict: 2048,
                    temperature: 0.7,
                    repeat_penalty: 1.1,
                    top_k: 40,
                    top_p: 0.9,
                    seed: 42
                  }
                }')" \
              --max-time 900 2>/dev/null || echo "")

            if echo "$RESP" | jq -e '.response' >/dev/null 2>&1; then
              echo "$RESP" | jq -r '.response'
              exit 0
            fi
            sleep 3
          done

          # ── Stage 2: Fallback to Groq API ──────────────────────────────────────
          GROQ_KEY="${GROQ_API_KEY:-}"
          if [ -n "$GROQ_KEY" ]; then
            echo "AI: Falling back to Groq (Mixtral)..." >&2
            RESP=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
              -H "Authorization: Bearer $GROQ_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg prompt "$PROMPT" \
                '{
                  model: "mixtral-8x7b-32768",
                  messages: [{role: "user", content: $prompt}],
                  max_tokens: '$MAX_TOKENS',
                  temperature: 0.7
                }')" \
              --max-time 600 2>/dev/null || echo "")
            RESP_TEXT=$(echo "$RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null)
            if [ -n "$RESP_TEXT" ]; then
              echo "$RESP_TEXT"
              exit 0
            fi
          fi

          # ── Stage 3: Fallback to Gemini API ────────────────────────────────────
          GEMINI_KEY="${GEMINI_API_KEY:-}"
          if [ -n "$GEMINI_KEY" ]; then
            echo "AI: Falling back to Gemini 1.5 Pro..." >&2
            RESP=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=$GEMINI_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg prompt "$PROMPT" \
                '{contents: [{parts: [{text: $prompt}]}]}')" \
              --max-time 600 2>/dev/null || echo "")
            RESP_TEXT=$(echo "$RESP" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null)
            if [ -n "$RESP_TEXT" ]; then
              echo "$RESP_TEXT"
              exit 0
            fi
          fi

          # ── All backends exhausted ─────────────────────────────────────────────
          echo "ERROR: All AI backends failed. Check Ollama, GROQ_API_KEY, or GEMINI_API_KEY." >&2
          exit 1
          AICOMPLETE_EOF

          chmod +x /opt/zygor/bin/ai_complete
          sudo cp /opt/zygor/bin/ai_complete /usr/local/bin/ai_complete
          echo "✓ ai_complete engine built at /opt/zygor/bin/ai_complete"
          echo "ok=true" >> $GITHUB_OUTPUT

