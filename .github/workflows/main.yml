          chmod +x /opt/zygor/bin/spawn_vm.py
      - name: '🔍 Build subdomain takeover checker'
        shell: bash
        run: |
          cat > /opt/zygor/bin/check_takeover.py << 'TKEOF'
          #!/usr/bin/env python3
          import sys, dns.resolver
          TAKEOVER_SERVICES = {"s3.amazonaws.com":"AWS S3","github.io":"GitHub Pages","azurewebsites.net":"Azure"}
          def check(domain):
              try:
                  cname = str(dns.resolver.resolve(domain,'CNAME')[0].target).rstrip('.')
                  for fp,svc in TAKEOVER_SERVICES.items():
                      if fp in cname.lower(): return {"vulnerable":True,"service":svc}
              except: pass
              return {"vulnerable":False}
          if __name__ == '__main__':
              for d in sys.argv[1:]: print(f"{d}: {'VULNERABLE' if check(d)['vulnerable'] else 'SAFE'}")
          TKEOF
          chmod +x /opt/zygor/bin/check_takeover.py
      - name: '🌐 Build dynamic DNS tracker'
        shell: bash
        run: |
          cat > /opt/zygor/bin/dynamic_dns.py << 'DDNSEOF'
          #!/usr/bin/env python3
          import urllib.request, sys, os, json
          def get_public_ip():
              try: return json.loads(urllib.request.urlopen("https://api.ipify.org?format=json", timeout=10).read())["ip"]
              except: return "0.0.0.0"
          def update_duckdns(domain, token, ip):
              url = f"https://www.duckdns.org/update?domains={domain}&token={token}&ip={ip}"
              return "OK" in urllib.request.urlopen(url, timeout=30).read().decode()
          if __name__ == '__main__':
              prov = sys.argv[1] if len(sys.argv)>1 else "duckdns"
              domain = sys.argv[2] if len(sys.argv)>2 else "zygor"
              token = sys.argv[3] if len(sys.argv)>3 else os.environ.get("DUCKDNS_TOKEN","")
              ip = get_public_ip()
              if prov=="duckdns": success = update_duckdns(domain, token, ip)
              else: success=False
              print(f"DNS update {'succeeded' if success else 'failed'}")
          DDNSEOF
          chmod +x /opt/zygor/bin/dynamic_dns.py
      - name: '🔔 Build notification dispatcher'
        shell: bash
        run: |
          cat > /opt/zygor/bin/notify.py << 'NOTEOF'
          #!/usr/bin/env python3
          import urllib.request, sys, json, os
          def send_discord(webhook, msg):
              req = urllib.request.Request(webhook, data=json.dumps({"content":msg}).encode(), headers={"Content-Type":"application/json"})
              try: return urllib.request.urlopen(req, timeout=15).status == 204
              except: return False
          def send_slack(webhook, msg):
              req = urllib.request.Request(webhook, data=json.dumps({"text":msg}).encode(), headers={"Content-Type":"application/json"})
              try: return urllib.request.urlopen(req, timeout=15).status == 200
              except: return False
          if __name__ == '__main__':
              if len(sys.argv)<4: sys.exit(1)
              mode, msg, webhook = sys.argv[1], sys.argv[2], sys.argv[3]
              if mode=="discord": send_discord(webhook, msg)
              elif mode=="slack": send_slack(webhook, msg)
          NOTEOF
          chmod +x /opt/zygor/bin/notify.py
      - name: '📱 Launch Telegram Bot Controller'
        if: env.TELEGRAM_ENABLE == 'true'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "No token, skipping"; exit 0; fi
          cat > /opt/zygor/bin/telegram_controller.py << 'PYEOF'
          #!/usr/bin/env python3
          import asyncio, os, subprocess, logging, json, time
          from telegram import Update
          from telegram.ext import Application, CommandHandler, ContextTypes
          TOKEN = os.environ.get('TELEGRAM_BOT_TOKEN','')
          CHAT_ID = os.environ.get('TELEGRAM_CHAT_ID','')
          ALLOWED = [CHAT_ID] if CHAT_ID else []
          logging.basicConfig(filename='/var/log/zygor/telegram_bot.log', level=logging.INFO)
          async def start(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
              if str(update.effective_chat.id) not in ALLOWED and ALLOWED: return
              await update.message.reply_text("⚡ ZYGOR v4.0 Bot online. Use /help")
          async def help_cmd(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
              await update.message.reply_text("/scan <target> - Nmap scan\n/ai <query> - AI chat\n/abort - Stop workflow")
          async def scan(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
              target = ' '.join(ctx.args) if ctx.args else os.environ.get('TARGET','127.0.0.1')
              await update.message.reply_text(f"Scanning {target}...")
              proc = await asyncio.create_subprocess_shell(f"nmap -T4 -F {target}", stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
              stdout, _ = await proc.communicate()
              await update.message.reply_text(stdout.decode()[:4000])
          async def ai(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
              query = ' '.join(ctx.args)
              if not query: return
              proc = await asyncio.create_subprocess_exec('/opt/zygor/bin/ai_complete','2048', stdin=asyncio.subprocess.PIPE, stdout=asyncio.subprocess.PIPE)
              out, _ = await proc.communicate(input=query.encode())
              await update.message.reply_text(out.decode()[:4000])
          async def abort(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
              token = os.environ.get('GITHUB_TOKEN_ABORT','')
              repo = os.environ.get('GITHUB_REPO','')
              run_id = os.environ.get('GITHUB_RUN_ID','')
              if token and repo and run_id:
                  subprocess.run(f"curl -s -X POST -H 'Authorization: token {token}' 'https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel'", shell=True)
              await update.message.reply_text("Abort signal sent")
          def main():
              app = Application.builder().token(TOKEN).build()
              app.add_handler(CommandHandler("start", start))
              app.add_handler(CommandHandler("help", help_cmd))
              app.add_handler(CommandHandler("scan", scan))
              app.add_handler(CommandHandler("ai", ai))
              app.add_handler(CommandHandler("abort", abort))
              app.run_polling()
          if __name__ == '__main__': main()
          PYEOF
          chmod +x /opt/zygor/bin/telegram_controller.py
          nohup python3 /opt/zygor/bin/telegram_controller.py > /var/log/zygor/telegram_bot.log 2>&1 &
      - name: '∞ Self-re-trigger mechanism (24/7 operation)'
        shell: bash
        run: |
          MAX_SECONDS=$(( ${MAX_HOURS:-6} * 3600 ))
          SLEEP_TIME=$(( MAX_SECONDS - 1800 ))
          [ $SLEEP_TIME -lt 300 ] && SLEEP_TIME=300
          (
            sleep $SLEEP_TIME
            PAYLOAD=$(jq -n --arg target "${TARGET}" --arg lhost "${LHOST}" --arg lport "${LPORT}" --arg ai_model "${AI_MODEL}" --arg phase "${PHASE}" --arg exfil "${ENABLE_EXFIL}" --arg hours "${MAX_HOURS}" --arg chat_ops "${CHAT_OPS}" --arg issue "${CHAT_ISSUE}" --arg backup "${BACKUP_PROVIDER}" --arg telegram "${TELEGRAM_ENABLE}" --arg telegram_id "${TELEGRAM_CHAT_ID}" '{ref:"main",inputs:{target:$target,lhost:$lhost,lport:$lport,ai_model:$ai_model,penetration_phase:$phase,enable_exfiltration:$exfil,run_duration_hours:$hours,enable_chat_ops:$chat_ops,chat_issue_number:$issue,backup_provider:$backup,telegram_enable:$telegram,telegram_chat_id:$telegram_id}}')
            curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN_ABORT}" -H "Accept: application/vnd.github.v3+json" -d "$PAYLOAD" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/zygor-supreme.yml/dispatches"
          ) & disown
      - name: '🔔 Send startup notification'
