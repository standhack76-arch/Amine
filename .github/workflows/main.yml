          #!/usr/bin/env python3
          """
          ZYGOR Subdomain Takeover Checker
          Checks for dangling DNS records vulnerable to subdomain takeover.
          Supports: AWS S3, CloudFront, GitHub Pages, Heroku, Azure, GCP, etc.
          """
          import subprocess, sys, json, dns.resolver, socket

          TAKEOVER_SERVICES = {
              "s3.amazonaws.com": "AWS S3 Bucket",
              "cloudfront.net": "AWS CloudFront",
              "github.io": "GitHub Pages",
              "herokuapp.com": "Heroku",
              "azurewebsites.net": "Azure App Service",
              "azureedge.net": "Azure CDN",
              "trafficmanager.net": "Azure Traffic Manager",
              "cloudapp.net": "Azure Cloud Services",
              "elb.amazonaws.com": "AWS ELB",
              "firebaseio.com": "Firebase",
              "surge.sh": "Surge",
              "netlify.app": "Netlify",
              "pages.dev": "Cloudflare Pages",
              "workers.dev": "Cloudflare Workers",
              "pantheonsite.io": "Pantheon",
              "unbouncepages.com": "Unbounce",
              "statuspage.io": "Atlassian Statuspage",
              "freshdesk.com": "Freshdesk",
              "zendesk.com": "Zendesk"
          }

          def check_subdomain(domain: str) -> dict:
              result = {"domain": domain, "cname": None, "vulnerable": False, "service": None}
              try:
                  answers = dns.resolver.resolve(domain, 'CNAME')
                  for rdata in answers:
                      cname = str(rdata.target).rstrip('.')
                      result["cname"] = cname
                      for fingerprint, service in TAKEOVER_SERVICES.items():
                          if fingerprint in cname.lower():
                              # Verify the CNAME target doesn't resolve
                              try:
                                  socket.gethostbyname(cname)
                              except socket.gaierror:
                                  result["vulnerable"] = True
                                  result["service"] = service
                              break
              except dns.resolver.NoAnswer:
                  pass
              except dns.resolver.NXDOMAIN:
                  result["vulnerable"] = True
                  result["service"] = "Unregistered domain"
              except Exception as e:
                  result["error"] = str(e)
              return result

          if __name__ == '__main__':
              domains = sys.argv[1:] if len(sys.argv) > 1 else []
              if not domains:
                  print("Usage: check_takeover.py <domain1> <domain2> ...")
                  sys.exit(1)
              for domain in domains:
                  result = check_subdomain(domain)
                  status = "⚠️ VULNERABLE" if result["vulnerable"] else "✓ SAFE"
                  print(f"{status} | {domain} -> {result.get('cname', 'No CNAME')} | {result.get('service', 'N/A')}")
          TKEOF
          chmod +x /opt/zygor/bin/check_takeover.py
          echo "✓ Subdomain takeover checker built"

