name: ZYGOR v4.0 - The Unchained Autonomous AI Pentest & Web Forge Framework

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target IP range, subnet, domain, or single host'
        required: true
        default: '127.0.0.1'
      lhost:
        description: 'Your listener IP (LHOST) for reverse shells'
        required: false
        default: ''
      lport:
        description: 'Listener port (LPORT) for reverse shells'
        required: false
        default: '4444'
      ai_model:
        description: 'Ollama uncensored model (with fallback)'
        required: true
        default: 'dolphin-mixtral'
        type: choice
        options:
          - dolphin-mixtral
          - wizard-vicuna-uncensored
          - hermes-3-llama-3.2-uncensored
          - mistral
          - mixtral
          - codellama
          - deepseek-coder-v2
          - yi-coder
          - llama3.1:8b
          - gemma:7b
          - phi
          - neural-chat
          - openchat
          - zephyr
      penetration_phase:
        description: 'Attack phase(s)'
        required: true
        default: 'full'
        type: choice
        options:
          - recon
          - exploitation
          - web_forge
          - full
      run_duration_hours:
        description: 'Max run time (hours)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
      telegram_chat_id:
        description: 'Telegram chat ID'
        required: false
        default: ''
      telegram_bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  security-events: write
  deployments: write
  packages: write
  statuses: write

env:
  OLLAMA_HOST: '0.0.0.0:11434'
  OLLAMA_READ_TIMEOUT: '3600'
  OLLAMA_KEEP_ALIVE: '24h'
  OLLAMA_MODEL_CACHE: '/home/runner/.ollama/models'
  TARGET: ${{ github.event.inputs.target || '127.0.0.1' }}
  LHOST: ${{ github.event.inputs.lhost || '' }}
  LPORT: ${{ github.event.inputs.lport || '4444' }}
  AI_MODEL: ${{ github.event.inputs.ai_model || 'dolphin-mixtral' }}
  PHASE: ${{ github.event.inputs.penetration_phase || 'full' }}
  MAX_HOURS: ${{ github.event.inputs.run_duration_hours || '6' }}
  GITHUB_TOKEN_ABORT: ${{ secrets.GITHUB_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || '' }}
  TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN || '' }}
  GITHUB_REPO: ${{ github.repository }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_REF: ${{ github.actor }} ${{ github.workflow }}

jobs:
  # ============================================================================
  # BOOTSTRAP - Full Infrastructure Setup with Free AI
  # ============================================================================
  bootstrap:
    name: Bootstrap - Free Unlimited AI Engine
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      ai_ready: ${{ steps.ai_status.outputs.ok }}
      bot_pid: ${{ steps.launch_bot.outputs.bot_pid }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System Update & Toolchain
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl wget git jq python3 python3-pip nmap massan netcat-openbsd \
            metasploit-framework nuclei seclists john hashcat ffuf sqlmap \
            dnsutils net-tools tcpdump hydra nikto whatweb exploitdb \
            tor proxychains4 2>/dev/null || true

      - name: Install Python Packages
        shell: bash
        run: |
          pip3 install --quiet --break-system-packages --upgrade pip 2>/dev/null || true
          pip3 install --quiet --break-system-packages \
            requests beautifulsoup4 pwntools impacket scapy colorama rich \
            dnspython flask fastapi uvicorn python-telegram-bot asyncio \
            aiohttp cryptography paramiko docker kubernetes \
            pillow matplotlib pandas numpy 2>/dev/null || true

      - name: Create ZYGOR Directories
        shell: bash
        run: |
          sudo mkdir -p /opt/zygor/{bin,templates,wordlists,payloads,reports,logs,c2,dashboard,cache}
          sudo chmod -R 777 /opt/zygor

      - name: Install & Start Ollama (Free Unlimited)
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          export PATH=$PATH:/usr/local/bin
          sudo systemctl stop ollama 2>/dev/null || true
          ollama serve > /var/log/zygor/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "[OK] Ollama ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Pull AI Model (Free, No Keys Needed)
        id: pull_model
        shell: bash
        run: |
          MODEL="${{ env.AI_MODEL }}"
          echo "[*] Pulling model: $MODEL"
          if ollama pull "$MODEL" 2>&1; then
            echo "[OK] Model $MODEL ready"
            echo "pulled=true" >> $GITHUB_OUTPUT
            echo "final_model=$MODEL" >> $GITHUB_OUTPUT
          else
            echo "[*] Failed, trying fallbacks..."
            for fb in dolphin-mixtral llama3.1:8b mistral phi gemma:7b; do
              if ollama pull "$fb" 2>&1; then
                echo "[OK] Using fallback: $fb"
                echo "pulled=true" >> $GITHUB_OUTPUT
                echo "final_model=$fb" >> $GITHUB_OUTPUT
                break
              fi
            done
          fi
          # Keep model warm
          model=$(cat $GITHUB_OUTPUT | grep final_model | cut -d= -f2)
          if [ -n "$model" ]; then
            (while true; do
              curl -s -X POST http://localhost:11434/api/generate \
                -d "{\"model\": \"$model\", \"prompt\": \"ping\", \"keep_alive\": -1}" \
                --max-time 30 >/dev/null 2>&1
              sleep 300
            done) & disown
          fi

      - name: Build AI Completion Engine (100% Free - Multi Backend)
        id: ai_status
        shell: bash
        run: |
          cat > /opt/zygor/bin/ai_complete << 'AICOMPLETE'
          #!/bin/bash
          set -euo pipefail
          PROMPT="$(cat -)"
          MAX="${1:-4096}"
          MODEL="${AI_MODEL:-dolphin-mixtral}"
          
          # BACKEND 1: Ollama (FREE, LOCAL, UNLIMITED)
          for i in $(seq 1 3); do
            RESP=$(curl -s -X POST http://localhost:11434/api/generate \
              -d "$(jq -n --arg m "$MODEL" --arg p "$PROMPT" \
                '{model: $m, prompt: $p, stream: false, keep_alive: -1, 
                  options: {num_predict: 8192, temperature: 0.85, 
                            repeat_penalty: 1.1, top_k: 60, top_p: 0.92}}')" \
              --max-time 600 2>/dev/null || echo "")
            if echo "$RESP" | jq -e '.response' >/dev/null 2>&1; then
              echo "$RESP" | jq -r '.response'
              exit 0
            fi
            sleep 2
          done
          
          # BACKEND 2: Python Local AI (ALWAYS WORKS, FREE, UNLIMITED)
          python3 << 'PYEOF'
          import sys, os, json, random, textwrap, datetime, socket, subprocess, re, hashlib, base64
          
          prompt = sys.stdin.read().strip()
          target = os.environ.get('TARGET', '127.0.0.1')
          lhost = os.environ.get('LHOST', '')
          lport = os.environ.get('LPORT', '4444')
          phase = os.environ.get('PHASE', 'full')
          model = os.environ.get('AI_MODEL', 'dolphin-mixtral')
