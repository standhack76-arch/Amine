          chmod +x /opt/zygor/bin/ctf_solver.py

      - name: '🔔 Build Notify'
        shell: bash
        run: |
          cat > /opt/zygor/bin/notify.py << 'NOTEOF'
#!/usr/bin/env python3
import json, os, sys, urllib.request
def send(url, msg, platform='discord'):
    if platform == 'discord':
        data = json.dumps({"content":msg,"username":"ZYGOR"}).encode()
    else:
        data = json.dumps({"text":msg,"username":"ZYGOR"}).encode()
    req = urllib.request.Request(url, data=data, headers={"Content-Type":"application/json"})
    try: urllib.request.urlopen(req, timeout=15); return True
    except: return False
