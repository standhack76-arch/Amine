  abort_watchdog:
    name: '🛡️ Abort Watchdog (GitHub Issues + Telegram)'
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: always()
    steps:
      - name: '🔍 Check token and monitor abort commands'
        shell: bash
        run: |
          if [ -z "${GITHUB_TOKEN_ABORT}" ]; then
            echo "⚠️ GITHUB_TOKEN_ABORT is empty – abort watchdog disabled"
            exit 0
          fi
          echo "🛡️ Abort Watchdog active for run ${GITHUB_RUN_ID}"
          while true; do
            COMMENTS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN_ABORT}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${CHAT_ISSUE}/comments?per_page=5&sort=updated" 2>/dev/null)
            if echo "$COMMENTS" | grep -qi '/abort'; then
              echo "🛑 ABORT signal received from GitHub Issues!"
              curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN_ABORT}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" 2>/dev/null
              exit 0
            fi
            sleep 30
          done

  reconnaissance:
    name: '🔍 Phase 1 – Reconnaissance'
    needs: [bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: |
      github.event_name == 'schedule' ||
      inputs.penetration_phase == 'recon' ||
      inputs.penetration_phase == 'full'
    strategy:
      fail-fast: false
      matrix:
        module:
          - network_scan
          - web_discovery
          - ad_enum
          - wireless_survey
          - osint_gather
    steps:
      - name: '📥 Checkout repository'
        uses: actions/checkout@v4
      - name: '🔧 Set up AI tooling'
        shell: bash
        run: |
          export PATH="/opt/zygor/bin:$PATH"
          echo "PATH=/opt/zygor/bin:$PATH" >> $GITHUB_ENV
          mkdir -p /tmp/recon
      - name: '📡 Network Scan (nmap + masscan + arp-scan)'
        if: matrix.module == 'network_scan'
        shell: bash
        run: |
          echo "::group::Network Scan - $TARGET"
          nmap -T4 -A -p- --script vuln,exploit -oA /tmp/recon/nmap_full $TARGET 2>/dev/null || true
          masscan $TARGET --ports=1-65535 --rate=10000 -oX /tmp/recon/masscan.xml 2>/dev/null || true
          sudo arp-scan --localnet > /tmp/recon/arp_scan.txt 2>/dev/null || true
          echo "::endgroup::"
      - name: '🌐 Web Discovery (ffuf + subfinder + whatweb)'
        if: matrix.module == 'web_discovery'
        shell: bash
        run: |
          echo "::group::Web Discovery - $TARGET"
          subfinder -d $TARGET -o /tmp/recon/subdomains.txt 2>/dev/null || true
          whatweb $TARGET -a 3 --log-json=/tmp/recon/whatweb.json 2>/dev/null || true
          ffuf -u http://${TARGET}/FUZZ -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt -o /tmp/recon/ffuf_default.json -of json -t 50 2>/dev/null || true
          nuclei -u http://${TARGET} -severity critical,high,medium -o /tmp/recon/nuclei_web.txt 2>/dev/null || true
          echo "::endgroup::"
      - name: '🏢 AD/LDAP Enumeration'
        if: matrix.module == 'ad_enum'
        shell: bash
        run: |
          echo "::group::AD/LDAP Enumeration - $TARGET"
          ldapsearch -x -h $TARGET -p 389 -s base -b "" > /tmp/recon/ldap_base.txt 2>/dev/null || true
          bloodhound-python -d $TARGET -u guest -p '' -ns $TARGET -c all --zip -o /tmp/recon/bloodhound 2>/dev/null || true
          smbclient -L //$TARGET -N > /tmp/recon/smb_shares.txt 2>/dev/null || true
          echo "::endgroup::"
      - name: '📶 Wireless Survey'
        if: matrix.module == 'wireless_survey'
        shell: bash
        run: |
          echo "::group::Wireless Survey"
          iw dev 2>/dev/null || echo "No wireless interfaces"
          echo "::endgroup::"
      - name: '🕵️ OSINT Gathering'
        if: matrix.module == 'osint_gather'
        shell: bash
        run: |
          echo "::group::OSINT Gathering - $TARGET"
          dig any $TARGET > /tmp/recon/dns_records.txt 2>/dev/null || true
          whois $TARGET > /tmp/recon/whois_data.txt 2>/dev/null || true
          curl -s "https://crt.sh/?q=%25.${TARGET}&output=json" > /tmp/recon/cert_transparency.json 2>/dev/null || true
          echo "::endgroup::"
      - name: '📤 Upload recon artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-${{ matrix.module }}-${{ github.run_id }}
          path: /tmp/recon/
          if-no-files-found: warn

